<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

/* ===== 尺寸唯一来源 =====
   主界面只有「顶栏 + 棋盘 + 行动栏」三条，它们必须同宽才像一整列：
   --cell  → 单个格子边长（只由屏幕高宽算出，别处不准再写尺寸）
   --board-w = 8 格 + 7×2 格间距 + 4×2 内边距 = 棋盘实际宽度
   --bar-w   → 顶栏 / 行动栏宽度：跟棋盘一样宽，但别窄到装不下按钮 */
:root {
  --cell: clamp(34px,
    min(80px,
        calc((100dvh - 118px - 22px) / 8),
        calc((100vw - 24px - 22px) / 8)),
    80px);
  --board-w: calc(var(--cell) * 8 + 22px);
  --bar-w: max(var(--board-w), min(100%, 560px));
}

/* 整页固定一屏：不产生页面滚动条（内部各面板自己控制可见行数） */
body {
  background: #1a1a2e; color: #e0e0e0;
  font-family: "Microsoft YaHei", sans-serif;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 10px 12px;
  height: 100vh; height: 100dvh;
  overflow: hidden;
}

/* ========== 顶部安全区（避开摄像头 / 灵动岛） ========== */
/* 桌面浏览器没有这个区域，直接不显示；手机上是一条纯装饰的深色带，
   里面不放任何信息，靠 body 的 padding-top 把整页内容压到它下面 */
#cam-safe { display: none; }

/* ========== 顶栏 ========== */
/* 全文字：第几次挑战 / 第几层 / 第几回合 / 金币 / 谁的回合。
   标签淡色、数字金色放大，扫一眼就能读出当前进度。
   右侧按钮只留高频操作：结束回合 + 三个信息入口 + 存档
   （音效与重新挑战收进存档弹窗，不占主界面） */
#topbar {
  display: flex; gap: 14px; align-items: center;
  justify-content: space-between;
  padding: 6px 14px; background: #16213e;
  border-radius: 6px; margin-bottom: 8px;
  font-size: 13px; flex-wrap: nowrap;
  width: var(--bar-w); max-width: 100%;   /* 与棋盘严格同宽 */
}
#topbar .tb-info { display: flex; gap: 16px; align-items: center; flex-wrap: nowrap; }
#topbar .tb-i { white-space: nowrap; color: #9fb3d1; font-size: 12.5px; }
#topbar .tb-i b { color: #ffd166; font-size: 14.5px; margin: 0 1px; }
#topbar .tb-inc {
  color: #6b7794; font-style: normal; font-size: 10.5px;
  margin-left: 3px; white-space: nowrap;
}
/* 按钮组：桌面与其它项同一行排列（间距沿用 topbar 的 gap），移动端整行折到下面 */
#topbar .tb-btns { display: flex; gap: 7px; align-items: center; flex: 0 0 auto; }
#topbar button {
  padding: 5px 12px; background: #ffd166; border: none;
  border-radius: 4px; font-weight: bold; cursor: pointer;
  color: #1a1a2e; font-size: 12.5px; white-space: nowrap;
}
#topbar button:hover { background: #ffb703; }
#topbar button:disabled { background: #555; color: #999; cursor: not-allowed; }
/* 敌人回合：「结束回合」按钮本身变成状态牌，暗红底 + 明确文案 */
#topbar button.is-enemy:disabled { background: #4a2230; color: #ff8fa3; opacity: 1; }
/* 次级按钮：深底浅字，不跟「结束回合」抢注意力 */
#topbar .tb-dark {
  background: #263252; color: #c9d1e4; font-weight: normal;
  padding: 5px 10px; font-size: 12px;
}
#topbar .tb-dark:hover { background: #33405f; color: #fff; }
#topbar .tb-meta {
  background: #263252; color: #ffd166; font-weight: bold; font-size: 12px;
  border: 1px solid #3d4f78;
}
#topbar .tb-meta:hover { background: #33405f; color: #ffe08a; }

/* ========== 行动栏 ========== */
/* 界面上唯一常驻的「操作 + 最新动态」条：
   未选中单位时显示最新一条日志，选中后右侧是四条指令。
   固定高度 + 单行 + overflow:hidden，绝不会被内容撑开把棋盘顶下去 */
#action-bar {
  display: flex; gap: 10px; align-items: center;
  padding: 0 16px; background: #16213e;
  border-radius: 6px; margin: 0 0 8px;
  font-size: 13px; height: 34px; overflow: hidden;
  flex-wrap: nowrap;
  width: var(--bar-w); max-width: 100%;   /* 与棋盘严格同宽 */
  flex: 0 0 auto;
}
/* 角色名是个按钮：点它 = 取消选中（点自己脚下格子已经被「待命」占用了） */
#action-bar .who {
  color: #ffd166; font-weight: bold; flex: 0 0 auto;
  background: none; border: none; padding: 0; margin: 0;
  font-family: inherit; font-size: 13px; cursor: pointer;
  white-space: nowrap;
}
#action-bar .who:hover { color: #fff1c1; }
#action-bar .hint {
  color: #8ecae6; flex: 1 1 0%; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* 最新一条日志沿用它自己的类型颜色（.log-player / .log-kill …），
   这里只保证它同样单行省略 */
#action-bar .ab-latest { color: #9fb3d1; }
#action-bar .ab-latest:empty::before {
  content: '点棋盘上的己方单位开始行动 —— 每回合「移动一次 + 攻击 / 技能 / 待命（再点自己）」';
  color: #6b7794;
}
#action-bar .shape-tag, #action-bar .hint-forest { flex: 0 0 auto; }
#action-bar .act-group {
  margin-left: auto; display: flex; gap: 5px; align-items: center;
  flex: 0 0 auto;
}
#action-bar .act-group button {
  padding: 5px 11px; background: #4cc9f0;
  border: none; border-radius: 4px; font-weight: bold; cursor: pointer;
  color: #1a1a2e; font-size: 12.5px; flex: 0 0 auto;
  margin-left: 0; white-space: nowrap;
}
#action-bar .act-group button.skill { background: #c77dff; }
#action-bar .act-group button:hover { background: #7bdcff; }
#action-bar .act-group button.skill:hover { background: #e0aaff; }
#action-bar .act-group button.on { box-shadow: inset 0 0 0 2px #ffd166; }
#action-bar .act-group button:disabled {
  background: #333a4d; color: #767e96; cursor: not-allowed;
}

/* ========== 主布局 ========== */
/* 主区只剩棋盘：装备栏 / 日志栏 / 卡牌条全部撤出主视图 */
/* 棋盘紧贴行动栏下方（flex-start），多余的竖向空间全留在底部：
   行动栏挪到棋盘上方后，如果还居中，栏和棋盘之间会空出一大截，看着像两块东西 */
#main {
  display: flex; align-items: flex-start; justify-content: center;
  flex: 0 1 auto; min-height: 0;
}

/* 棋盘列 */
#board-col {
  display: flex; flex-direction: column; align-items: center;
}

/* ========== 地图 ========== */
#board-wrap {
  position: relative;
  display: flex; flex-direction: column; align-items: center;
}
#board {
  /* 格子尺寸由 :root 统一给出（见文件顶部 --cell），这里直接继承，
     不再重复定义 —— 否则顶栏 / 行动栏没法跟着棋盘变宽 */
  display: grid;
  grid-template-columns: repeat(8, var(--cell));
  grid-template-rows: repeat(8, var(--cell));
  gap: 2px; background: #333; padding: 4px;
  border-radius: 6px;
}

/* 空格 */
.cell {
  width: var(--cell); height: var(--cell);
  background: #2a2a3a; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: calc(var(--cell) * 0.43); cursor: pointer;
  position: relative; user-select: none;
  transition: background 0.15s;
  border: 2px solid transparent;
}

/* ========== 地形（纯 CSS 纹理 + emoji，不使用任何图片素材） ==========
   地形只靠「底色 + 纹理 + 图标」区分，不再描边框 ——
   边框留给敌我阵营，一眼就能看出哪格是自己人、哪格是敌人 */
.cell.terrain-forest {
  background-image: repeating-linear-gradient(45deg,
    rgba(123,255,207,0.14) 0 4px, rgba(0,0,0,0) 4px 9px);
}
.cell.terrain-river {
  background-color: #123a5c;
  background-image: repeating-linear-gradient(180deg,
    rgba(123,220,255,0.22) 0 2px, rgba(0,0,0,0) 2px 8px);
  animation: riverFlow 2.4s linear infinite;
}
@keyframes riverFlow {
  0%   { background-position: 0 0; }
  100% { background-position: 0 10px; }
}
.cell.terrain-mountain {
  background-color: #34343f;
  background-image: repeating-linear-gradient(135deg,
    rgba(205,210,225,0.18) 0 3px, rgba(0,0,0,0) 3px 9px);
}
.terrain-icon { font-size: calc(var(--cell) * 0.46); opacity: 0.85; }

/* 地形图例（棋盘下方） */
/* （地形 / 形状说明已移入日志栏上栏，见文件末尾 #log-tips 一节） */

/* 行动栏：身处森林的提示 */
#action-bar .hint-forest { color: #6fbf9a; }

/* 阵营：边框 + 内发光 + 血条 三重区分
   地形不再描边，边框专门用来标敌我 —— 一眼看清哪格是自己人 */
.cell.ally {
  background-color: #14342a;
  border-color: #2fbf88;
  box-shadow: inset 0 0 10px rgba(6, 214, 160, 0.28), 0 0 4px rgba(6, 214, 160, 0.3);
  text-shadow: 0 2px 3px rgba(0, 0, 0, 0.85);
}
.cell.ally .hp-fill { background: #06d6a0; }
.cell.enemy {
  background-color: #3a1220;
  border-color: #ef476f;
  box-shadow: inset 0 0 10px rgba(239, 71, 111, 0.32), 0 0 4px rgba(239, 71, 111, 0.3);
  text-shadow: 0 2px 3px rgba(0, 0, 0, 0.85);
}
.cell.enemy .hp-fill { background: #ff4d6d; }

/* 鸟人 / BOSS：金 / 品红描边 + 外发光，始终是场上最亮的两个点 */
.cell.hero {
  border-color: #ffd166 !important;
  box-shadow: inset 0 0 12px rgba(255, 209, 102, 0.35), 0 0 12px rgba(255, 209, 102, 0.8);
}
.cell.boss {
  border-color: #ff006e !important;
  box-shadow: inset 0 0 14px rgba(255, 0, 110, 0.4), 0 0 14px rgba(255, 0, 110, 0.85);
}

/* 已行动 */
.cell.done { opacity: 0.4; }

/* 高亮 */
.cell.moveable { background-color: rgba(45, 106, 79, 0.66); }
.cell.moveable:hover { background-color: rgba(64, 145, 108, 0.8); }
.cell.attackable { background-color: #9d0208; }
.cell.attackable:hover { background-color: #d00000; }
.cell.selected { outline: 2px solid #ffd166; outline-offset: -2px; }

/* 血条 */
.hp-bar {
  position: absolute; bottom: 2px; left: 4px; right: 4px;
  height: 4px; background: #000; border-radius: 2px; overflow: hidden;
  box-shadow: 0 0 3px rgba(0,0,0,0.9);
}
.hp-fill { height: 100%; transition: width 0.2s; }

/* 等级角标 */
.lv-badge {
  position: absolute; top: 1px; left: 3px;
  font-size: 9px; color: #ffd166;
  text-shadow: 0 0 3px #000;
  font-weight: bold;
}

/* ========== 日志 / 说明弹窗 ========== */
/* 主界面上不再有常驻日志栏：
   · 最新一条显示在行动栏（#action-bar .ab-latest）
   · 全量清单在「日志」弹窗（.log-modal）
   · 地形 / 单位 / 操作在「说明」弹窗（.help-modal）
   共用的一份文字样式挂在 .help-modal / .log-modal 上，统一成 .tu-* / .hp-* 两套 */

/* ---- 说明弹窗 ---- */
.modal.help-modal {
  width: 92vw; max-width: 460px;
  max-height: 86vh; overflow-y: auto;
  text-align: left;
}
.help-modal .hp-sec { margin-bottom: 12px; }
.help-modal .hp-h {
  color: #ffd166; font-weight: bold; font-size: 12.5px;
  border-bottom: 1px solid #0f3460; padding-bottom: 3px; margin-bottom: 5px;
}
.help-modal .hp-sub { color: #6b7794; font-weight: normal; font-size: 10.5px; margin-left: 6px; }
.help-modal .hp-line { color: #8a93a8; font-size: 12px; line-height: 1.6; }
.help-modal .hp-line b { color: #cfd6e4; }
.help-modal .hp-heal {
  margin-top: 5px; color: #06d6a0; font-size: 11.5px;
  background: rgba(6, 214, 160, 0.08);
  border: 1px solid rgba(6, 214, 160, 0.28);
  border-radius: 4px; padding: 2px 7px;
}
.help-modal .hp-heal b { color: #7bffcf; }
.help-modal .hp-link {
  color: #7bdcff; cursor: pointer; font-size: 11.5px;
  text-decoration: underline dotted; margin: 4px 0 2px;
}
.help-modal .hp-link:hover { color: #ffd166; }

/* 地形图例（terrainLegendHtml） */
.help-modal .tu-line { color: #8a93a8; font-size: 11.5px; line-height: 1.6; }
.help-modal .tu-line b { color: #cfd6e4; }

/* ---- 日志弹窗 ---- */
.modal.log-modal {
  width: 92vw; max-width: 520px;
  display: flex; flex-direction: column;
  max-height: 86vh; overflow: hidden;
}
.log-modal .lg-sub { color: #8ea4c6; font-size: 11.5px; margin: -6px 0 8px; }
.log-modal .lg-body {
  flex: 1 1 auto; min-height: 140px; overflow-y: auto;
  background: #0b1730; border: 1px solid #14345c; border-radius: 6px;
  padding: 8px 10px;
}
.log-modal .lg-row {
  font-size: 12px; line-height: 1.65; color: #aaa;
  word-break: break-all;
}
.log-modal .lg-empty { color: #6b7794; font-size: 12px; }

/* 日志类型配色（行动栏最新一条与日志弹窗共用） */
.log-player { color: #80ed99; }
.log-enemy { color: #ff8fa3; }
.log-system { color: #ffd166; }
.log-kill { color: #ff006e; font-weight: bold; }
.log-heal { color: #4cc9f0; }
.log-taunt-hero { color: #ffd166; font-style: italic; font-weight: bold; }
.log-taunt-boss { color: #ff006e; font-style: italic; font-weight: bold; }
.log-levelup { color: #ffd60a; font-weight: bold; }
.log-exp { color: #b8b8d1; }
.log-crit { color: #ffd166; font-weight: bold; }
.log-skill { color: #c77dff; }
.log-miss { color: #9aa6c0; }

/* ========== 弹幕日志（从右往左飘） ========== */
/* 全屏覆盖但 pointer-events:none —— 演出归演出，点击照样穿过去。
   z-index 低于回合弹字(90)与弹窗(100)，高于棋盘特效(20~34)。 */
#danmaku-layer, #danmaku-layer-top {
  position: fixed; inset: 0;
  overflow: hidden; pointer-events: none;
}
#danmaku-layer { z-index: 55; }        /* 普通流水：弹窗下面 */
#danmaku-layer-top { z-index: 210; }   /* 结论大字：弹窗上面（强化时商店开着） */
.dm {
  position: absolute; left: 0; top: 0;
  display: inline-block;
  white-space: nowrap;
  font-size: 13px; line-height: 1;
  padding: 4px 11px;
  border-radius: 999px;
  background: rgba(6, 10, 24, 0.56);
  border: 1px solid rgba(120, 170, 255, 0.22);
  color: #dbe6ff;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.92);
  transform: translateX(100vw);
  animation-name: dm-fly;
  animation-timing-function: linear;
  animation-fill-mode: forwards;
  will-change: transform;
  backface-visibility: hidden;
}
@keyframes dm-fly {
  from { transform: translate3d(100vw, 0, 0); }
  to   { transform: translate3d(calc(-100% - 24px), 0, 0); }
}

/* 高频小流水（经验 / 回血 / 地形）：缩一号、压透明度，不抢主战斗线 */
.dm.minor {
  font-size: 11.5px; padding: 3px 9px;
  background: rgba(6, 10, 24, 0.46);
  opacity: 0.85;
}
/* 结论级大字（强化成败 / 奖励发放）：慢一点、亮一点 */
.dm.big {
  font-size: 16px; font-weight: bold; letter-spacing: 0.5px;
  padding: 6px 16px;
  background: rgba(10, 14, 32, 0.9);
  border-width: 1.5px;
}

/* 按日志类型的配色（.dm.t-<type>） */
.dm.t-player      { color: #a9e4ff; }
.dm.t-enemy       { color: #ffb3c1; }
.dm.t-kill        { color: #ffb37a; border-color: rgba(255, 150, 90, 0.45); }
.dm.t-heal        { color: #9df3b8; }
.dm.t-exp         { color: #ffe9a8; }
.dm.t-levelup     { color: #ffd166; border-color: rgba(255, 209, 102, 0.55); }
.dm.t-system      { color: #c3cde0; }
.dm.t-terrain     { color: #9db4d4; }
.dm.t-taunt-hero  { color: #a9c8ff; font-style: italic; }
.dm.t-taunt-boss  { color: #ff8fb0; font-style: italic; }
/* 战棋改版新增的三类（暴击 / 技能 / 闪避） */
.dm.t-crit  { color: #ffd166; border-color: rgba(255, 209, 102, 0.6); text-shadow: 0 0 12px rgba(255, 180, 60, 0.7); }
.dm.t-skill { color: #c77dff; border-color: rgba(199, 125, 255, 0.6); }
.dm.t-miss  { color: #9aa6c0; }

/* 强化 / 存档奖励的结论弹幕 */
.dm.t-big-ok {
  color: #7dffb0; border-color: rgba(125, 255, 176, 0.65);
  box-shadow: 0 0 18px rgba(125, 255, 176, 0.35);
}
.dm.t-big-bad {
  color: #ff8fa3; border-color: rgba(255, 143, 163, 0.65);
  box-shadow: 0 0 18px rgba(255, 100, 130, 0.32);
}

/* 移动端：弹幕更小、贴边更少，避免糊满棋盘 */
@media (max-width: 860px) {
  .dm { font-size: 11.5px; padding: 3px 9px; }
  .dm.big { font-size: 13.5px; padding: 5px 12px; }
  .dm.minor { font-size: 10.5px; }
}

/* ========== 通关三选一（商店删除后，金币花在这里） ========== */
/* 上面是三张卡，下面两个金币按钮：点一下当场结算，没有第二个弹窗 */
.modal.clear-modal {
  display: flex; flex-direction: column;
  max-height: 88vh; overflow: hidden;
}
.clr-sub {
  flex: 0 0 auto;
  color: #9fb3d1; font-size: 12px;
  margin: -4px 0 8px;
}
.clr-sub b { color: #ffd166; }
.modal.clear-modal #clear-cards { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
.clr-buys {
  flex: 0 0 auto;
  display: flex; gap: 8px; margin: 10px 0 2px;
}
.clr-buy {
  flex: 1 1 0; min-width: 0;
  padding: 9px 8px 7px;
  background: #0f3460; color: #8ecae6;
  border: 1px solid #1c4b7e; border-radius: 6px;
  font-family: inherit; font-size: 12.5px; font-weight: bold;
  cursor: pointer; line-height: 1.3;
}
.clr-buy i {
  display: block; margin-top: 3px;
  font-style: normal; font-size: 11px; font-weight: normal; color: #ffd166;
}
.clr-buy:hover { background: #14406f; border-color: #4cc9f0; }
.clr-buy:disabled { background: #232a3d; border-color: #2c3550; color: #6b7794; cursor: not-allowed; }
.clr-buy:disabled i { color: #6b7794; }


/* ========== 卡牌清单弹窗 ========== */
/* 主界面上已经没有卡牌条了：顶栏「卡牌 N」直接打开这份清单 */
.modal.card-modal {
  min-width: 480px; max-width: 560px;
  display: flex; flex-direction: column;
  max-height: 86vh; overflow: hidden;
}
.card-modal .cl-sub { color: #8ea4c6; font-size: 12px; margin: -6px 0 10px; }
.card-modal .cl-body { flex: 1 1 auto; overflow-y: auto; min-height: 0; padding-right: 4px; }
.cl-sec { margin-bottom: 12px; }
.cl-sec-h {
  color: #4cc9f0; font-size: 12px; font-weight: bold;
  padding-bottom: 4px; margin-bottom: 4px;
  border-bottom: 1px solid rgba(76, 201, 240, 0.2);
}
.cl-row {
  display: grid; grid-template-columns: 132px 1fr; gap: 10px;
  padding: 5px 2px; align-items: baseline;
  border-bottom: 1px dashed rgba(255, 255, 255, 0.06);
}
.cl-name {
  font-weight: bold; font-size: 12.5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cl-dot {
  display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  margin-right: 6px; vertical-align: middle; font-style: normal;
}
.cl-desc { color: #c7d2e4; font-size: 12px; line-height: 1.5; }
.cl-stk  { color: #ffd166; font-size: 11px; margin-left: 6px; white-space: nowrap; }
.cl-when { display: block; color: #ffb703; font-size: 11px; margin-top: 2px; }
.cl-empty { color: #8ea4c6; font-size: 12.5px; line-height: 1.75; padding: 12px 4px; }
.cl-legend { color: #6b7794; font-size: 11px; margin-top: 8px; }

/* ========== 飘字 ========== */
.float-text {
  position: absolute; pointer-events: none;
  font-weight: bold; font-size: 15px;
  text-shadow: 0 0 4px #000, 0 0 4px #000;
  animation: floatUp 1.2s ease-out forwards;
  z-index: 20; white-space: nowrap;
}
@keyframes floatUp {
  0%   { transform: translate(-50%, 0) scale(0.8); opacity: 0; }
  20%  { transform: translate(-50%, -10px) scale(1.2); opacity: 1; }
  100% { transform: translate(-50%, -50px) scale(1); opacity: 0; }
}
.float-dmg { color: #ff5252; }
.float-crit { color: #ff9f1c; font-size: 18px; }
.float-miss { color: #adb5bd; }
.float-move { color: #06d6a0; font-size: 13px; }
.float-kill { color: #ff006e; font-size: 16px; }
.float-heal { color: #4cc9f0; font-size: 16px; }
.float-exp { color: #b5179e; font-size: 13px; }
.float-levelup { color: #ffd60a; font-size: 18px; }

/* ========== 弹窗 ========== */
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
}
.modal {
  background: #16213e; border-radius: 8px;
  padding: 20px; min-width: 340px; max-width: 520px;
  border: 1px solid #4cc9f0;
  max-height: 90vh; overflow-y: auto;
}
.modal h2 { color: #ffd166; font-size: 18px; margin-bottom: 12px; }
.modal .card-option {
  background: #0f3460; border-radius: 6px;
  padding: 10px; margin-bottom: 8px;
  cursor: pointer; border: 1px solid transparent;
  transition: all 0.15s;
}
.modal .card-option:hover { border-color: #ffd166; }
.modal .card-option .card-name { font-weight: bold; }
.modal .card-option .card-desc { color: #ccc; font-size: 12px; margin-top: 4px; }
.modal .btn {
  display: block; width: 100%; padding: 10px;
  background: #ffd166; border: none; border-radius: 4px;
  font-weight: bold; cursor: pointer; color: #1a1a2e;
  margin-top: 8px; font-size: 13px;
}
.modal .btn:hover { background: #ffb703; }
.modal .btn:disabled { background: #333; color: #666; cursor: not-allowed; }

button:disabled { opacity: 0.5; cursor: not-allowed; }

/* ============================================================
   攻击特效（纯 CSS，无图片素材）
   ============================================================ */

/* 攻击轨迹光束 */
.fx-beam {
  position: absolute; height: 4px; border-radius: 2px;
  transform-origin: 0 50%;
  background: linear-gradient(90deg, rgba(255,255,255,0), #eaf9ff 22%, #7bdcff 62%, rgba(123,220,255,0));
  box-shadow: 0 0 10px #7bdcff, 0 0 20px rgba(123,220,255,0.65);
  pointer-events: none; z-index: 26;
  animation: fxBeam 0.5s cubic-bezier(.2,.85,.2,1) forwards;
}
.fx-beam.enemy {
  background: linear-gradient(90deg, rgba(255,255,255,0), #ffd9d9 22%, #ff5252 62%, rgba(255,82,82,0));
  box-shadow: 0 0 10px #ff5252, 0 0 20px rgba(255,82,82,0.6);
}
.fx-beam.crit { height: 7px; box-shadow: 0 0 14px #ff9f1c, 0 0 28px rgba(255,159,28,0.75); }
.fx-beam.crit.enemy { box-shadow: 0 0 14px #ff5252, 0 0 28px rgba(255,82,82,0.75); }
@keyframes fxBeam {
  0%   { opacity: 0; transform: rotate(var(--ang)) scaleX(0.04); }
  32%  { opacity: 1; transform: rotate(var(--ang)) scaleX(1); }
  100% { opacity: 0; transform: rotate(var(--ang)) scaleX(1) translateX(8px); }
}

/* 命中闪光 */
.fx-flash {
  position: absolute; transform: translate(-50%, -50%);
  border-radius: 8px; pointer-events: none; z-index: 24;
  background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.4) 45%, rgba(255,255,255,0) 72%);
  animation: fxFlash 0.55s ease-out forwards;
}
.fx-flash.enemy { background: radial-gradient(circle, rgba(255,110,110,0.95) 0%, rgba(255,82,82,0.4) 45%, rgba(255,82,82,0) 72%); }
.fx-flash.crit { background: radial-gradient(circle, #fff 0%, #ffd166 40%, rgba(255,159,28,0) 75%); }
@keyframes fxFlash {
  0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.55); }
  22%  { opacity: 1; transform: translate(-50%,-50%) scale(1.06); }
  100% { opacity: 0; transform: translate(-50%,-50%) scale(1.28); }
}

/* 冲击环 */
.fx-ring {
  position: absolute; width: 20px; height: 20px; border-radius: 50%;
  border: 3px solid #7bdcff; transform: translate(-50%,-50%);
  box-shadow: 0 0 12px #7bdcff, inset 0 0 12px #7bdcff;
  pointer-events: none; z-index: 25;
  animation: fxRing 0.7s ease-out forwards;
}
.fx-ring.enemy { border-color: #ff5252; box-shadow: 0 0 12px #ff5252, inset 0 0 12px #ff5252; }
.fx-ring.crit { border-color: #ff9f1c; box-shadow: 0 0 20px #ff9f1c, inset 0 0 20px #ff9f1c; border-width: 4px; }
.fx-ring.ring2 { animation-duration: 0.88s; border-width: 2px; }
@keyframes fxRing {
  0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.2); }
  28%  { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%,-50%) scale(1.95); }
}

/* 近战交击火花（两道光刃交叉） */
.fx-clash {
  position: absolute; width: 46px; height: 46px;
  transform: translate(-50%,-50%); pointer-events: none; z-index: 27;
  background:
    linear-gradient(45deg, transparent 46%, #fff 49%, #fff 51%, transparent 54%),
    linear-gradient(-45deg, transparent 46%, #cdefff 49%, #cdefff 51%, transparent 54%);
  filter: drop-shadow(0 0 7px #7bdcff);
  animation: fxClash 0.55s ease-out forwards;
}
.fx-clash.crit {
  width: 62px; height: 62px;
  filter: drop-shadow(0 0 10px #ff9f1c);
  background:
    linear-gradient(45deg, transparent 46%, #fff 49%, #fff 51%, transparent 54%),
    linear-gradient(-45deg, transparent 46%, #ffd166 49%, #ffd166 51%, transparent 54%);
}
@keyframes fxClash {
  0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.3) rotate(0deg); }
  32%  { opacity: 1; transform: translate(-50%,-50%) scale(1.12) rotate(16deg); }
  100% { opacity: 0; transform: translate(-50%,-50%) scale(1.34) rotate(32deg); }
}

/* 阵亡爆裂 */
.fx-burst {
  position: absolute; width: 64px; height: 64px; border-radius: 50%;
  transform: translate(-50%,-50%); pointer-events: none; z-index: 28;
  background: radial-gradient(circle, #fff 0%, #ff006e 34%, rgba(255,0,110,0) 72%);
  animation: fxBurst 0.95s ease-out forwards;
}
.fx-burst.shard {
  background: radial-gradient(circle, rgba(255,209,102,0.9) 0%, rgba(255,209,102,0) 68%);
  animation-delay: 0.06s;
}
@keyframes fxBurst {
  0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.22); }
  18%  { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%,-50%) scale(2.15); }
}

/* 治疗光环 */
.fx-heal {
  position: absolute; width: 54px; height: 54px; border-radius: 50%;
  transform: translate(-50%,-50%); pointer-events: none; z-index: 24;
  border: 2px solid #06d6a0;
  box-shadow: 0 0 14px #06d6a0, inset 0 0 14px rgba(6,214,160,0.7);
  animation: fxHeal 0.9s ease-out forwards;
}
@keyframes fxHeal {
  0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.5); }
  28%  { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%,-135%) scale(1.1); }
}

/* 闪避 / 免疫 弧线 */
.fx-swoosh {
  position: absolute; width: 48px; height: 48px; border-radius: 50%;
  transform: translate(-50%,-50%); pointer-events: none; z-index: 24;
  border-top: 2px dashed #cfd6e4;
  border-right: 2px dashed #cfd6e4;
  animation: fxSwoosh 0.7s ease-out forwards;
}
@keyframes fxSwoosh {
  0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.6) rotate(-25deg); }
  30%  { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%,-50%) scale(1.25) rotate(25deg); }
}

/* ===== 形状特效：射手贯穿整行 / 法师贯穿整列 / 鸟人打一圈 =====
   统一 1.05s：前 55% 保持完整形状让人看清，后 45% 慢慢淡出
   （用户要求「攻击效果更明显、消失更慢」） */

/* 一箭穿一横排：从射手身上向左右各射一道，越远越淡（所以拆成左右两半） */
.fx-row-shot {
  position: absolute; pointer-events: none; z-index: 33;
  border-radius: 999px;
  box-shadow: 0 0 16px rgba(255, 209, 102, 0.9), 0 0 38px rgba(255, 159, 28, 0.55);
  animation: fxRowShot 1.05s cubic-bezier(.15, .8, .2, 1) forwards;
}
/* 左半：射手在右端（origin 100%），向右一端最亮。
   两层背景：宽的柔光 + 中间一条细亮核，看起来像一支箭穿过去 */
.fx-row-shot.left {
  transform-origin: 100% 50%;
  background-image:
    linear-gradient(270deg, #ffffff 0%, #ffffff 34%, rgba(255, 243, 207, 0) 100%),
    linear-gradient(270deg,
      rgba(255, 255, 255, 0.92) 0%, rgba(255, 243, 207, 0.9) 16%, rgba(255, 232, 170, 0.84) 44%,
      rgba(255, 209, 102, 0.64) 72%, rgba(255, 183, 3, 0.4) 92%, rgba(255, 159, 28, 0) 100%);
  background-size: 100% 26%, 100% 100%;
  background-position: 0 50%, 0 0;
  background-repeat: no-repeat;
}
/* 右半：射手在左端（origin 0），向左一端最亮 */
.fx-row-shot.right {
  transform-origin: 0 50%;
  background-image:
    linear-gradient(90deg, #ffffff 0%, #ffffff 34%, rgba(255, 243, 207, 0) 100%),
    linear-gradient(90deg,
      rgba(255, 255, 255, 0.92) 0%, rgba(255, 243, 207, 0.9) 16%, rgba(255, 232, 170, 0.84) 44%,
      rgba(255, 209, 102, 0.64) 72%, rgba(255, 183, 3, 0.4) 92%, rgba(255, 159, 28, 0) 100%);
  background-size: 100% 26%, 100% 100%;
  background-position: 0 50%, 0 0;
  background-repeat: no-repeat;
}
@keyframes fxRowShot {
  0%   { opacity: 0; transform: scaleX(0.02); }
  7%   { opacity: 1; }
  24%  { transform: scaleX(1); }
  64%  { opacity: 1; transform: scaleX(1); }
  100% { opacity: 0; transform: scaleX(1); }
}

/* 一术打一纵列：从法师身上向上下各贯一道光柱 */
.fx-col-shot {
  position: absolute; pointer-events: none; z-index: 33;
  border-radius: 999px;
  box-shadow: 0 0 16px rgba(123, 220, 255, 0.9), 0 0 38px rgba(164, 139, 255, 0.55);
  animation: fxColShot 1.05s cubic-bezier(.15, .8, .2, 1) forwards;
}
.fx-col-shot.up {
  transform-origin: 50% 100%;
  background-image:
    linear-gradient(0deg, #ffffff 0%, #ffffff 36%, rgba(221, 246, 255, 0) 100%),
    linear-gradient(0deg,
      rgba(255, 255, 255, 0.92) 0%, rgba(221, 246, 255, 0.9) 18%, rgba(170, 232, 255, 0.84) 46%,
      rgba(164, 180, 255, 0.62) 74%, rgba(164, 139, 255, 0.38) 93%, rgba(164, 139, 255, 0) 100%);
  background-size: 26% 100%, 100% 100%;
  background-position: 50% 0, 0 0;
  background-repeat: no-repeat;
}
.fx-col-shot.down {
  transform-origin: 50% 0;
  background-image:
    linear-gradient(180deg, #ffffff 0%, #ffffff 36%, rgba(221, 246, 255, 0) 100%),
    linear-gradient(180deg,
      rgba(255, 255, 255, 0.92) 0%, rgba(221, 246, 255, 0.9) 18%, rgba(170, 232, 255, 0.84) 46%,
      rgba(164, 180, 255, 0.62) 74%, rgba(164, 139, 255, 0.38) 93%, rgba(164, 139, 255, 0) 100%);
  background-size: 26% 100%, 100% 100%;
  background-position: 50% 0, 0 0;
  background-repeat: no-repeat;
}
@keyframes fxColShot {
  0%   { opacity: 0; transform: scaleY(0.02); }
  7%   { opacity: 1; }
  25%  { transform: scaleY(1); }
  64%  { opacity: 1; transform: scaleY(1); }
  100% { opacity: 0; transform: scaleY(1); }
}

/* 鸟人打一圈：以自身为圆心的冲击环（两层错开） */
.fx-ring8 {
  position: absolute; transform: translate(-50%, -50%);
  border-radius: 50%; pointer-events: none; z-index: 32;
  border: 5px solid #ffd166;
  /* 边缘一圈内侧辉光，让「打一圈」看得出是覆盖了身边 8 格 */
  background: radial-gradient(circle,
    rgba(255, 209, 102, 0) 52%, rgba(255, 209, 102, 0.16) 78%,
    rgba(255, 232, 170, 0.42) 94%, rgba(255, 209, 102, 0) 100%);
  box-shadow: 0 0 34px rgba(255, 209, 102, 1), 0 0 60px rgba(255, 159, 28, 0.6),
              inset 0 0 38px rgba(255, 159, 28, 0.7);
  animation: fxRing8 1.05s cubic-bezier(.15, .8, .2, 1) forwards;
}
.fx-ring8.wave2 {
  border-width: 3px; border-color: #ffb703;
  background: none;
  box-shadow: 0 0 22px rgba(255, 183, 3, 0.9), inset 0 0 22px rgba(255, 183, 3, 0.5);
}
@keyframes fxRing8 {
  0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.18); }
  12%  { opacity: 1; }
  34%  { transform: translate(-50%, -50%) scale(0.84); }
  62%  { opacity: 0.92; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.22); }
}

/* 出手闪光（射手 / 法师 / 鸟人 出手点） */
.fx-muzzle {
  position: absolute; width: 40px; height: 40px; border-radius: 50%;
  transform: translate(-50%, -50%); pointer-events: none; z-index: 34;
  background: radial-gradient(circle, #fff 0%, rgba(255, 209, 102, 0.85) 32%, rgba(255, 159, 28, 0) 72%);
  animation: fxMuzzle 0.75s ease-out forwards;
}
.fx-muzzle.big { width: 68px; height: 68px; }
@keyframes fxMuzzle {
  0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.35); }
  18%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.55); }
}

/* 暴击震屏 */
.fx-shake { animation: fxShake 0.3s ease-out; }
@keyframes fxShake {
  0%,100% { transform: translate(0,0); }
  20% { transform: translate(-2px, 1px); }
  40% { transform: translate(2px, -1px); }
  60% { transform: translate(-1px, -1px); }
  80% { transform: translate(1px, 1px); }
}

/* 可移动 / 可攻击 呼吸高亮 */
.cell.moveable { animation: movePulse 1.5s ease-in-out infinite; }
@keyframes movePulse {
  0%, 100% { box-shadow: inset 0 0 0 rgba(6,214,160,0); }
  50%      { box-shadow: inset 0 0 12px rgba(6,214,160,0.85); }
}
.cell.attackable { animation: atkPulse 0.95s ease-in-out infinite; }
@keyframes atkPulse {
  0%, 100% { box-shadow: inset 0 0 0 rgba(255,82,82,0); }
  50%      { box-shadow: inset 0 0 14px rgba(255,82,82,0.95); }
}
.cell.selected { animation: selPulse 1.1s ease-in-out infinite; }
@keyframes selPulse {
  0%, 100% { box-shadow: 0 0 4px #ffd166; }
  50%      { box-shadow: 0 0 16px #ffd166, inset 0 0 10px rgba(255,209,102,0.55); }
}

/* 飘字增强（层级高于特效，保证伤害数字始终可读） */
.float-text { z-index: 32; }
.float-dmg { color: #ff5252; }
.float-crit {
  color: #ff9f1c; font-size: 21px; letter-spacing: 0.5px;
  text-shadow: 0 0 6px #000, 0 0 12px #ff9f1c, 0 0 20px #ff9f1c;
  animation: floatUp 1.25s ease-out forwards, critShake 0.3s ease-out;
}
@keyframes critShake {
  0%,100% { margin-left: 0; }
  25% { margin-left: -3px; }
  75% { margin-left: 3px; }
}
.float-kill { color: #ff006e; font-size: 17px; text-shadow: 0 0 6px #000, 0 0 12px #ff006e; }
.float-heal { color: #06d6a0; font-size: 16px; text-shadow: 0 0 6px #000, 0 0 10px #06d6a0; }

/* ============================================================
   待发卡牌（只在抽卡弹窗里用到「待发」标记）
   ============================================================ */
.card-armed { color: #ffd166; font-size: 11px; }
.card-hero-only { color: #ffb703; font-size: 11px; }
.modal .card-option.is-armed { border-color: rgba(255,209,102,0.55); }

/* ============================================================
   存档面板（顶栏「存档」按钮）
   ============================================================ */
.modal.meta-modal {
  display: flex; flex-direction: column;
  width: 92vw; max-width: 460px;
  max-height: 88vh; overflow: hidden;
  text-align: left;
}
.modal.meta-modal > h2 { text-align: center; margin-bottom: 4px; }
.meta-sub {
  text-align: center; color: #9fb3d1; font-size: 12px;
  padding-bottom: 8px; margin-bottom: 4px;
  border-bottom: 1px solid #0f3460;
}
.meta-sub b { color: #ffd166; }

.meta-sec {
  color: #6b7794; font-size: 11px; letter-spacing: .5px;
  margin: 8px 0 4px;
}
.meta-vault {
  display: flex; flex-wrap: wrap; gap: 6px;
  background: #0f3460; border: 1px solid #1c4b7e;
  border-radius: 6px; padding: 7px 9px;
  font-size: 12px; color: #c9d1e4;
}
.meta-vault b { color: #ffd166; }
.meta-list { display: flex; flex-direction: column; gap: 4px; }
.meta-row {
  display: grid; grid-template-columns: 18px 168px 1fr;
  align-items: center; gap: 6px;
  background: #101d38; border: 1px solid #1a2b4d;
  border-radius: 5px; padding: 5px 8px;
  font-size: 11.5px; color: #7d879c;
}
.meta-row.on { border-color: #1c4b7e; color: #c9d1e4; }
.meta-ico { font-size: 13px; }
.meta-name { color: #8ecae6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta-row.on .meta-name { color: #4cc9f0; font-weight: bold; }
.meta-desc { color: #9fb3d1; }
.meta-row.on .meta-desc { color: #9df3b8; }
.meta-tip { color: #6b7794; font-size: 10.5px; line-height: 1.5; margin-top: 9px; }
.meta-foot {
  display: flex; gap: 8px; justify-content: space-between;
  margin-top: 10px; padding-top: 9px; border-top: 1px solid #0f3460;
}
.meta-foot .btn { display: inline-block; width: auto; margin-top: 0; padding: 7px 14px; font-size: 12.5px; }
.meta-foot .btn.danger { background: #40202c; color: #ffb3c1; }
.meta-foot .btn.danger:hover { background: #55283a; }

/* ============================================================
   通关结算弹窗（99 层）
   ============================================================ */
.modal.clear-modal { text-align: left; }
.modal.clear-modal > h2 { text-align: center; color: #ffd166; }
.gc-sub { text-align: center; color: #9fb3d1; font-size: 12px; margin-bottom: 10px; }
.gc-sec { color: #6b7794; font-size: 11px; letter-spacing: .5px; margin: 8px 0 4px; }
.gc-list {
  background: #0f3460; border: 1px solid #1c4b7e; border-radius: 6px;
  padding: 7px 10px; display: flex; flex-direction: column; gap: 5px;
  font-size: 12px; color: #c9d1e4;
}
.gc-row b { color: #ffd166; }
.gc-tip { color: #6b7794; font-size: 10.5px; line-height: 1.55; margin-top: 10px; }
.clear-modal .btn { margin-top: 12px; }

.fail-vault {
  color: #7f8ba3; font-size: 11px; line-height: 1.5;
  background: #101d38; border: 1px solid #1a2b4d; border-radius: 5px;
  padding: 6px 9px; margin-bottom: 10px;
}

/* ============================================================
   单位详情里的警告行
   ============================================================ */

/* ============================================================
   日志：地形 / 奇遇
   ============================================================ */
.log-terrain { color: #6fbf9a; }
.log-encounter { color: #c77dff; }

/* ============================================================
   奇遇弹窗
   ============================================================ */
.enc-modal { max-width: 480px; text-align: center; }
.enc-modal h2 { text-align: center; }
.enc-head { color: #8a93a8; font-size: 12px; margin-bottom: 10px; }
.enc-icon {
  font-size: 46px; line-height: 1.15; margin: 4px 0;
  animation: encFloat 2.6s ease-in-out infinite;
}
@keyframes encFloat {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}
.enc-title { color: #c77dff; font-weight: bold; font-size: 16px; margin-bottom: 8px; }
.enc-text {
  color: #ccc; font-size: 13px; line-height: 1.7; text-align: left;
  background: #0f3460; border-radius: 6px; padding: 10px 12px;
  border: 1px solid #1c4b7e; margin-bottom: 12px; white-space: pre-line;
}

/* 普攻能覆盖到的格子：一圈淡金虚线 —— 说明「我这一下够得到多远」 */
.cell.atk-range {
  box-shadow: inset 0 0 0 1px rgba(255, 209, 102, 0.38),
              inset 0 0 10px rgba(255, 209, 102, 0.10);
}
.cell.atk-range::after {
  content: ''; position: absolute; inset: 4px;
  border: 1px dashed rgba(255, 209, 102, 0.28); border-radius: 2px;
  pointer-events: none;
}
/* 范围里站着敌人 → 红色实底强提醒（点一下就开打） */
.cell.atk-range.attackable {
  background-color: #9d0208;
  box-shadow: inset 0 0 0 2px #ffd166, inset 0 0 14px rgba(255, 70, 70, 0.6);

  background-color: #5a189a;
  box-shadow: inset 0 0 0 2px #c77dff, 0 0 12px rgba(199, 125, 255, 0.55);
  animation: skillPulse 1.05s ease-in-out infinite;
}
.cell.skillable::after {
  content: ''; position: absolute; inset: 3px;
  border: 1px dashed rgba(255, 255, 255, 0.5); border-radius: 3px;
  pointer-events: none;
}
@keyframes skillPulse {
  0%, 100% { box-shadow: inset 0 0 0 2px #c77dff, 0 0 8px rgba(199, 125, 255, 0.35); }

  box-shadow: inset 0 0 14px #ff70e0, 0 0 8px rgba(255, 112, 224, 0.6);

  content: ''; position: absolute; inset: 2px;

.turn-banner {

  animation: turnBannerIn 2.4s cubic-bezier(.2, .8, .2, 1) forwards;
}
.turn-banner::after {
  content: ''; position: absolute; left: 17%; right: 17%; bottom: 3px;
  height: 1px; background: linear-gradient(90deg, transparent, currentColor, transparent);

.turn-banner { color: #ffd166; }
.turn-banner.tb-enemy { color: #ff5c7a; }

@keyframes turnBannerIn {

  16%  { opacity: 1; transform: translate(-50%, -50%) scale(1.06); filter: blur(0); }
  30%  { transform: translate(-50%, -50%) scale(1); }

/* ============================================================

   ============================================================ */
@media (max-width: 860px) {
  html { -webkit-text-size-adjust: 100%; }

  /* 顶部安全区：手机上留一条纯装饰深色带（不承载任何信息），

  #cam-safe {
    display: block; position: fixed; left: 0; right: 0; top: 0;
    height: max(env(safe-area-inset-top, 0px), 30px);
    background: linear-gradient(180deg, #0e1324 0%, #111a30 62%, #1a1a2e 100%);
    border-bottom: 1px solid rgba(76, 201, 240, 0.16);
    z-index: 200; pointer-events: none;
  }

  body {
    padding: calc(max(env(safe-area-inset-top, 0px), 30px) + 5px) 6px 6px;
    height: 100vh; height: 100dvh;
    overflow: hidden;
    justify-content: flex-start;
  }

  /* 顶栏：两行——第一行信息（挑战次数 / 层 / 回合 / 金币 / 阶段），第二行按钮 */
  #topbar {
    gap: 4px 10px; padding: 4px 8px; margin-bottom: 5px;
    font-size: 11px; justify-content: center; width: var(--bar-w);
    flex-wrap: wrap; flex: 0 0 auto;
  }

  #topbar .tb-i { font-size: 11px; }
  #topbar .tb-i b { font-size: 12.5px; }
  /* 手机上信息行已经很挤：金币后面的「每回合 +N」收起（存档面板 / 回合日志里都能看） */
  #topbar .tb-inc { display: none; }
  #topbar button { padding: 4px 7px; font-size: 11px; }
  #topbar .tb-btns {
    flex: 1 0 100%; justify-content: center; gap: 4px; margin-top: 2px;
  }

  /* 行动栏：仍然固定高度单行，压缩内边距 */
  #action-bar {
    max-width: 100%; padding: 0 8px; gap: 5px;
    margin: 0 0 5px; font-size: 11.5px; height: 36px;
    flex: 0 0 auto;
  }
  #action-bar .act-group { gap: 4px; }
  #action-bar .act-group button { padding: 7px 9px; font-size: 11px; }
  #action-bar .shape-tag { font-size: 10.5px; padding: 0 5px; }
  /* 窄屏（<=540）收起射程标签 / 森林提示 / 中间那句操作提示：
     320 屏上那句提示只剩「点蓝格移动 …」四个字，纯浪费宽度，
     空间全部让给三个按钮（铺满均分，指头按得准）；完整玩法在「说明」弹窗里。
     541~860（横屏、小平板）不隐藏，按钮也不拉伸，宽度留给那句提示。 */
  @media (max-width: 540px) {

    #action-bar .hint:not(.ab-latest) { display: none; }
    #action-bar .act-group { flex: 1 1 auto; justify-content: flex-end; }
    #action-bar .act-group button { min-width: 46px; flex: 1 1 auto; }
  }

  /* 主区：只剩棋盘，吃掉剩余全部高度并居中 */
  #main {
    flex: 1 1 auto; min-height: 0; width: 100%;
    align-items: flex-start; justify-content: center;
  }
  #board-col { width: 100%; }

  /* 棋盘：宽度铺满，同时受屏高约束。
     130px = 两行顶栏 + 行动栏 + 三道间距 + 预留余量；22px = 棋盘自己的 padding + 格间距；
     12px = body 左右内边距（手机上是 6px×2）；再减掉顶部安全区（真全面屏 env() 可能 40+） */
  :root {

          calc((100dvh - 134px - 22px - max(env(safe-area-inset-top, 0px), 30px)) / 8)),

  /* 日志 / 说明弹窗在手机上留更多内容高度 */
  .modal.log-modal, .modal.help-modal { width: 94vw; max-width: 94vw; max-height: 82vh; }
}

/* 触摸设备：去掉点击蓝框 / 长按菜单，避免误选文字；消除双击缩放延迟 */
@media (hover: none) {

/* 手机横屏：高度极紧，顶栏压成一行，格子按屏高换算，

@media (max-width: 900px) and (orientation: landscape) and (max-height: 540px) {

  /* 横屏 body 内边距压到 6px，所以左右只扣 12px */
  :root {
    --cell: clamp(26px,
      min(calc((100vw - 12px - 22px) / 8),
          calc((100dvh - 86px - 22px) / 8)),
      52px);
  }
}

<script>
/* ===== core/danmaku.js ===== */
// ============================================================
// 弹幕日志层（从屏幕右侧向左飘过）
//
//   设计要点：
//   · 全屏覆盖、pointer-events:none —— 只做演出，绝不挡点击
//   · 轨道分配是「独占式」：一条轨道同一时刻只允许一条弹幕。
//     轨道没空出来就等（排队），**绝不硬塞**——硬塞就会两条叠在一起变成一坨糊字
//   · 一条轨道空出来的时刻 = 上一条的尾巴离开右边缘 + 安全间距所需时间：
//       freeAt = now + (宽 + GAP_X) / 速度
//     因为全屏所有弹幕速度一致，同轨的后一条永远追不上前一条
//   · 竖向：轨道几何用「轨顶 + 行高」，弹幕在轨内垂直居中。
//     以前把「轨道中心」当成元素 top 用，整排都会往下一压半行，看着就像怼在一起
//   · 大字（强化成败 / 存档奖励）**占两条轨道**（2×行高 ≥ 字高），
//     并且和普通流水共用同一套轨道账本 —— 否则上层大字会压住下层普通弹幕
//   · 吞吐不够时：桌面最多 13 轨、手机 5 轨；队列积压就丢掉「经验 / 回血」这类小字，
//     把轨道留给战斗流水（丢小字比叠字好，叠字等于没信息）
//
//   对外接口：
//     DM.push(text, type, opts)   普通弹幕（type 即日志类型，决定配色）
//     DM.result(text, ok)         特大号结果弹幕（强化成功 / 失败 / 通关奖励）
//     DM.clear()                  清屏（换周目 / 重新开始时用）
// ============================================================
const DM = (function () {
  const CFG = {
    SPEED: 210,          // 飘行速度 px/s（宽屏按屏宽微调，窄屏锁 150）
    SPEED_MIN: 150,
    GAP_X: 34,           // 同轨两条之间的最小横向间距
    MIN_INTERVAL: 56,    // 两条弹幕之间的最小间隔 ms
    FAST_INTERVAL: 42,   // 队列积压时缩短到这么短
    MAX_LIVE: 48,        // 单层同屏上限（纯兜底；13 轨每条可挂 2~3 条，正常不该触发）
    MAX_QUEUE: 48,       // 队列上限，超了丢最旧的
    LANES_DESKTOP: 13,   // 桌面最多 13 条轨道
    LANES_MOBILE: 5,     // 手机最多 5 条，否则糊满棋盘
    RETRY_MS: 110,       // 没轨道时的重试间隔
    RETRY_MAX: 40,       // 重试上限（约 4.4 秒），超了宁可丢这条也不叠字
    SLACK: 26,           // 允许提前这么久发车（ms），吸收定时器抖动
  };

  let lanes = [];        // [{ y: 轨顶, freeAt: 空出来时刻 }]
  let lineH = 27;
  let laneKey = '';
  // 发车台账：只留最近 400 条，给测试/排查算「任意时刻屏幕上是否重叠」用。
  // 记录的是动画的真实运动参数（起点、宽高、速度），所以脱离渲染也能精确复算
  const trace = [];
  const TRACE_MAX = 400;
  let queue = [];
  let pumping = false;
  let lastSpawn = 0;

  function small() {
    return (window.innerWidth || 800) < 861;
  }

  // 两个层：
  //   #danmaku-layer      普通流水，z-index 55（在弹窗下面，不干扰阅读）
  //   #danmaku-layer-top  结论级大字（强化成败 / 存档奖励），z-index 210
  //                       强化是在商店弹窗里点的，如果结果被弹窗盖住就等于没反馈
  function layer(top) {
    const id = top ? 'danmaku-layer-top' : 'danmaku-layer';
    let l = document.getElementById(id);
    if (!l) {
      l = document.createElement('div');
      l.id = id;
      document.body.appendChild(l);
    }
    return l;
  }

  // 弹幕活动区：顶栏下沿（与行动栏下沿取大）~ 棋盘下沿
  function measure() {
    const vh = window.innerHeight || document.documentElement.clientHeight || 800;
    // 兜底 92：newGame 阶段顶栏还是空 div（高度 0），这时按「常规顶栏高度」算，
    // 否则最早的几条弹幕会直接压在顶栏上
    let top = 92;
    let bottom = vh - 140;
    const tb = document.getElementById('topbar');
    const bd = document.getElementById('board');
    if (tb) {
      const r = tb.getBoundingClientRect();
      if (r.height > 20) top = r.bottom + 2;
    }
    const ab = document.getElementById('action-bar');
    if (ab) {
      const r = ab.getBoundingClientRect();
      // 行动栏是「选中单位 / 攻击范围 / 原地开火」那一条，弹幕压上去会看不清
      if (r.height > 10) top = Math.max(top, r.bottom + 2);
    }
    if (bd) {
      const r = bd.getBoundingClientRect();
      if (r.height && r.bottom > top + 40) bottom = r.bottom - 3;
    }
    if (bottom - top < 70) {
      top = Math.max(8, top);
      bottom = Math.min(vh - 40, top + 170);
    }
    return { top: top, bottom: bottom, vh: vh };
  }

  // 轨道几何只由「活动区高度 / 行高」决定，布局没变就不动。
  // 轨道**均匀铺满**活动区：轨距 = max(行高, 均分间距)，所以永远 ≥ 行高，竖向绝不会互相压。
  // （早先固定用行高当轨距，手机上 5 条轨道会全挤在顶上 120px，下面 260px 空着）
  // 重算时保留每条轨道已有的 freeAt / speed / clearAt，避免重排那一瞬间出现「全部空闲」导致齐发叠字。
  function syncLanes() {
    const m = measure();
    const s = small();
    const lh = s ? 24 : 27;
    const maxN = s ? CFG.LANES_MOBILE : CFG.LANES_DESKTOP;
    const avail = m.bottom - m.top;
    const n = Math.max(2, Math.min(maxN, Math.floor(avail / lh)));
    const step = n > 1 ? Math.max(lh, (avail - lh) / (n - 1)) : lh;
    const key = m.top + '|' + n + '|' + Math.round(step) + '|' + lh;
    if (key === laneKey && lanes.length === n) return;
    laneKey = key;
    lineH = lh;
    const next = [];
    for (let i = 0; i < n; i++) {
      const old = lanes[i];
      next.push({
        y: Math.round(m.top + i * step),
        freeAt: old ? old.freeAt : 0,
        speed: old ? old.speed : 0,
        clearAt: old ? old.clearAt : 0,
      });
    }
    lanes = next;
  }

  // 找一段连续 span 条轨道、且它们都已空出来。找不到返回 -1（调用方等着，不硬塞）
  function pickLanes(now, span) {
    const n = lanes.length;
    const need = Math.min(span, n);
    for (let i = 0; i + need <= n; i++) {
      let ok = true;
      for (let k = 0; k < need; k++) {
        if (lanes[i + k].freeAt > now + CFG.SLACK) { ok = false; break; }
      }
      if (ok) return i;
    }
    return -1;
  }

  function trimLive(l) {
    const live = l.children;
    if (live.length <= CFG.MAX_LIVE) return;
    const over = live.length - CFG.MAX_LIVE;
    for (let i = 0; i < over; i++) {
      if (live[0] && live[0].remove) live[0].remove();
    }
  }

  function spawn(item) {
    syncLanes();
    const now = performance.now();
    // 大字占两条轨道：字高 31px > 单轨 27px，只占一条就会漫进下一轨压住别人
    const span = item.big ? 2 : 1;
    const idx = pickLanes(now, span);
    if (idx < 0) return false;            // 全忙 → 等，绝不硬塞

    const l = layer(item.big);
    const el = document.createElement('span');
    el.className = 'dm' + (item.cls ? ' ' + item.cls : '');
    el.textContent = item.text;

    // 测量阶段：暂停动画 + 不可见。否则用 0.001s 的动画量宽度，元素会被瞬间甩到终点
    el.style.animationName = 'none';
    el.style.visibility = 'hidden';
    el.style.top = '0px';
    l.appendChild(el);
    const w = el.offsetWidth || Math.min(260, item.text.length * 13);
    const h = el.offsetHeight || lineH - 4;

    // 垂直：在「本条占用的那几条轨道」围出的带状区域里居中
    // （轨道是均匀铺开的，轨距可能大于行高，所以带状高度要按首末轨道实际位置算）
    const bandTop = lanes[idx].y;
    const bandH = lanes[idx + span - 1].y + lineH - bandTop;
    const topPx = Math.round(bandTop + (bandH - h) / 2);
    el.style.top = topPx + 'px';
    el.style.visibility = '';

    const vw = window.innerWidth || 800;
    let speed = Math.max(CFG.SPEED_MIN, Math.min(CFG.SPEED, vw / 6.8));
    if (item.big) speed *= 0.82;          // 大字慢一点，留时间读完
    // 关键：同一条轨道上还在屏幕上跑的那条如果更慢，这条必须跟它一样慢。
    // 否则后发的快车会追上并穿过前车 —— 那就是「两句怼在一起」的真正成因。
    for (let k = 0; k < span; k++) {
      const ln2 = lanes[idx + k];
      if (ln2.clearAt > now && ln2.speed && speed > ln2.speed) speed = ln2.speed;
    }
    const dur = Math.max(3.3, (vw + w + 24) / speed);
    el.style.animationDuration = dur.toFixed(2) + 's';
    el.style.animationName = '';          // 交回 .dm 的 dm-fly，从 0 起播

    // 占轨：等自己的尾巴离开右边缘 + 间距所需的时间
    const occ = now + ((w + CFG.GAP_X) / speed) * 1000;
    for (let k = 0; k < span; k++) {
      lanes[idx + k].freeAt = occ;
      lanes[idx + k].speed = speed;
      lanes[idx + k].clearAt = now + dur * 1000;   // 这条彻底离场（尾离开左边缘）的时刻
    }

    trace.push({ t: now, d: dur * 1000, y: topPx, w: w, h: h, v: speed, vw: vw,
                 i: idx, s: span, big: !!item.big, x: item.text.slice(0, 18) });
    if (trace.length > TRACE_MAX) trace.shift();

    trimLive(l);
    setTimeout(function () { if (el.remove) el.remove(); }, dur * 1000 + 240);
    return true;
  }

  function pump() {
    if (pumping) return;
    if (!queue.length) return;
    pumping = true;

    var tick = function () {
      if (!queue.length) { pumping = false; return; }
      const gap = queue.length > 8 ? CFG.FAST_INTERVAL : CFG.MIN_INTERVAL;
      const wait = gap - (performance.now() - lastSpawn);
      if (wait > 0) { setTimeout(tick, wait); return; }

      const item = queue[0];
      if (!spawn(item)) {
        // 没轨道 → 等一会儿；等太久说明真的爆了，丢掉这条，别堵住后面所有日志
        item.tries = (item.tries || 0) + 1;
        if (item.tries > CFG.RETRY_MAX) { queue.shift(); }
        setTimeout(tick, CFG.RETRY_MS);
        return;
      }
      queue.shift();
      lastSpawn = performance.now();
      setTimeout(tick, 0);
    };
    setTimeout(tick, 0);
  }

  function push(text, type, opts) {
    if (!text) return;
    let s = String(text).replace(/\s+/g, ' ').trim();
    if (!s) return;
    const S = small();
    // 窄屏文本再短一截：弹幕短 = 占轨时间短 = 轨道周转快
    const maxLen = S ? 42 : 62;
    if (s.length > maxLen) s = s.slice(0, maxLen) + '…';

    const o = opts || {};
    // 队列已经积压 → 经验 / 回血这类小字直接不上屏，把轨道让给战斗流水
    if (o.minor && queue.length >= (S ? 4 : 9)) return;

    const cls = ['t-' + (type || 'system')];
    if (o.big) cls.push('big');
    if (o.ok === true) cls.push('ok');
    if (o.ok === false) cls.push('bad');
    if (o.minor) cls.push('minor');

    queue.push({ text: s, cls: cls.join(' '), big: !!o.big, minor: !!o.minor });
    while (queue.length > CFG.MAX_QUEUE) queue.shift();
    pump();
  }

  // 强化结果 / 通关奖励这类「一句话结论」：大号 + 冷暖色
  function result(text, ok) {
    push(text, ok ? 'big-ok' : 'big-bad', { big: true, ok: !!ok });
  }

  function clear() {
    queue = [];
    pumping = false;
    lastSpawn = 0;
    // 轨道也一起放空，否则清屏后新弹幕还要白等上一批的占轨时间
    for (let i = 0; i < lanes.length; i++) lanes[i].freeAt = 0;
    ['danmaku-layer', 'danmaku-layer-top'].forEach(function (id) {
      const l = document.getElementById(id);
      if (l && l.innerHTML !== undefined) l.innerHTML = '';
    });
  }

  // 布局变了（旋转 / 缩放）→ 轨道重算
  window.addEventListener('resize', function () { laneKey = ''; });

  // 调试探针：测试里用来确认轨道 / 队列状态（正常游戏不调用）
  function stat() {
    const now = performance.now();
    const ln = document.getElementById('danmaku-layer');
    const tp = document.getElementById('danmaku-layer-top');
    return {
      lanes: lanes.length,
      tracks: lanes.length,                      // 兼容旧断言名
      lineH: lineH,
      queue: queue.length,
      pumping: pumping,
      busy: lanes.filter(function (x) { return x.freeAt > now; }).length,
      tops: lanes.map(function (x) { return Math.round(x.y); }),
      liveNormal: ln ? ln.children.length : 0,
      liveBig: tp ? tp.children.length : 0,
    };
  }

  return {
    push: push, result: result, clear: clear, _stat: stat,
    // 测试用：取发车台账 / 清空台账（正常游戏不调用）
    _trace: function () { return trace.slice(); },
    _clearTrace: function () { trace.length = 0; },
  };
})();

// 日志类型 → 弹幕配色 / 字号（在 style.css 里定义 .dm.t-*）
//   player/enemy 是战斗流水，exp/heal 是成长流水，kill/levelup 是值得看大的
function dmClsOfType(type) {
  return type || 'system';
}

</script>
<script>
/* ===== core/state.js ===== */
// ============================================================
// 全局状态
// ============================================================
let G = null;

function createState() {
  return {
    // 进度
    floor: 1,
    turn: 1,
    challenge: 1,        // 第几次挑战
    phase: 'player',     // player / enemy

    // 资源
    gold: 0,
    levelBuys: 0,        // 本局花金币全队升级的次数（价钱按它指数翻倍，跨层保留）

    // 单位
    allies: [],
    enemies: [],
    grid: [],
    hero: null,
    allyProgress: null,  // 队伍成长快照（跨层继承等级/成长/永久标记）

    // 交互
    selected: null,
    mode: null,          // 行动模式：null / 'attack' / 'skill'（技能选落点中）
    jumpFloor: null,     // 下一层要跳到的目标层（我命由我不由天用）

    // 卡牌
    buffs: [],           // 永久 buff 列表
    armed: [],           // 待发卡牌（下次攻击 / 受伤时触发，触发后移出）

    // 奇遇（每 7 层触发一次）
    encounterHistory: [],  // 已触发过的奇遇 id，避免重复
    encounterCount: 0,     // 已触发奇遇次数

    // 全局加成
    goldBonus: 0,
    turnGold: 0,
    luck: 0,
    healBonus: 0,

    // 文字日志（装备栏删掉后，全量日志改为数据 + 弹窗，不再靠 DOM 裁剪）
    logLines: [],

    // 状态
    gameOver: false,
    clearing: false,         // 本层已判定通关、正在弹结算（防止重复触发 / 又进敌人回合）
    autoEndPending: false,   // 正在等待"全员行动完自动结束回合"
  };
}

function newGame(challenge) {
  G = createState();
  if (challenge) G.challenge = challenge;
  initFloor(1);
  render();
  if (hasBoss()) {
    const boss = G.enemies.find(e => e && e.isBoss);
    if (typeof tauntSay === 'function') {
      if (G.hero) tauntSay(G.hero, pick(HERO_TAUNTS.start));
      if (boss) tauntSay(boss, pick(BOSS_TAUNTS.start));
    } else {
      log(pick(HERO_TAUNTS.start), 'taunt-hero');
      log(pick(BOSS_TAUNTS.start), 'taunt-boss');
    }
  }
}

// ============================================================
// 重开一局（第 N 次挑战）
//   肉鸽循环：卡牌 / 等级 / 金币 / 层数 全部清零，
//   带得进下一局的只有「存档仓库的开局资源」与「永久天赋」。
// ============================================================
function restartRun(challenge) {
  if (typeof tutCancel === 'function') tutCancel();
  if (typeof DM !== 'undefined') DM.clear();

  const next = challenge || ((G && G.challenge) || 1) + 1;

  clearSave();
  newGame(next);                       // 全新一局：卡牌 / 等级 / 金币 / 层数全部清零

  // 仓库里的开局资源（金币）
  const arming = (typeof applyMetaStart === 'function') ? applyMetaStart()
    : { gold: 0, cards: 0, level: 0 };

  // 天赋的开局效果（老兵等级 / 收藏家卡牌）—— 必须在人建好之后
  if (typeof applyMetaTalents === 'function') applyMetaTalents(arming);

  G.allies.forEach(a => { a.hp = a.maxHp; });   // 满血开局
  saveGame();
  render();
  if (typeof reportMetaArming === 'function') reportMetaArming(arming);
}

// ============================================================
// 队伍成长快照：跨层 / 跨存档继承等级、成长与永久标记
// ============================================================
const PROGRESS_FIELDS = [
  'level', 'exp',
  'killGrowth', 'turnGrowth', 'turnHpGrowth',
  'bonusAtk', 'bonusHp', 'bonusCrit', 'bonusDodge', 'bonusArmor', 'bonusMagicRes',
  'affix',                       // 卡牌词条：跨层必须带走，否则每层重建单位就丢了
  'revenge', 'revengeCount',
  'undying', 'revive', 'undyingCount', 'reviveCount',
  'splash', 'knockback', 'reflect', 'grudge', 'grudgeLv',
  'noDefense', 'noMove', 'fullAttack', 'fullMove', 'atkBuff', 'defense',
];

function snapshotAllies() {
  if (!G) return [];
  const byType = {};
  // 先保留上一层的记录（阵亡队友的等级/成长也不丢）
  (G.allyProgress || []).forEach(p => { byType[p.type] = Object.assign({}, p); });
  (G.allies || []).forEach(a => {
    const o = { type: a.type };
    PROGRESS_FIELDS.forEach(f => { o[f] = a[f]; });
    byType[a.type] = o;
  });
  return Object.keys(byType).map(t => byType[t]);
}

function applyAllyProgress() {
  if (!G || !G.allyProgress) return;
  G.allies.forEach(a => {
    const p = G.allyProgress.find(x => x.type === a.type);
    if (!p) return;
    PROGRESS_FIELDS.forEach(f => { if (p[f] !== undefined) a[f] = p[f]; });
  });
}

<script>
/* ===== core/utils.js ===== */
// ============================================================
// 工具函数
// ============================================================

// 是否为「没有 hover 的触摸设备」（手机 / 平板）。
// 这类设备 tap 一次只会触发 mouseenter，永远等不到 mouseleave，
// 所以悬浮详情必须靠定时器自动收起，否则会一直糊在画面上。
const IS_TOUCH = (function () {
  try { return !!(window.matchMedia && window.matchMedia('(hover: none)').matches); }
  catch (e) { return false; }
})();

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function moveDist(x1, y1, x2, y2) {
  return Math.abs(x1 - x2) + Math.abs(y1 - y2);
}

function canReach(u, x1, y1, x2, y2) {
  const dx = Math.abs(x1 - x2);
  const dy = Math.abs(y1 - y2);
  if (u.mage) return true;
  if (dx !== 0 && dy !== 0) return false;
  return (dx + dy) <= u.range;
}

function inBounds(x, y) {
  return x >= 0 && x < CONFIG.SIZE && y >= 0 && y < CONFIG.SIZE;
}

// 场上是否还有 BOSS（垃圾话只在"对面有 BOSS"时才说）
function hasBoss() {
  return !!(G && G.enemies && G.enemies.some(e => e && e.isBoss && e.hp > 0));
}

// ============================================================
// 攻击特效（纯 CSS 渐变 + 关键帧，不使用任何图片素材）
// ============================================================
function cellRectInWrap(x, y) {
  const wrap = document.getElementById('board-wrap');
  const board = document.getElementById('board');
  if (!wrap || !board || !board.children) return null;
  const cell = board.children[y * CONFIG.SIZE + x];
  if (!cell || typeof cell.getBoundingClientRect !== 'function') return null;
  const cr = cell.getBoundingClientRect();
  const wr = wrap.getBoundingClientRect();
  if (!cr.width) return null;
  return {
    cx: cr.left - wr.left + cr.width / 2,
    cy: cr.top - wr.top + cr.height / 2,
    w: cr.width, h: cr.height,
  };
}

function fxNode(wrap, cls, style, ttl) {
  const el = document.createElement('div');
  el.className = cls;
  if (style) {
    Object.keys(style).forEach(k => {
      if (k.indexOf('--') === 0) el.style.setProperty(k, style[k]);
      else el.style[k] = style[k];
    });
  }
  wrap.appendChild(el);
  setTimeout(() => { if (el.remove) el.remove(); }, ttl || 600);
  return el;
}

// kind: hit | crit | miss | heal |   side: player | enemy
// opts.noBeam：不再画「攻击者→目标」的光束（形状特效已经画过一条贯穿整行/列的光带，
//              再叠 8 条斜光束只会糊成一片）
function battleFx(ax, ay, tx, ty, kind, side, opts) {
  const wrap = document.getElementById('board-wrap');
  if (!wrap) return;
  const t = cellRectInWrap(tx, ty);
  if (!t) return;

  const enemySide = side === 'enemy';
  const noBeam = !!(opts && opts.noBeam);

  // 治疗：绿色上升光环
  if (kind === 'heal') {
    fxNode(wrap, 'fx-heal', { left: t.cx + 'px', top: t.cy + 'px' }, 900);
    return;
  }
  // 闪避 / 免疫：虚线弧
  if (kind === 'miss') {
    fxNode(wrap, 'fx-swoosh', { left: t.cx + 'px', top: t.cy + 'px' }, 700);
    return;
  }

  const crit = kind === 'crit';
  const mod = crit ? ' crit' : (enemySide ? ' enemy' : '');

  // 命中闪光
  fxNode(wrap, 'fx-flash' + mod, {
    left: t.cx + 'px', top: t.cy + 'px', width: t.w + 'px', height: t.h + 'px',
  }, 560);

  // 冲击环
  fxNode(wrap, 'fx-ring' + mod, { left: t.cx + 'px', top: t.cy + 'px' }, 720);
  if (crit) {
    setTimeout(() => fxNode(wrap, 'fx-ring crit ring2', { left: t.cx + 'px', top: t.cy + 'px' }, 820), 100);
  }

  // 攻击轨迹：从攻击者指向目标的光束
  const a = cellRectInWrap(ax, ay);
  if (!noBeam && a && (a.cx !== t.cx || a.cy !== t.cy)) {
    const dx = t.cx - a.cx, dy = t.cy - a.cy;
    const len = Math.sqrt(dx * dx + dy * dy);
    const ang = Math.atan2(dy, dx) * 180 / Math.PI;
    fxNode(wrap, 'fx-beam' + mod, {
      left: a.cx + 'px', top: (a.cy - 2) + 'px', width: len + 'px', '--ang': ang + 'deg',
    }, 540);
    // 近战（贴脸）：交击火花
    if (len <= t.w * 1.6) {
      fxNode(wrap, 'fx-clash' + (crit ? ' crit' : ''), { left: t.cx + 'px', top: t.cy + 'px' }, 580);
    }
  }

  // 暴击：整个棋盘一次轻微震屏
  if (crit) {
    wrap.classList.remove('fx-shake');
    void wrap.offsetWidth;
    wrap.classList.add('fx-shake');
    setTimeout(() => wrap.classList.remove('fx-shake'), 360);
  }
}

// ------------------------------------------------------------
// 技能特效：把「这一下打的是哪一片」直接画在棋盘上
//   现在只有一种技能（法师的地火），所以只剩「以靶心为中心的一圈火」，
//   圈的直径按档位放大：单体 / 十字 / 八格
// ------------------------------------------------------------
// 从某一格向两侧铺一条光带（row = 横带，col = 竖带）—— 暂时没有技能用到，
// 保留给后续「射线类」技能复用
function bandFx(cx, cy, kind) {
  const wrap = document.getElementById('board-wrap');
  const board = document.getElementById('board');
  if (!wrap || !board) return;
  const r = cellRectInWrap(cx, cy);
  if (!r) return;
  const br = board.getBoundingClientRect();
  const wr = wrap.getBoundingClientRect();
  if (!br.width) return;
  const c = r.w;
  const bx = br.left - wr.left, by = br.top - wr.top;

  if (kind === 'row') {
    const top = (r.cy - c * 0.46) + 'px';
    const hgt = (c * 0.92) + 'px';
    const mid = r.cx - bx;
    if (mid > 1) fxNode(wrap, 'fx-row-shot left', { left: bx + 'px', top: top, width: mid + 'px', height: hgt }, 1250);
    if (br.width - mid > 1) fxNode(wrap, 'fx-row-shot right', { left: r.cx + 'px', top: top, width: (br.width - mid) + 'px', height: hgt }, 1250);
    fxNode(wrap, 'fx-muzzle', { left: r.cx + 'px', top: r.cy + 'px' }, 760);
    return;
  }

  if (kind === 'col') {
    const left = (r.cx - c * 0.46) + 'px';
    const wid = (c * 0.92) + 'px';
    const mid = r.cy - by;
    if (mid > 1) fxNode(wrap, 'fx-col-shot up', { left: left, top: by + 'px', width: wid, height: mid + 'px' }, 1250);
    if (br.height - mid > 1) fxNode(wrap, 'fx-col-shot down', { left: left, top: r.cy + 'px', width: wid, height: (br.height - mid) + 'px' }, 1250);
    fxNode(wrap, 'fx-muzzle', { left: r.cx + 'px', top: r.cy + 'px' }, 760);
  }
}

function ringFx(cx, cy, scale) {
  const wrap = document.getElementById('board-wrap');
  if (!wrap) return;
  const r = cellRectInWrap(cx, cy);
  if (!r) return;
  const d = r.w * (scale || 3.1);
  fxNode(wrap, 'fx-ring8', { left: r.cx + 'px', top: r.cy + 'px', width: d + 'px', height: d + 'px' }, 1150);
  setTimeout(() => {
    fxNode(wrap, 'fx-ring8 wave2', { left: r.cx + 'px', top: r.cy + 'px', width: d + 'px', height: d + 'px' }, 1150);
  }, 120);
  fxNode(wrap, 'fx-muzzle big', { left: r.cx + 'px', top: r.cy + 'px' }, 820);
}

function skillCastFx(u, s, ax, ay) {
  if (!u || !s) return;
  if (s.kind === 'fire') {
    // 地火：环的直径按档位放大 —— 单体一圈小的、十字中圈、八格大圈
    const t = fireTierOf(u);
    ringFx(ax, ay, t.orth === 0 ? 1.7 : (t.orth === 1 ? 2.6 : 3.4));
    return;
  }
  // 兜底：靶心横竖各一道
  bandFx(ax, ay, 'row');
  setTimeout(() => bandFx(ax, ay, 'col'), 90);
  ringFx(ax, ay);
}


// 阵亡爆裂
function deathFx(x, y) {
  const wrap = document.getElementById('board-wrap');
  if (!wrap) return;
  const t = cellRectInWrap(x, y);
  if (!t) return;
  fxNode(wrap, 'fx-burst', { left: t.cx + 'px', top: t.cy + 'px' }, 720);
  fxNode(wrap, 'fx-burst shard', { left: t.cx + 'px', top: t.cy + 'px' }, 720);
}

// ============================================================
// 飘字
// ============================================================
function floatText(x, y, text, cls) {
  const wrap = document.getElementById('board-wrap');
  const board = document.getElementById('board');
  if (!board) return;
  const cell = board.children[y * CONFIG.SIZE + x];
  if (!cell) return;
  const wr = wrap.getBoundingClientRect();
  const cr = cell.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'float-text ' + (cls || '');
  el.textContent = text;
  el.style.left = (cr.left - wr.left + cr.width / 2) + 'px';
  el.style.top = (cr.top - wr.top) + 'px';
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 1300);
}

// ============================================================
// 日志（双通道：弹幕 + 文字落档）
//
//   2026-10-24 主界面精简：日志栏从主界面上撤掉了，改成两处出口：
//     · 行动栏的空位 —— 只显示「最新一条」，不用点就能看见刚发生了什么
//     · 顶栏「日志」按钮 —— 打开全量清单（想复盘才去翻）
//   落档从 DOM 改成 G.logLines 数组：不再靠 scrollHeight 裁剪，
//   隐藏 / 弹窗 / 窄屏都不影响条数，也省掉一堆布局抖动。
//
//   弹幕白名单：
//     player  我方命中        enemy 敌方命中      miss 闪避
//     crit    暴击（大字）    kill  击杀（大字）  skill 技能（大字）
//     levelup 升级（大字）                system 回合切换等节点
//   只落档不飘的：经验 exp / 回血 heal / 地形 terrain / 垃圾话 taunt
//   （这些要么每回合都有、要么屏幕上有专门的视觉表现，飘起来纯噪音）
//
//   第 3 个参数 noDm=true 表示「这条只落档」，用于板书类说明。
// ============================================================
const DM_TYPES = {
  player: 1, enemy: 1, miss: 1,
  crit: 1, kill: 1, skill: 1, levelup: 1,
  system: 1,
};

const LOG_MAX = 400;

function log(msg, type, noDm) {
  if (G) {
    if (!Array.isArray(G.logLines)) G.logLines = [];
    G.logLines.push({ t: msg, c: type || '' });
    if (G.logLines.length > LOG_MAX) {
      G.logLines.splice(0, G.logLines.length - LOG_MAX);
    }
    // 行动栏空位同步刷新（只在没选中单位时才占用那一行）
    if (typeof renderLatestLog === 'function') renderLatestLog();
  }
  if (!noDm && typeof DM !== 'undefined' && DM_TYPES[type]) {
    // 大型节点（击杀 / 暴击 / 技能 / 升级）走大字，普通交锋走小字
    const big = (type === 'kill' || type === 'crit' || type === 'skill' || type === 'levelup');
    DM.push(msg, dmClsOfType(type), { big: big });
  }
}

// ============================================================
// 单位工厂
// ============================================================
function makeUnit(type, x, y, team) {
  const t = UNIT_TEMPLATES[type];
  if (!t) return null;

  // 敌人等级随层数提升（每 2 层 +1 级），属性随等级同步增强
  //   生命成长快于攻击成长：改成手动单体攻击后，玩家清怪速度变慢，
  //   如果敌人攻击也按同样倍率涨，几回合就会把队伍磨死。
  const enemyLv = 1 + Math.floor(Math.max(0, (G.floor || 1) - 1) / 2);
  const B = CONFIG.BALANCE || {};
  const hpScale = team === 'enemy' ? (1 + (enemyLv - 1) * (B.ENEMY_HP_SCALE || 0.44)) : 1;
  const atkScale = team === 'enemy' ? (1 + (enemyLv - 1) * (B.ENEMY_ATK_SCALE || 0.30)) : 1;
  const hp = Math.floor(t.hp * hpScale);

  return {
    type, name: t.name, icon: t.icon,
    x, y, team,
    hp, maxHp: hp,
    atk: Math.floor(t.atk * atkScale),
    range: t.range,
    move: t.move,
    crit: t.crit || 0.05,
    dodge: t.dodge || 0.05,
    level: team === 'enemy' ? enemyLv : 1,
    exp: 0,

    isHero: !!t.isHero,
    isBoss: !!t.isBoss,
    mage: !!t.mage,
    guard: !!t.guard,
    atkMode: t.atkMode || 'cross1',       // 普攻形态：cross1 前后左右 / archerRing 射手环
    atkRange: t.atkRange || 1,            // 普攻距离（等级成长由 recalcHeroStats 结算）
    fly: !!t.fly,                         // 飞行：无视地形（河流 / 高山可走、森林不减速）
    isMagic: !!t.mage,                    // 法术攻击：受目标「魔抗」影响
    growth: t.growth || { hp: 5, atk: 1 },

    hasMoved: false,
    hasActed: false,

    // 成长
    killGrowth: 0,
    turnGrowth: 0,
    turnHpGrowth: 0,

    // 战斗
    defense: 0,
    // 护甲：每次受物理攻击的固定减伤（模板基础值 + 卡牌加成）
    // 魔抗：受法术伤害的百分比减伤（模板基础值 + 卡牌加成）
    armor: t.armor || 0,
    magicRes: t.magicRes || 0,
    atkBuff: 0,
    stun: false,
    blind: false,

    // 流血（来源：卡牌 / 奇遇附加的持续伤害）
    bleedDmg: 0,
    bleedTurns: 0,

    // 永久加成（由 recalcHeroStats 统一结算）
    bonusAtk: 0,
    bonusHp: 0,
    bonusCrit: 0,
    bonusDodge: 0,
    bonusArmor: 0,
    bonusMagicRes: 0,
    // 卡牌词条（原装备词条系统的落点，现在只由卡牌 / 奇遇写入）：
    //   bonus 附加伤害 / lifesteal 吸血 / bleed 流血 / critDmg 暴伤
    //   double 双倍 / execute 处决 / armorPen 破甲
    //   reduce 减伤 / regen 回血 / thorns 反伤 / hpPct 生命%
    //   goldPerHit / goldOnKill 经济
    affix: {},
    revengeCount: 0,

    // 特殊
    splash: 0,
    reflect: 0,
    undying: false,        // 旧的布尔标记（兼容老存档）
    revive: false,
    undyingCount: 0,       // 「无尽的愤怒」锁血剩余次数（可叠加）
    reviveCount: 0,        // 「不死鸟」复活剩余次数（可叠加）
    grudgeLv: 0,           // 「卧薪尝胆」层数（可叠加：每层损血加成再乘一次）
    noDefense: false,
    noMove: false,
    fullAttack: false,
    fullMove: false,
    revenge: false,
    grudge: false,
    multiAttack: 0,
    knockback: 0,
  };
}

<script>
/* ===== core/audio.js ===== */
// ============================================================
// 音效系统（WebAudio 实时合成 · 不加载任何音频文件）
//   · 每个兵种一套音色：鸟人=锐利风声，射手=拨弦，
//     法师=电流，敌人=粗哑低吼，BOSS=沉重轰鸣
//   · 命中 / 暴击 / 闪避 / 治疗 / 阵亡 / 升级 / 回合 都有独立声音
//   · 浏览器要求「先有用户操作」才允许出声：首次点击时自动解锁
//   · 静音开关记在 localStorage（zhanqi_rouge_sound = on / off）
// ============================================================
const SFX = (function () {
  let ac = null;
  let master = null;
  let lastAtk = 0;      // 连击限流：同一瞬间多次开火只响一次
  let muted = false;

  try { muted = localStorage.getItem('zhanqi_rouge_sound') === 'off'; } catch (e) {}

  function ctx() {
    if (muted) return null;
    try {
      if (!ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ac = new AC();
        master = ac.createGain();
        master.gain.value = 0.5;
        master.connect(ac.destination);
      }
      if (ac.state === 'suspended') ac.resume();
      return ac;
    } catch (e) {
      return null;
    }
  }

  // 单音：频率可从 f0 滑到 f1
  function tone(o) {
    const c = ctx();
    if (!c || !master) return;
    try {
      const t0 = c.currentTime + (o.delay || 0);
      const dur = o.dur || 0.15;
      const osc = c.createOscillator();
      const g = c.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(Math.max(20, o.f0), t0);
      if (o.f1 && o.f1 !== o.f0) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f1), t0 + dur);
      }
      const peak = o.gain === undefined ? 0.16 : o.gain;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + (o.attack || 0.008));
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g).connect(master);
      osc.start(t0);
      osc.stop(t0 + dur + 0.03);
    } catch (e) {}
  }

  // 噪声：用于打击感 / 风声 / 爆裂
  function noise(o) {
    const c = ctx();
    if (!c || !master) return;
    try {
      const dur = o.dur || 0.12;
      const t0 = c.currentTime + (o.delay || 0);
      const len = Math.max(1, Math.floor(c.sampleRate * dur));
      const buf = c.createBuffer(1, len, c.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) {
        d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      }
      const src = c.createBufferSource();
      src.buffer = buf;
      const flt = c.createBiquadFilter();
      flt.type = o.filter || 'bandpass';
      flt.frequency.setValueAtTime(o.freq || 1200, t0);
      if (o.freq1) flt.frequency.exponentialRampToValueAtTime(Math.max(60, o.freq1), t0 + dur);
      flt.Q.value = o.q || 1;
      const g = c.createGain();
      g.gain.setValueAtTime(o.gain === undefined ? 0.14 : o.gain, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(flt).connect(g).connect(master);
      src.start(t0);
      src.stop(t0 + dur + 0.02);
    } catch (e) {}
  }

  // 各兵种出手音色
  const ATTACK = {
    birdking: () => {   // 鸟人：破空风刃 + 尖锐下扫
      noise({ freq: 2600, freq1: 700, dur: 0.16, gain: 0.13, q: 0.8 });
      tone({ type: 'sawtooth', f0: 900, f1: 240, dur: 0.16, gain: 0.1 });
    },
    archer: () => {     // 射手：弓弦拨动
      tone({ type: 'triangle', f0: 1250, f1: 520, dur: 0.1, gain: 0.11 });
      noise({ freq: 3600, freq1: 1800, dur: 0.07, gain: 0.08, q: 2 });
    },
    wizard: () => {     // 法师：电流嗡鸣
      tone({ type: 'square', f0: 520, f1: 1500, dur: 0.15, gain: 0.07 });
      tone({ type: 'sine', f0: 1800, f1: 640, dur: 0.22, gain: 0.06, delay: 0.03 });
    },
    enemy: () => {      // 普通敌人：粗哑低吼
      tone({ type: 'square', f0: 240, f1: 95, dur: 0.15, gain: 0.1 });
      noise({ filter: 'lowpass', freq: 900, dur: 0.1, gain: 0.1 });
    },
    boss: () => {       // BOSS：沉重轰鸣
      tone({ type: 'sawtooth', f0: 130, f1: 52, dur: 0.34, gain: 0.2 });
      noise({ filter: 'lowpass', freq: 420, freq1: 140, dur: 0.3, gain: 0.16 });
    },
  };

  function attack(u) {
    if (muted || !u) return;
    const now = Date.now();
    if (now - lastAtk < 45) return;   // 限流，避免全屏攻击糊成一片
    lastAtk = now;
    const key = u.isBoss ? 'boss'
      : (ATTACK[u.type] ? u.type : (u.mage ? 'wizard' : 'enemy'));
    try { (ATTACK[key] || ATTACK.enemy)(); } catch (e) {}
  }

  return {
    attack,

    // 命中：暴击更亮更脆
    hit(crit, heavy) {
      if (muted) return;
      if (crit) {
        noise({ freq: 4200, freq1: 1500, dur: 0.13, gain: 0.2, q: 1.4 });
        tone({ type: 'square', f0: 1500, f1: 700, dur: 0.12, gain: 0.09 });
      } else {
        noise({ filter: 'lowpass', freq: 1600, freq1: 480, dur: 0.11, gain: 0.18 });
        if (heavy) tone({ type: 'triangle', f0: 240, f1: 110, dur: 0.14, gain: 0.14 });
      }
    },

    miss() {
      if (muted) return;
      noise({ freq: 900, freq1: 2600, dur: 0.13, gain: 0.08, q: 0.7 });
    },

    heal() {
      if (muted) return;
      [523, 659, 784].forEach((f, i) => {
        tone({ type: 'sine', f0: f, f1: f, dur: 0.18, gain: 0.09, delay: i * 0.05 });
      });
    },

    death() {
      if (muted) return;
      tone({ type: 'sawtooth', f0: 320, f1: 60, dur: 0.32, gain: 0.16 });
      noise({ filter: 'lowpass', freq: 800, freq1: 120, dur: 0.28, gain: 0.12 });
    },

    coin() {
      if (muted) return;
      tone({ type: 'square', f0: 1180, f1: 1560, dur: 0.07, gain: 0.06 });
      tone({ type: 'square', f0: 1560, f1: 1900, dur: 0.08, gain: 0.05, delay: 0.06 });
    },

    levelup() {
      if (muted) return;
      [523, 659, 784, 1047].forEach((f, i) => {
        tone({ type: 'triangle', f0: f, dur: 0.16, gain: 0.09, delay: i * 0.07 });
      });
    },

    // 回合弹字的过场音
    turn() {
      if (muted) return;
      tone({ type: 'sine', f0: 392, f1: 523, dur: 0.16, gain: 0.08 });
      tone({ type: 'sine', f0: 523, f1: 784, dur: 0.2, gain: 0.06, delay: 0.1 });
    },

    // 首次用户操作时解锁音频（浏览器自动播放策略）
    unlock() { ctx(); },

    isMuted() { return muted; },

    setMuted(m) {
      muted = !!m;
      try { localStorage.setItem('zhanqi_rouge_sound', muted ? 'off' : 'on'); } catch (e) {}
      if (muted && ac && master) {
        try { master.gain.value = 0; } catch (e) {}
      } else if (ac && master) {
        try { master.gain.value = 0.5; } catch (e) {}
      }
      if (!muted) ctx();
    },

    toggle() { this.setMuted(!muted); return muted; },
  };
})();

</script>
<script>
/* ===== core/meta.js ===== */
// ============================================================
// 存档奖励系统（跨局永久的「账号进度」）
//
//   一局 = 第 N 次挑战，从第 1 层爬到第 99 层。爬到顶就通关，
//   通关后自动进入下一次挑战（无限刷），并把奖励存进永久仓库。
//
//   装备系统已删除（2026-10-24），道具系统也已删除（同日晚些），
//   凯莉商店也在第四次大改里删掉了，所以仓库只攒一样开局军费：
//     · gold  开局金币 —— 进本局直接进钱包，通关三选一里花（重掷 / 多拿卡 / 升一级）
//
//   天赋（talents）—— 通关次数达标后解锁，之后每通关一次自动 +1，可无限累积：
//     · 🌳 伐木工  通关 1 次解锁 · 每回合额外 +1 金币
//     · 💰 商人    通关 3 次解锁 · 通关三选一里的花费 -5%/级（最高 -40%）
//     · 🎒 收藏家  通关 5 次解锁 · 开局多送 1 张随机卡
//     · ⚔️ 老兵    通关 7 次解锁 · 开局全队等级 +1
// ============================================================
const META_KEY = 'zhanqi_rogue_meta_v2';

const META_CLEAR_REWARD = { gold: 300 };

const TALENTS = [
  {
    id: 'lumberjack', name: '伐木工', icon: '🌳', unlockAt: 1, max: 99,
    desc: function (lv) { return '每回合额外获得 ' + lv + ' 金币'; },
  },
  {
    id: 'merchant', name: '商人', icon: '💰', unlockAt: 3, max: 8,
    desc: function (lv) { return '通关三选一的花费 -' + Math.min(40, lv * 5) + '%'; },
  },
  {
    id: 'collector', name: '收藏家', icon: '🎒', unlockAt: 5, max: 8,
    desc: function (lv) { return '开局额外获得 ' + lv + ' 张随机卡牌'; },
  },
  {
    id: 'veteran', name: '老兵', icon: '⚔️', unlockAt: 7, max: 9,
    desc: function (lv) { return '开局全队等级 +' + lv; },
  },
];

let META = null;

function createMeta() {
  return {
    v: 2,
    clears: 0,                 // 累计通关次数（爬到 99 层）
    best: 1,                   // 历史最高层
    talents: {},               // { lumberjack: 3, ... }
    vault: { gold: 0 },
  };
}

function loadMeta() {
  if (META) return META;
  let raw = null;
  try { raw = localStorage.getItem(META_KEY); } catch (e) {}
  let data = null;
  if (raw) { try { data = JSON.parse(raw); } catch (e) { data = null; } }
  META = Object.assign(createMeta(), data || {});
  META.vault = Object.assign({ gold: 0 }, META.vault || {});
  delete META.vault.potions;      // 道具已删除，老存档里的药水直接丢掉
  META.talents = META.talents || {};
  if (typeof META.clears !== 'number' || META.clears < 0) META.clears = 0;
  if (typeof META.best !== 'number' || META.best < 1) META.best = 1;
  return META;
}

function saveMeta() {
  if (!META) return;
  try { localStorage.setItem(META_KEY, JSON.stringify(META)); } catch (e) {}
}

function metaVal(id) {
  loadMeta();
  return META.talents[id] || 0;
}

function metaUnlocked(t) {
  return loadMeta().clears >= t.unlockAt;
}

// ---- 天赋的实际效果 ----
function metaTurnGold() { return metaVal('lumberjack'); }
// 商人：通关三选一里的三种花费（重掷 / 多拿一张 / 全队升级）打折
function metaDiscount() {
  const cap = (CONFIG.SPEND && CONFIG.SPEND.DISCOUNT_CAP) || 0.4;
  return Math.min(cap, metaVal('merchant') * 0.05);
}
function metaStartCards() { return metaVal('collector'); }
function metaStartLevel() { return metaVal('veteran'); }

// ============================================================
// 通关结算：入库 + 天赋成长
//   返回 [{ talent, lv, first }]，供通关弹窗逐条展示
// ============================================================
function grantClearRewards() {
  loadMeta();
  META.clears += 1;
  META.best = Math.max(META.best, 99);
  META.vault.gold += META_CLEAR_REWARD.gold;

  const ups = [];
  TALENTS.forEach(function (t) {
    if (!metaUnlocked(t)) return;
    const cur = META.talents[t.id] || 0;
    if (cur >= t.max) return;
    META.talents[t.id] = cur + 1;
    ups.push({ talent: t, lv: cur + 1, first: cur === 0 });
  });
  saveMeta();
  return ups;
}

// ============================================================
// 新周目开局：把仓库里的开局军费发下去（自动，不需要玩家操作）
// ============================================================
function applyMetaStart() {
  loadMeta();
  const out = { gold: 0, cards: 0, level: 0 };

  if (META.vault.gold > 0) {
    G.gold += META.vault.gold;
    out.gold = META.vault.gold;
  }
  return out;
}

// 天赋的开局效果（老兵等级 / 收藏家卡牌）—— 必须等 G.allies 建好之后再调
function applyMetaTalents(out) {
  const lv = metaStartLevel();
  if (lv > 0 && G && G.allies && G.allies.length) {
    G.allies.forEach(function (a) { a.level = (a.level || 1) + lv; });
    out.level = lv;
    if (typeof recalcHeroStats === 'function') recalcHeroStats();
  }
  const n = metaStartCards();
  if (n > 0 && typeof drawCards === 'function' && typeof applyCard === 'function') {
    const cards = drawCards(n);
    cards.forEach(function (c) { applyCard(c); });
    out.cards = cards.length;
  }
  return out;
}

// 开局军备播报（弹幕）
function reportMetaArming(out) {
  if (!out || typeof DM === 'undefined') return;
  const bits = [];
  if (out.gold) bits.push('开局军费 ' + out.gold + ' 金');
  if (out.level) bits.push('老兵：全队等级 +' + out.level);
  if (out.cards) bits.push('收藏家：额外 ' + out.cards + ' 张卡');
  if (!bits.length) return;
  DM.result('🎁 存档军备：' + bits.join(' · '), true);
}

// 记录历史最高层（存档面板里显示成就）
function metaRecordFloor(floor) {
  loadMeta();
  if (floor > META.best) {
    META.best = floor;
    saveMeta();
  }
}

function resetMeta() {
  META = createMeta();
  saveMeta();
}

// ============================================================
// 存档面板（顶栏「存档」按钮）
// ============================================================
function showMetaPanel() {
  loadMeta();
  const rows = TALENTS.map(function (t) {
    const lv = META.talents[t.id] || 0;
    const ok = metaUnlocked(t);
    const name = ok
      ? t.name + ' Lv' + lv
      : t.name + '（未解锁：通关 ' + t.unlockAt + ' 次解锁）';
    const note = ok ? t.desc(lv || 1) : '';
    return '<div class="meta-row' + (ok ? ' on' : '') + '">' +
        '<span class="meta-ico">' + t.icon + '</span>' +
        '<span class="meta-name">' + name + '</span>' +
        '<span class="meta-desc">' + note + '</span>' +
      '</div>';
  }).join('');

  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.innerHTML = `
    <div class="modal meta-modal">
      <h2>存档</h2>
