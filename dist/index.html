    desc: '点一个敌人引燃地火，范围内所有敌人受到等量法术伤害（随法师等级扩圈）',
  },
};

// 法师地火的等级档位（1 级 / 5 级 / 10 级各一档）
//   orth = 以靶心为中心向外的扩散形状：0 只有靶心 / 1 十字 4 格 / 2 周围 8 格
//   mult = 法术倍率 —— 法师本体攻击力压得很低，全靠这个系数把「法术伤害」顶起来
const FIRE_TIERS = [
  { lv: 1,  orth: 0, mult: 2.60, name: '地火1', area: '只烧中目标一人' },
  { lv: 5,  orth: 1, mult: 2.20, name: '地火2', area: '目标和前后左右各 1 格' },
  { lv: 10, orth: 2, mult: 1.80, name: '地火3', area: '目标和周围 8 格' },
];

const _CARD = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const _DIAG = [[1, 1], [1, -1], [-1, 1], [-1, -1]];

function atkModeOf(u) {
  if (!u) return 'cross1';
  return u.atkMode || 'cross1';
}

function atkRangeOf(u) {
  const cap = (CONFIG.SHAPE && CONFIG.SHAPE.RANGE_CAP) || 7;
  return Math.max(1, Math.min(cap, u.atkRange || 1));
}

function mountainBlocks() {
  return !!(CONFIG.SHAPE && CONFIG.SHAPE.MOUNTAIN_BLOCKS);
}

function _blocked(x, y) {
  return mountainBlocks() && terrainAt(x, y) === 'mountain';
}

// 射线：从 (fx,fy) 向 d 方向走 maxRange 步
//   stopAtMountain = true 时遇到高山就停（箭被挡住），并且山本身不可打
function _ray(set, fx, fy, dx, dy, maxRange, stopAtMountain) {
  let x = fx + dx, y = fy + dy;
  for (let i = 0; i < maxRange; i++) {
    if (!inBounds(x, y)) return;
    if (stopAtMountain && _blocked(x, y)) return;
    set.add(x + ',' + y);
    x += dx; y += dy;
  }
}

// ------------------------------------------------------------
// 十字 + 斜角（射手普攻 / 法师施法共用）
//   span=false（法师施法）：只取第 N 格那一层
//     N=2 → 十字第 2 格 + 四个斜角第 1 格（贴身第 1 格是死角）
//   span=true （射手普攻）：从里往外全都要，升级时里层不清空
//     N=2 → 十字第 2 格 + 斜角第 1 格
//     N=3 → 十字第 2~3 格 + 斜角第 1~2 格
//     N=4 → 十字第 2~4 格 + 斜角第 1~3 格
// ------------------------------------------------------------
function archerRingN(u) {
  const lv = (u && u.level) || 1;
  return lv >= 10 ? 4 : (lv >= 5 ? 3 : 2);
}

function _archerRingCells(out, fx, fy, n, span) {
  const orthFrom = span ? 2 : n;
  const diagTo = n - 1;
  for (let r = orthFrom; r <= n; r++) {
    _CARD.forEach(d => {
      const x = fx + d[0] * r, y = fy + d[1] * r;
      if (inBounds(x, y)) out.add(x + ',' + y);
    });
  }
  const diagFrom = span ? 1 : diagTo;
  for (let r = diagFrom; r <= diagTo; r++) {
    _DIAG.forEach(d => {
      const x = fx + d[0] * r, y = fy + d[1] * r;
      if (inBounds(x, y)) out.add(x + ',' + y);
    });
  }
}

// ------------------------------------------------------------
// 普攻可选格（不含自己）
// ------------------------------------------------------------
function atkCells(u, fx, fy) {
  const out = new Set();
  if (!u) return out;
  const mode = atkModeOf(u);

  if (mode === 'archerRing') {
    _archerRingCells(out, fx, fy, archerRingN(u), true);
    return out;
  }

  // cross1（以及敌人预览用的兜底）：前后左右，距离 range
  const r = atkRangeOf(u);
  _CARD.forEach(d => _ray(out, fx, fy, d[0], d[1], r, false));
  return out;
}

function _unitAt(x, y) {
  return (G && G.grid[y]) ? G.grid[y][x] : null;
}

// 普攻能打的敌人（站在 atkCells 里的敌对单位）
function atkTargets(u, fx, fy) {
  const res = [];
  if (!u || !G || !G.grid) return res;
  atkCells(u, fx, fy).forEach(k => {
    const i = k.indexOf(',');
    const t = _unitAt(+k.slice(0, i), +k.slice(i + 1));
    if (t && t.team !== u.team && t.hp > 0) res.push(t);
  });
  return res;
}

// 普攻范围的白话说明（行动栏 / 队伍表 / 新手引导共用）
function atkLabel(u) {
  const m = atkModeOf(u);
  if (m === 'archerRing') {
    const n = archerRingN(u);
    if (n <= 2) return '十字第 2 格 · 斜角第 1 格';
    return `十字第 2~${n} 格 · 斜角第 1~${n - 1} 格`;
  }
  const r = atkRangeOf(u);
  return r <= 1 ? '前后左右 1 格' : `前后左右 ${r} 格`;
}

function skillOf(u) {
  return (u && SKILLS[u.type]) ? SKILLS[u.type] : null;
}

// 地火档位（其他技能恒定返回第一档）
function fireTierOf(u) {
  const s = skillOf(u);
  if (!s || s.kind !== 'fire') return FIRE_TIERS[0];
  const lv = (u && u.level) || 1;
  let cur = FIRE_TIERS[0];
  FIRE_TIERS.forEach(t => { if (lv >= t.lv) cur = t; });
  return cur;
}

// 技能显示名：地火会带档位（地火1 / 地火2 / 地火3）
function skillLabelOf(u) {
  const s = skillOf(u);
  if (!s) return '';
  if (s.kind === 'fire') return fireTierOf(u).name;
  return s.name;
}

// 技能伤害系数（地火随档位下降，因为打的人变多了）
function skillMultOf(u) {
  const s = skillOf(u);
  if (!s) return 1;
  if (s.kind === 'fire') return fireTierOf(u).mult;
  return s.mult;
}

// 法术强度：法师的普攻已经压到 1，地火走这条独立数值（recalcHeroStats 结算）
function spellPowerOf(u) {
  if (!u) return 1;
  if (typeof u.spell === 'number' && u.spell > 0) return u.spell;
  return Math.max(1, u.atk || 1);
}

// 技能说明（队伍表 / 说明弹窗用，地火会写出当前档位的范围与真实伤害）
function skillDescOf(u) {
  const s = skillOf(u);
  if (!s) return '';
  if (s.kind === 'fire') {
    const t = fireTierOf(u);
    const dmg = Math.max(1, Math.floor(spellPowerOf(u) * t.mult));
    return `${t.area}，各受约 ${dmg} 点法术伤害`;
  }
  return s.desc;
}

// 施法距离的白话说明（固定不变远 —— 法师升级只扩大爆炸范围）
function skillRangeLabel(u) {
  const s = skillOf(u);
  if (!s) return '';
  if (s.cast === 'archerRing') {
    const n = s.castN || 2;
    return `十字第 ${n} 格 · 斜角第 ${n - 1} 格`;
  }
  return `前后左右 ${s.range || 1} 格`;
}

// ------------------------------------------------------------
// 技能：可点击的落点（都必须踩着敌人，否则点了也没意义）
//   地火的施法距离 = 射手 1 级的形状：十字第 2 格 + 斜角第 1 格，
//   **固定不随等级变远**，而且贴身的第 1 格永远烧不到。
// ------------------------------------------------------------
function skillCastCells(u) {
  const out = new Set();
  const s = skillOf(u);
  if (!u || !s) return out;
  if (s.cast === 'archerRing') {
    _archerRingCells(out, u.x, u.y, s.castN || 2, false);
    return out;
  }
  // 兜底：十字 range 格
  _CARD.forEach(d => _ray(out, u.x, u.y, d[0], d[1], s.range || 2, false));
  return out;
}

function skillAnchorCells(u) {
  const out = new Set();
  if (!u || !skillOf(u) || !G || !G.grid) return out;
  skillCastCells(u).forEach(k => {
    const i = k.indexOf(',');
    const t = _unitAt(+k.slice(0, i), +k.slice(i + 1));
    if (t && t.team !== u.team && t.hp > 0) out.add(k);
  });
  return out;
}

// 技能落点确定后，实际覆盖哪些格子
//   fire → 靶心 + 前后左右（地火2）/ 靶心 + 周围八格（地火3）
function skillCoverCells(u, ax, ay) {
  const out = new Set();
  const s = skillOf(u);
  if (!u || !s || !G || !G.grid) return out;

  const t = fireTierOf(u);
  if (t.orth === 0) return out;                 // 地火1：只有靶心，没有额外格子
  _CARD.forEach(d => {
    const x = ax + d[0], y = ay + d[1];
    if (inBounds(x, y)) out.add(x + ',' + y);
  });
  if (t.orth >= 2) {
    for (let dy = -1; dy <= 1; dy++)
      for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const x = ax + dx, y = ay + dy;
        if (inBounds(x, y)) out.add(x + ',' + y);
      }
  }
  return out;
}

// 覆盖格里站着的敌人（靶心排第一，它是这场爆发的中心）
function skillTargetsAt(u, ax, ay) {
  const res = [];
  const seen = new Set();
  const push = (t) => {
    if (!t || t.team === u.team || t.hp <= 0) return;
    const key = t.x + ',' + t.y;
    if (seen.has(key)) return;
    seen.add(key);
    res.push(t);
  };
  push(_unitAt(ax, ay));
  skillCoverCells(u, ax, ay).forEach(k => {
    const i = k.indexOf(',');
    push(_unitAt(+k.slice(0, i), +k.slice(i + 1)));
  });
  return res;
}

// 技能当前能打到几个人（行动栏按钮用）：取所有落点里命中最多的那个
function skillHitCount(u) {
  if (!u) return 0;
  if (!skillOf(u)) return 0;
  let best = 0;
  skillAnchorCells(u).forEach(k => {
    const i = k.indexOf(',');
    const n = skillTargetsAt(u, +k.slice(0, i), +k.slice(i + 1)).length;
    if (n > best) best = n;
  });
  return best;
}

// ------------------------------------------------------------
// 敌方威胁范围（悬浮到敌人身上时预演「它下回合能打到哪」）
//   敌人沿用旧规则：十字射程；魔法师全屏
// ------------------------------------------------------------
function enemyThreatCells(u) {
  const out = new Set();
  if (!u || !G || !G.grid) return out;
  if (u.mage) {
    for (let y = 0; y < CONFIG.SIZE; y++)
      for (let x = 0; x < CONFIG.SIZE; x++)
        if (x !== u.x || y !== u.y) out.add(x + ',' + y);
    return out;
  }
  const r = Math.min(7, u.range || 1);
  _CARD.forEach(d => _ray(out, u.x, u.y, d[0], d[1], r, false));
  return out;
}

</script>
<script>
/* ===== battle/board.js ===== */
// ============================================================
// 地图渲染 + 点击处理（2026-10-24 真正的战棋操作）
//
//   一次操作流程：
//     点己方单位 → 亮出「蓝色可移动格」+「红色可攻击格」
//       · 点蓝格  = 移动（不结束行动，之后还能攻击）
//       · 点红格  = 攻击那个敌人（打一下就结束这个单位的行动）
//       · 点技能  = 进入技能模式，再点一个敌人当落点 / 方向
//       · 点自己  = 待命（结束这个单位的行动，最常用，所以放在最顺手的位置）
//   单位属性不再靠长按 / 悬浮查看：顶栏「队伍」按钮里有一张完整表格。
// ============================================================
function renderBoard() {
  const board = document.getElementById('board');
  if (!board) return;
  board.innerHTML = '';

  const hl = getHighlights();
  const sel = (G.selected && G.grid[G.selected.y])
    ? G.grid[G.selected.y][G.selected.x] : null;

  for (let y = 0; y < CONFIG.SIZE; y++) {
    for (let x = 0; x < CONFIG.SIZE; x++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const u = G.grid[y][x];
      const td = terrainDef(x, y);

      // 地形：背景纹理 + 空格上的地形图标
      if (td.key !== 'plain') cell.classList.add('terrain-' + td.key);

      // 阵营
      if (u) {
        if (u.team === 'player') cell.classList.add('ally');
        else cell.classList.add('enemy');

        cell.textContent = u.icon;
        if (u.isHero) cell.classList.add('hero');
        if (u.isBoss) cell.classList.add('boss');
        if (u.team === 'player' && u.hasActed) cell.classList.add('done');

        // 等级角标
        const lv = document.createElement('div');
        lv.className = 'lv-badge';
        lv.textContent = 'Lv' + (u.level || 1);
        cell.appendChild(lv);

        // 血条
        const bar = document.createElement('div');
        bar.className = 'hp-bar';
        const fill = document.createElement('div');
        fill.className = 'hp-fill';
        const pct = Math.max(0, (u.hp / u.maxHp) * 100);
        fill.style.width = pct + '%';
        bar.appendChild(fill);
        cell.appendChild(bar);

        // 桌面鼠标悬停：预演「它现在能打到哪」（只是高亮，不弹详情框）
        if (!IS_TOUCH) {
          cell.onmouseenter = () => {
            if (u.team === 'enemy') previewThreat(u);
            else previewAtkFrom(u, u.x, u.y);
          };
          cell.onmouseleave = () => clearShapePreview();
        }
      } else {
        if (td.key !== 'plain') {
          const ic = document.createElement('span');
          ic.className = 'terrain-icon';
          ic.textContent = td.icon;
          cell.appendChild(ic);
        }
        // 悬停可达格：预演「站到这里能打到哪」——战棋的核心信息
        if (!IS_TOUCH && sel && hl.move.has(`${x},${y}`)) {
          cell.onmouseenter = () => previewAtkFrom(sel, x, y);
          cell.onmouseleave = () => clearShapePreview();
        }
      }

      // 高亮
      const key = `${x},${y}`;
      if (hl.move.has(key)) cell.classList.add('moveable');
      if (hl.range.has(key)) cell.classList.add('atk-range');
      if (hl.attack.has(key)) cell.classList.add('attackable');
      if (hl.skill.has(key)) cell.classList.add('skillable');
      if (G.selected && G.selected.x === x && G.selected.y === y) cell.classList.add('selected');

      cell.onclick = () => handleClick(x, y);
      board.appendChild(cell);
    }
  }

  // 说明（地形 / 我方单位 / 操作方式）已收进顶栏「说明」弹窗，
  // 不再每次渲染都重算一遍
}

// ------------------------------------------------------------
// 当前该高亮哪些格子
//   move   蓝色：还能走的格（只有没移动过且没行动过才有）
//   range  淡红：普攻能覆盖到的格（说明「我打得到多远」）
//   attack 实红：其中站着敌人的格（点一下就开打）
//   skill  紫色：技能模式下的可选落点
// ------------------------------------------------------------
function getHighlights() {
  const move = new Set(), range = new Set(), attack = new Set(), skill = new Set();
  const empty = { move, range, attack, skill };
  if (!G.selected || G.phase !== 'player' || G.gameOver) return empty;

  const u = G.grid[G.selected.y] && G.grid[G.selected.y][G.selected.x];
  if (!u || u.team !== 'player') return empty;

  if (!u.hasMoved && !u.hasActed && !u.noMove) {
    const maxMove = u.fullMove ? 99 : u.move;
    const map = computeMoveMap(u);
    Object.keys(map).forEach(k => {
      const c = map[k];
      if (c > 0 && c <= maxMove) move.add(k);
    });
  }

  if (!u.hasActed) {
    atkCells(u, u.x, u.y).forEach(k => {
      range.add(k);
      const t = G.grid[+k.slice(k.indexOf(',') + 1)][+k.slice(0, k.indexOf(','))];
      if (t && t.team !== u.team && t.hp > 0) attack.add(k);
    });
    if (G.mode === 'skill') skillAnchorCells(u).forEach(k => skill.add(k));
  }
  return { move, range, attack, skill };
}

// ------------------------------------------------------------
// 预演：悬停可达格 / 己方单位时，直接画出「站到这里的攻击覆盖」
// ------------------------------------------------------------
function previewAtkFrom(u, fx, fy) {
  clearShapePreview();
  const board = document.getElementById('board');
  if (!board || !board.children || !u) return;

  atkCells(u, fx, fy).forEach(k => {
    const i = k.indexOf(',');
    const x = +k.slice(0, i), y = +k.slice(i + 1);
    const cell = board.children[y * CONFIG.SIZE + x];
    if (!cell || !cell.classList) return;
    const t = G.grid[y] && G.grid[y][x];
    cell.classList.add((t && t.team !== u.team && t.hp > 0) ? 'pv-hit' : 'pv-cell');
  });

  const self = board.children[fy * CONFIG.SIZE + fx];
  if (self && self.classList) self.classList.add('pv-self');
}

// 敌方威胁范围（红斜纹）
function previewThreat(u) {
  clearShapePreview();
  const board = document.getElementById('board');
  if (!board || !board.children || !u) return;
  enemyThreatCells(u).forEach(k => {
    const i = k.indexOf(',');
    const cell = board.children[+k.slice(i + 1) * CONFIG.SIZE + +k.slice(0, i)];
    if (cell && cell.classList) cell.classList.add('th-threat');
  });
  const self = board.children[u.y * CONFIG.SIZE + u.x];
  if (self && self.classList) self.classList.add('th-threat');
}

function clearShapePreview() {
  const board = document.getElementById('board');
  if (!board || !board.children) return;
  const cls = ['pv-hit', 'pv-cell', 'pv-self', 'pv-heal', 'th-threat'];
  for (let i = 0; i < board.children.length; i++) {
    const c = board.children[i];
    if (c && c.classList) c.classList.remove(...cls);
  }
}

// ------------------------------------------------------------
// 点击：整局游戏唯一的操作入口
// ------------------------------------------------------------
function handleClick(x, y) {
  if (G.gameOver || G.phase !== 'player') return;
  clearShapePreview();

  const u = G.grid[y][x];
  const sel = G.selected ? (G.grid[G.selected.y] && G.grid[G.selected.y][G.selected.x]) : null;

  // 选中的单位已经没了（阵亡 / 换层）→ 清掉选中
  if (G.selected && !sel) { G.selected = null; G.mode = null; render(); return; }

  // ===== 技能模式：这一下点击是在选落点 / 方向 =====
  if (G.mode === 'skill' && sel && actionReady(sel)) {
    if (skillAnchorCells(sel).has(x + ',' + y)) { doSkill(sel, x, y); return; }
    // 点歪了：退出技能模式并告诉玩家为什么，不消耗行动
    G.mode = null;
    floatText(x, y, '不在技能范围', 'float-miss');
    render();
    return;
  }

  if (sel && actionReady(sel)) {
    // 点自己所在格 → 待命（结束这个单位的行动）。
    // 这是全场点得最多的操作，所以直接给最短路径：点完人再点一下自己就过了。
    // 想取消选中：点行动栏左边的名字，或者点另一个自己人。
    if (sel.x === x && sel.y === y) { standBy(sel); return; }

    // 点另一个己方 → 换人
    if (u && u.team === 'player') {
      if (actionReady(u)) { G.selected = { x, y }; G.mode = null; render(); return; }
      floatText(x, y, '它已行动', 'float-miss');
      return;
    }

    // 点敌人 → 在射程内就打，够不着给个明确提示
    if (u && u.team === 'enemy') {
      if (atkCells(sel, sel.x, sel.y).has(x + ',' + y)) { doAttack(sel, u); return; }
      floatText(x, y, '够不着', 'float-miss');
      log(`${sel.name} 射程 ${atkLabel(sel)}，够不到 ${u.name}（试试技能）`, 'miss', true);
      return;
    }

    // 点空格 → 移动（移动不结束行动，之后还能攻击）
    if (!u) {
      const canMove = !sel.hasMoved && !sel.hasActed && !sel.noMove;
      const maxMove = sel.fullMove ? 99 : sel.move;
      const cost = canMove ? moveCostTo(sel, x, y) : Infinity;
      if (canMove && cost <= maxMove) {
        G.grid[sel.y][sel.x] = null;
        G.grid[y][x] = sel;
        sel.x = x; sel.y = y;
        sel.hasMoved = true;
        G.selected = { x, y };
        floatText(x, y, '移动', 'float-move');
        recalcHeroStats();          // 位置变了，重算属性
        render();
        saveGame();
        return;
      }
      // 下面这几种都是「点了走不了的地方」：一律给明确原因并保持选中，
      // 绝不静默取消选中 —— 玩家点空地想走过去，结果人被取消选中会一头雾水
      if (!isPassable(x, y)) {
        floatText(x, y, TERRAIN[terrainAt(x, y)].name + '·不可通行', 'float-miss');
        return;
      }
      if (sel.noMove) {
        floatText(x, y, '本局无法移动', 'float-miss');
        return;
      }
      if (sel.hasMoved) {
        floatText(x, y, '这回合已经移动过', 'float-miss');
        return;
      }
      floatText(x, y, '走不到（移动力 ' + maxMove + '）', 'float-miss');
      return;
    }
  }

  // 选中己方
  if (u && u.team === 'player') {
    if (!actionReady(u)) { floatText(x, y, '本回合已行动', 'float-miss'); return; }
    G.selected = { x, y };
    G.mode = null;
    render();
    return;
  }

  G.selected = null;
  G.mode = null;
  render();
}

// 治疗buff 当前系数（基础 + 卡牌加成）
function healPctOf() {
  return CONFIG.HEAL_REGEN + ((G && G.healBonus) || 0);
}

</script>
<script>
/* ===== battle/combat.js ===== */
// ============================================================
// 战斗：攻击、伤害、死亡
// ============================================================
// 说明：2026-10-24 起改为手动战棋 —— 玩家在射程内点谁就打谁（battle/action.js）。
// 本文件只负责「一次伤害结算」，不再自动开火。
//   mult  伤害倍率（技能 AOE 用）
//   opts  { noBeam } 不画攻击者→目标的光束（技能一次打一片时用，避免一堆光束糊屏）
//         { quiet }  这条伤害只写日志栏，不飘弹幕（AOE 多段命中时由技能统一播报）

function dealDamage(g, attacker, target, mult = 1, opts) {
  const o = opts || {};
  // 攻击音效：按出手单位类型给不同音色（鸟人 / 射手 / 法师 / 敌人 / BOSS）
  if (typeof SFX !== 'undefined') SFX.attack(attacker);

  // 地形：站在森林里出手，视野被树木遮挡 → 命中率 -20%
  const inForest = isForest(attacker.x, attacker.y);
  const dodgeChance = Math.min(0.9, (target.dodge || 0) + (inForest ? FOREST_MISS : 0));
  if (Math.random() < dodgeChance) {
    if (typeof SFX !== 'undefined') SFX.miss();
    battleFx(attacker.x, attacker.y, target.x, target.y, 'miss', attacker.team);
    floatText(target.x, target.y, 'MISS', 'float-miss');
    log(`${target.name} 闪避了攻击！${inForest ? `（${attacker.name} 身处森林，命中下降）` : ''}`,
        target.team === 'player' ? 'player' : 'enemy', o.quiet);
    return;
  }

  const af = attacker.affix || {};
  const isCrit = Math.random() < attacker.crit;
  let critMul = 1.8 + (af.critDmg || 0);
  // 伤害基数：默认用普攻攻击力；法术（地火）走独立的法术强度，由调用方传进来
  const baseDmg = (o.baseDmg != null) ? o.baseDmg : attacker.atk;
  // 攻击加成（atkBuff）已经在 recalcHeroStats 里乘进 attacker.atk，这里不再重复乘
  let dmg = Math.floor(baseDmg * (isCrit ? critMul : 1) * mult);

  // 装备词条：概率双倍
  let isDouble = false;
  if (af.double && Math.random() < af.double) { dmg *= 2; isDouble = true; }

  // 装备词条：处决——对生命低于 30% 的目标额外加伤
  let isExecute = false;
  if (af.execute && target.maxHp > 0 && target.hp / target.maxHp < 0.3) {
    dmg = Math.floor(dmg * (1 + af.execute));
    isExecute = true;
  }

  // 卧薪尝胆：损血越多攻击越高（可叠加层数，每层再加一次收益）
  const grudgeLv = attacker.grudgeLv || (attacker.grudge ? 1 : 0);
  if (grudgeLv > 0 && attacker.hp < attacker.maxHp) {
    const lost = 1 - attacker.hp / attacker.maxHp;
    dmg = Math.floor(dmg * (1 + Math.min(2.0, lost * 0.5 * grudgeLv)));
  }

  let def = target.defense || 0;
  if (target.noDefense) def = -9999;
  if (def > 0) dmg = Math.floor(dmg * (1 - def));
  if (def < 0) dmg = 99999;

  // 目标装备词条：受伤减免
  const tReduce = Math.min(0.9, (target.affix && target.affix.reduce) || 0);
  if (def >= 0 && tReduce > 0) dmg = Math.floor(dmg * (1 - tReduce));

  // 护甲 / 魔抗（2026-10-24 加入）
  //   · 法术伤害（法师的地火 o.magic / 敌方法师 isMagic）→ 由「魔抗」按百分比减伤
  //   · 物理伤害（所有普攻）→ 由「护甲」按固定值减伤；带「破甲」词条则无视护甲
  //   坦克护甲高魔抗低，所以砍不动的时候换法师的地火去烧。
  //   注意：别把减伤结果写回 opts —— doSkill 一次打一片时共用同一个对象。
  const isMagic = !!(o.magic || attacker.isMagic);
  let armorCut = 0, mrCut = 0;
  if (def >= 0) {
    if (isMagic) {
      const mr = Math.min(0.9, target.magicRes || 0);
      if (mr > 0) { dmg = Math.floor(dmg * (1 - mr)); mrCut = mr; }
    } else if (!af.armorPen) {
      const arm = target.armor || 0;
      if (arm > 0) { dmg = Math.max(1, dmg - arm); armorCut = arm; }
    }
  }

  // 攻击者装备词条：附加伤害
  if (af.bonus && def >= 0) dmg += Math.floor(dmg * af.bonus);

  // ===== 待发·受伤型卡牌（在扣血之前判定，可免疫 / 反弹 / 全体回满血）=====
  if (target.team === 'player') {
    const hctx = { attacker, target, dmg, cancel: false, reflect: 0 };
    fireArmed('hurt', hctx);

    if (hctx.cancel) {
      battleFx(attacker.x, attacker.y, target.x, target.y, 'miss', attacker.team);
      floatText(target.x, target.y, '免疫', 'float-miss');
      log(`🛡️ ${target.name} 免疫了 ${attacker.name} 的攻击`, 'system');
      return;
    }
    if (hctx.reflect > 0) {
      attacker.hp = Math.max(1, attacker.hp - hctx.reflect);
      floatText(attacker.x, attacker.y, '反弹 -' + hctx.reflect, 'float-dmg');
      log(`🪞 反弹 ${hctx.reflect} 伤害给 ${attacker.name}`, 'system');
      if (attacker.hp <= 0) killUnit(g, attacker, target);
    }
  }

  target.hp -= dmg;
  const cls = isCrit ? 'float-crit' : 'float-dmg';
  const tag = (isCrit ? '暴击 ' : '') + (isDouble ? '双倍 ' : '') + (isExecute ? '处决 ' : '');
  if (typeof SFX !== 'undefined') SFX.hit(isCrit, isDouble || isExecute);
  // 单体普攻：画一条「攻击者 → 目标」的光束，出手方向一眼可见
  battleFx(attacker.x, attacker.y, target.x, target.y,
    (isCrit || isDouble) ? 'crit' : 'hit', attacker.team,
    { noBeam: !!o.noBeam });
  floatText(target.x, target.y, tag + '-' + dmg, cls);
  // 减伤提示：护甲 / 魔抗挡掉了多少，直接写在日志里 ——
  // 不然「打坦克只掉 3 血」会让人以为出 bug 了
  const mit = armorCut > 0 ? `（护甲 -${armorCut}）`
            : mrCut > 0 ? `（魔抗 -${Math.round(mrCut * 100)}%）` : '';
  // 弹幕：暴击走大字「crit」，普通命中走小字流水
  log(`${attacker.name} 攻击 ${target.name}，造成 ${dmg} 伤害${mit}`
    + `${isCrit ? '（暴击！）' : ''}${isDouble ? '（双倍！）' : ''}${isExecute ? '（处决！）' : ''}`,
      isCrit ? 'crit' : (attacker.team === 'player' ? 'player' : 'enemy'), o.quiet);

  // 装备词条：每次命中额外获得金币
  if (af.goldPerHit && attacker.team === 'player') {
    g.gold += af.goldPerHit;
    floatText(attacker.x, attacker.y, '+' + af.goldPerHit + '金', 'float-exp');
  }

  // 装备词条：流血——命中后目标每回合损失「攻击力 × val」，持续 2 回合
  if (af.bleed && target.hp > 0 && target.team !== attacker.team) {
    const bd = Math.max(1, Math.floor(attacker.atk * af.bleed));
    target.bleedDmg = Math.max(target.bleedDmg || 0, bd);
    target.bleedTurns = 2;
    log(`🩸 ${target.name} 陷入流血（每回合 -${target.bleedDmg}，持续 2 回合）`,
      attacker.team === 'player' ? 'player' : 'enemy');
  }

  // 垃圾话（只在对面有 BOSS 时才说）—— 只落日志，不再冒头顶气泡
  const bossOnField = hasBoss();
  if (bossOnField && isCrit && attacker.isHero) say(attacker, pick(HERO_TAUNTS.crit));
  if (isCrit && attacker.isBoss) say(attacker, pick(BOSS_TAUNTS.crit));
  if (target.isHero && attacker.isBoss && Math.random() < 0.3) say(attacker, pick(BOSS_TAUNTS.heroHurt));
  if (bossOnField && target.isHero && target.hp > 0 && target.hp / target.maxHp < 0.5 && Math.random() < 0.3)
    say(target, pick(HERO_TAUNTS.hurt));

  // 装备词条：攻击吸血
  if (af.lifesteal && dmg > 0 && attacker.hp > 0 && attacker.hp < attacker.maxHp) {
    const steal = Math.max(1, Math.floor(dmg * af.lifesteal));
    attacker.hp = Math.min(attacker.maxHp, attacker.hp + steal);
    battleFx(attacker.x, attacker.y, attacker.x, attacker.y, 'heal', attacker.team);
    floatText(attacker.x, attacker.y, '+' + steal, 'float-heal');
  }

  // 反弹
  if (target.reflect && target.hp > 0) {
    const ref = Math.floor(dmg * target.reflect);
    attacker.hp = Math.max(1, attacker.hp - ref);
    floatText(attacker.x, attacker.y, '反弹 -' + ref, 'float-dmg');
  }

  // 装备词条：棘刺——被攻击时对攻击者造成固定反伤
  const tThorns = Math.max(0, (target.affix && target.affix.thorns) || 0);
  if (tThorns > 0 && attacker.hp > 0) {
    attacker.hp = Math.max(0, attacker.hp - tThorns);
    floatText(attacker.x, attacker.y, '反伤 -' + tThorns, 'float-dmg');
    log(`🧷 棘刺反伤：${attacker.name} 受到 ${tThorns} 点反伤`, 'system');
    if (attacker.hp <= 0) killUnit(g, attacker, target);
  }

  // 溅射
  if (attacker.splash) {
    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
    dirs.forEach(([dx, dy]) => {
      const nx = target.x + dx, ny = target.y + dy;
      if (!inBounds(nx, ny)) return;
      const e = g.grid[ny][nx];
      if (e && e.team !== attacker.team) {
        const sd = Math.floor(attacker.atk * attacker.splash);
        e.hp -= sd;
        battleFx(target.x, target.y, nx, ny, 'hit', attacker.team,
          { noBeam: !!o.noBeam });
        floatText(nx, ny, '-' + sd, 'float-dmg');
        if (e.hp <= 0) killUnit(g, e, attacker);
      }
    });
  }

  // 击退
  if (attacker.knockback) {
    const dx = Math.sign(target.x - attacker.x);
    const dy = Math.sign(target.y - attacker.y);
    for (let i = 0; i < attacker.knockback; i++) {
      const nx = target.x + dx, ny = target.y + dy;
      if (!inBounds(nx, ny) || g.grid[ny][nx]) break;
      g.grid[target.y][target.x] = null;
      target.x = nx; target.y = ny;
      g.grid[ny][nx] = target;
    }
  }

  // 死亡处理（锁血 / 复活都是「次数」，可叠加：用掉一次减一层）
  if (target.hp <= 0) {
    if (target.undyingCount > 0) {
      target.undyingCount--;
      target.hp = 1;
      floatText(target.x, target.y, '锁血！', 'float-crit');
      log(`🛡️ ${target.name} 锁血不死（剩 ${target.undyingCount} 次）`, 'system');
    } else if (target.reviveCount > 0) {
      target.reviveCount--;
      target.hp = target.maxHp;
      floatText(target.x, target.y, '复活！', 'float-heal');
      log(`🕊️ ${target.name} 原地复活（剩 ${target.reviveCount} 次）`, 'system');
    } else {
      killUnit(g, target, attacker);
    }
  }
}

// ============================================================
// 固定伤害（卡牌专用）：无视闪避 / 防御 / 护甲 / 魔抗，直接扣血
// ============================================================
function fixedDamage(g, target, amount) {
  if (!g || !target || target.hp <= 0 || amount <= 0) return 0;
  target.hp -= amount;
  battleFx(target.x, target.y, target.x, target.y, 'crit', target.team === 'player' ? 'enemy' : 'player');
  floatText(target.x, target.y, '-' + amount, 'float-crit');
  log(`💥 固定伤害 ${amount} → ${target.name}（剩 ${Math.max(0, target.hp)}）`, 'system');
  if (target.hp <= 0) killUnit(g, target, g.hero);
  return amount;
}

function killUnit(g, u, killer) {
  g.grid[u.y][u.x] = null;
  if (typeof SFX !== 'undefined') SFX.death();

  if (u.team === 'enemy') {
    g.enemies = g.enemies.filter(e => e !== u);
    deathFx(u.x, u.y);
    floatText(u.x, u.y, '击杀！', 'float-kill');

    // 金币（含「击杀额外金币」词条）
    const killBonus = (killer && killer.affix && killer.affix.goldOnKill) || 0;
    const goldGain = CONFIG.GOLD.KILL + (g.goldBonus || 0) + killBonus;
    g.gold += goldGain;
    if (typeof SFX !== 'undefined') SFX.coin();

    // 详细击杀日志：谁杀的、等级、金币
    const killerName = (killer && killer.team === 'player') ? killer.name : '友军';
    log(`⚔️ ${killerName} 击杀 ${u.name}（Lv${u.level || 1}）`, 'kill');
    log(`   +${goldGain} 金币（共 ${g.gold}）`, 'system', true);
    if (u.isBoss) log('☠️ 魔王被击败了！', 'kill');

    // 击杀成长（累积到 bonusAtk，由 recalcHeroStats 结算）
    g.allies.forEach(a => {
      if (a.killGrowth) {
        a.bonusAtk += a.killGrowth;
        floatText(a.x, a.y, `+${a.killGrowth}攻`, 'float-exp');
        log(`📈 ${a.name} 击杀成长：攻击 +${a.killGrowth}（累计 +${a.bonusAtk}）`, 'exp');
      }
    });

    // 经验：击杀者拿全额，其余存活队友拿助攻经验
    //   （只给击杀者的话，鸟人伤害高 → 抢人头 → 等级越拉越开，队友永远追不上）
    const baseExp = u.isBoss ? CONFIG.EXP.KILL_BOSS : CONFIG.EXP.KILL;
    if (killer && killer.team === 'player' && killer.hp > 0) {
      gainExp(killer, baseExp, `击杀 ${u.name}`);
    }
    const assistExp = Math.max(1, Math.floor(baseExp * (CONFIG.EXP.ASSIST || 0)));
    g.allies.forEach(a => {
      if (a === killer || a.hp <= 0 || a.team !== 'player') return;
      gainExp(a, assistExp, `助攻 ${u.name}`, true);
    });

    // 垃圾话（只在对面有 BOSS 时才说）—— 只落日志
    if (hasBoss() && g.hero && g.hero.isHero) say(g.hero, pick(HERO_TAUNTS.kill));
    if (u.isBoss && g.hero) say(g.hero, pick(HERO_TAUNTS.killBoss));

    recalcHeroStats();

    // BOSS 层：魔王一倒立刻判通关（流血 / 反伤 / 技能多段打死也走这条路）
    if (u.isBoss && typeof checkWin === 'function') checkWin();
  } else {
    g.allies = g.allies.filter(a => a !== u);
    deathFx(u.x, u.y);
    floatText(u.x, u.y, '阵亡', 'float-kill');
    log(`💀 ${u.name}（Lv${u.level || 1}）阵亡！剩余友军 ${g.allies.length} 人`, 'kill');

    // 敢杀我的马：主角（英雄）以外的友军阵亡触发，叠主角攻击
    if (!u.isHero && g.hero.revenge) {
      g.hero.revengeCount = (g.hero.revengeCount || 0) + 1;
      log(`敢杀我的马！${g.hero.name}攻击叠加（${g.hero.revengeCount}）`, 'system');
      recalcHeroStats();
    }

    if (u.isHero) {
      if (hasBoss()) {
        log(pick(HERO_TAUNTS.die), 'taunt-hero');
        const boss = g.enemies.find(e => e && e.isBoss && e.hp > 0);
        if (boss) say(boss, pick(BOSS_TAUNTS.heroDie));
      }
      g.gameOver = true;
      clearSave();
      setTimeout(() => showFailModal(), 500);
    }
  }
}

// ============================================================
// 经验 / 升级
// ============================================================
function gainExp(u, amount, reason, silent) {
  if (u.team !== 'player') return;
  u.exp = (u.exp || 0) + amount;
  let need = CONFIG.EXP.LEVEL_UP(u.level || 1);
  // 助攻经验走 silent，否则每杀一个人刷 2 条日志，日志栏会被挤爆
  if (!silent) {
    log(`📖 ${u.name} 获得 ${amount} 经验${reason ? `（${reason}）` : ''} · 进度 ${u.exp}/${need}`, 'exp');
  }
  while (u.exp >= need) {
    u.exp -= need;
    levelUp(u);
    need = CONFIG.EXP.LEVEL_UP(u.level);
  }
}

function levelUp(u) {
  const before = {
    maxHp: u.maxHp, atk: u.atk, range: u.range, move: u.move,
    crit: u.crit, dodge: u.dodge,
  };
  const from = u.level || 1;
  u.level = from + 1;

  // 属性/射程/移动/治疗量统一由 recalcHeroStats 按等级成长结算
  recalcHeroStats();
  u.hp = u.maxHp;   // 升级回满

  // 详细日志：这次升级到底加了哪些属性
  const gains = [];
  if (u.maxHp !== before.maxHp) gains.push(`生命 ${before.maxHp}→${u.maxHp}（+${u.maxHp - before.maxHp}）`);
  if (u.atk !== before.atk) gains.push(`攻击 ${before.atk}→${u.atk}（+${u.atk - before.atk}）`);
  if (u.range !== before.range) gains.push(`射程 ${before.range}→${u.range}`);
  if (u.move !== before.move) gains.push(`移动 ${before.move}→${u.move}`);
  if (u.crit !== before.crit) gains.push(`暴击 ${Math.round(before.crit * 100)}%→${Math.round(u.crit * 100)}%`);

  if (typeof SFX !== 'undefined') SFX.levelup();
  floatText(u.x, u.y, `升级！Lv${u.level}`, 'float-levelup');
  log(`⭐ ${u.name} 升级！Lv${from} → Lv${u.level}：${gains.join(' · ') || '无属性变化'}（血量回满）`, 'levelup');
  if (u.isHero && hasBoss()) say(u, pick(HERO_TAUNTS.levelup));
}
</script>
<script>
/* ===== battle/action.js ===== */
// ============================================================
// 单位动作：攻击 / 技能 / 待命
//
//   2026-10-24：自动开火已删除。这里是玩家每一次操作真正落地的地方。
//   一个单位每回合的额度 = 「移动一次」+「做上面三件事之一」，做完即结束行动。
//   （道具系统已于同日删除，金币只剩抽卡 / 全队治疗两个出口）
// ============================================================

function actionReady(u) {
  return !!u && u.hp > 0 && u.team === 'player' && !u.hasActed
    && G && G.phase === 'player' && !G.gameOver;
}

// 结束某个单位的行动：标记 → 重算属性 → 重绘 → 判定通关 / 全员行动完
function finishAction(u) {
  if (!u) return;
  u.hasMoved = true;
  u.hasActed = true;
  G.selected = null;
  G.mode = null;
  recalcHeroStats();        // 位置 / 状态变化会影响装备词条结算
  render();
  checkWin();               // 清场 → 通关结算
  checkAllActed();          // 全员行动完 → 自动换敌方回合
  saveGame();
}

// ------------------------------------------------------------
// ① 普攻：射程内点一个目标，只打这一个人
// ------------------------------------------------------------
function doAttack(u, t) {
  if (!actionReady(u) || !t || t.hp <= 0) return false;
  G.mode = null;

  // 待发·攻击型卡牌（一拳 / 三刀流 / 神罗天征 / 五连鞭 / 点穴手）在出手瞬间释放
  fireArmed('attack', { attacker: u, target: t });

  const times = u.multiAttack > 0 ? Math.max(1, u.multiAttack) : 1;
  u.multiAttack = 0;
  for (let i = 0; i < times; i++) {
    if (t.hp <= 0 || u.hp <= 0) break;
    dealDamage(G, u, t);
  }

  finishAction(u);
  return true;
}

// ------------------------------------------------------------
// ② 技能：现在只有法师的地火（见 battle/shape.js 的 SKILLS）
//    地火是**法术伤害**：吃目标的魔抗、无视护甲 —— 坦克的克星
// ------------------------------------------------------------
function doSkill(u, ax, ay) {
  if (!actionReady(u)) return false;
  const s = skillOf(u);
  if (!s) return false;

  const anchors = skillAnchorCells(u);
  if (!anchors.has(ax + ',' + ay)) return false;
  G.mode = null;

  // 覆盖目标：以落点为靶心，按档位算出这一片
  const targets = skillTargetsAt(u, ax, ay);
  if (!targets.length) return false;

  const mult = skillMultOf(u);

  if (typeof SFX !== 'undefined') SFX.skill && SFX.skill();
  if (typeof skillCastFx === 'function') skillCastFx(u, s, ax, ay);

  log(`${s.icon} ${u.name} 释放【${skillLabelOf(u)}】· ${targets.length} 个目标`, 'skill');

  if (typeof DM !== 'undefined') DM.result(`${s.icon} ${skillLabelOf(u)}！`, true);

  let kills = 0, total = 0;
  const alive = targets.filter(t => t.hp > 0);
  alive.forEach(t => {
    if (G.gameOver || u.hp <= 0) return;
    if (!t || t.hp <= 0) return;
    const before = t.hp;
    // 地火按「法术强度」结算，不走法师那点可怜的普攻
    dealDamage(G, u, t, mult, { noBeam: true, quiet: true, magic: true, baseDmg: spellPowerOf(u) });
    total += Math.max(0, before - Math.max(0, t.hp));
    if (t.hp <= 0) kills++;
  });

  // 一次打一片，最该看见的是「这一下总共砸了多少」——单发数字已经飘在棋盘上了
  if (alive.length > 0) {
    const tail = kills > 0 ? ` · 击杀 ${kills}` : '';
    log(`   合计造成 ${total} 伤害${tail}`, 'skill', true);
    if (typeof DM !== 'undefined') DM.push(`合计 ${total} 伤害${tail}`, 'skill');
  }

  // 爽点：一发打掉两个以上 → 报连杀
  if (kills >= 2 && typeof DM !== 'undefined') {
    DM.result(kills >= 3 ? `${kills} 杀！清场级爆发` : '双杀！', true);
  }

  finishAction(u);
  return true;
}

// ------------------------------------------------------------
// ③ 待命：结束这个单位的行动，不开火
//    （2026-10-24：再点一次自己脚下的格子也会走到这里，见 board.js handleClick）
// ------------------------------------------------------------
function standBy(u) {
  if (!actionReady(u)) return false;
  floatText(u.x, u.y, '待命', 'float-move');
  log(`${u.icon} ${u.name} 待命`, 'system', true);
  finishAction(u);
  return true;
}

</script>
<script>
/* ===== battle/ai.js ===== */
// ============================================================
// 敌人 AI
// ============================================================
function enemyTurn() {
  if (G.gameOver) return;
  const list = [...G.enemies];
  let i = 0;
  function step() {
    if (G.gameOver) return;
    if (i >= list.length) { startPlayerTurn(); return; }
    const e = list[i++];
    if (!G.enemies.includes(e)) { step(); return; }
    enemyAct(e);
    setTimeout(step, 400);
  }
  step();
}

function enemyAct(u) {
  // 葵花点穴手等：多回合定身
  if (u.stunTurns > 0) {
    u.stunTurns--;
    floatText(u.x, u.y, '定身', 'float-miss');
    log(`${u.name} 被定身，无法行动（剩余 ${u.stunTurns} 回合）`, 'system');
    render();
    return;
  }
  if (u.stun) { u.stun = false; log(`${u.name} 被定身`, 'system'); return; }
  if (u.blind) { u.blind = false; log(`${u.name} 被致盲`, 'system'); return; }

  const bossOnField = G.enemies.some(e => e.isBoss && e.hp > 0);

  // 魔法师：全屏（走 dealDamage，受闪避 / 待发卡牌影响）
  if (u.mage) {
    log(`${u.name} 释放全屏法术！`, 'enemy');
    [...G.allies].forEach(a => {
      if (G.gameOver) return;
      if (a.hp <= 0) return;
      dealDamage(G, u, a);
    });
    render();
    if (G.gameOver) return;
    checkWin();
    return;
  }

  // BOSS：站桩（移动 0），打射程内
  if (u.isBoss) {
    const t = enemyTargetInRange(u);
    if (t) strike(u, t);
    else render();
    return;
  }

  // 坦克：有 BOSS 时站桩护主（射程内就打）；没 BOSS 时冲上去打
  if (u.guard && bossOnField) {
    const t = enemyTargetInRange(u);
    if (t) strike(u, t);
    else render();
    return;
  }

  // 其他（含无 BOSS 时的坦克）：推进后攻击
  advanceAndStrike(u);
}

// 射程内的攻击目标：优先主角（英雄），其次血量最低
function enemyTargetInRange(u) {
  const list = G.allies.filter(a => a.hp > 0 && canReach(u, u.x, u.y, a.x, a.y));
  if (!list.length) return null;
  const hero = list.find(a => a.isHero);
  if (hero) return hero;
  list.sort((a, b) => a.hp - b.hp);
  return list[0];
}

// 推进目标：最近的我方单位（等距时优先主角）
function nearestAlly(u) {
  const list = G.allies.filter(a => a.hp > 0);
  if (!list.length) return null;
  list.sort((a, b) => {
    const da = moveDist(u.x, u.y, a.x, a.y);
    const db = moveDist(u.x, u.y, b.x, b.y);
    if (da !== db) return da - db;
    return (b.isHero ? 1 : 0) - (a.isHero ? 1 : 0);
  });
  return list[0];
}

// 走满移动点靠近最近的我方单位；移动前、每一步之后、移动结束都会判定"能否攻击"
// 移动按地形消耗结算：平地 1 点、森林 2 点，河流 / 高山不可进入
function advanceAndStrike(u) {
  let budget = Math.max(1, u.move || 1);

  while (budget > 0) {
    if (G.gameOver) return;

    // 1) 当前位置能打到就打（旁边有人就攻击）
    const hit = enemyTargetInRange(u);
    if (hit) return strike(u, hit);

    // 2) 朝最近的我方单位走一步
    const tgt = nearestAlly(u);
    if (!tgt) { render(); return; }

    const cands = [[0, -1], [0, 1], [-1, 0], [1, 0]]
      .map(([dx, dy]) => ({ x: u.x + dx, y: u.y + dy }))
      .filter(p => inBounds(p.x, p.y) && !G.grid[p.y][p.x] && isPassable(p.x, p.y))
      .sort((a, b) => moveDist(a.x, a.y, tgt.x, tgt.y) - moveDist(b.x, b.y, tgt.x, tgt.y));

    if (!cands.length) break;
    const best = cands[0];
    if (moveDist(best.x, best.y, tgt.x, tgt.y) >= moveDist(u.x, u.y, tgt.x, tgt.y)) break;

    // 地形消耗（森林 2 点），点数不够就停在原地
    const stepCost = terrainDef(best.x, best.y).cost;
    if (stepCost > budget) break;
    budget -= stepCost;

    G.grid[u.y][u.x] = null;
    G.grid[best.y][best.x] = u;
    u.x = best.x; u.y = best.y;
  }

  // 3) 移动结束：只要旁边有人能打，立刻攻击
  const after = enemyTargetInRange(u);
  if (after) return strike(u, after);
  render();
}

// 攻击并结算
function strike(u, t) {
  dealDamage(G, u, t);
  render();
  checkWin();
}

</script>
<script>
/* ===== battle/turn.js ===== */
// ============================================================
// 回合流程
// ============================================================
function initFloor(floor) {
  G.floor = floor;
  // 换层：清掉「本层已通关」的挂起标记，否则新层永远判不出通关
  G.clearing = false;
  if (typeof metaRecordFloor === 'function') metaRecordFloor(floor);
  G.grid = Array.from({ length: CONFIG.SIZE }, () => Array(CONFIG.SIZE).fill(null));
  // 地形：每层随机生成（保证可通行格全部连通，不会把单位困死）
  G.terrain = genTerrain(floor);
  G.allies = [];
  G.enemies = [];
  G.selected = null;
  // 换层：清掉上一层的头顶对白气泡
  if (typeof clearBubbles === 'function') clearBubbles();

  // 我方 4 人小队：出生位置「全盘随机」
  //   为什么随机：射手的环、法师的地火都只在特定相对位置才有得打，
  //   固定站位会让某几个人永远够不着敌人。双方随机散布才有戏。
  //   英雄（王子）= 主角（倒下即本局结束，垃圾话也由他说）；鸟人 = 前期核心；
  //   法师 = 全队唯一有技能的。
  const order = ['birdking', 'champion', 'wizard', 'archer'];
  const allySpots = [];
  for (let y = 0; y < CONFIG.SIZE; y++)
    for (let x = 0; x < CONFIG.SIZE; x++)
      if (isPassable(x, y) && !G.grid[y][x]) allySpots.push({ x, y });
  shuffle(allySpots);

  order.forEach(type => {
    const spot = allySpots.pop();
    if (!spot) return;
    const u = makeUnit(type, spot.x, spot.y, 'player');
    if (!u) return;
    G.allies.push(u);
    G.grid[spot.y][spot.x] = u;
    if (u.isHero) G.hero = u;
  });

  // 继承上一层（或存档）的等级 / 成长 / 永久标记，然后统一结算属性
  applyAllyProgress();
  recalcHeroStats();

  // 满血开局（等级提升后 maxHp 变大，血条要跟着补满）
  G.allies.forEach(a => { a.hp = a.maxHp; });

  // 敌人（前期更少、更弱，节奏更快）
  // 我方 4 人（鸟人 / 英雄 / 法师 / 射手），其中射手和法师血薄，
  // 单层同屏上限仍收在 6，避免开局就被围死。
  const base = 1 + Math.floor(floor / 2) + Math.floor(Math.random() * 2);
  const cap = (CONFIG.BALANCE && CONFIG.BALANCE.ENEMY_MAX) || 6;
  const count = Math.min(cap, base);   // 第1层 1~2
  const isBossFloor = floor % 5 === 0;
  // 前期敌人类型池：1~2 层只出最弱的，3~4 层加入兽人，5 层起全类型
  const pool = floor <= 2 ? ['goblin', 'shooter']
             : floor <= 4 ? ['goblin', 'shooter', 'orc']
             : ENEMY_TYPES;
  // 敌人出生位：同样「全盘随机」，与己方呼应（双方交错才有直线角色发挥空间）。
  //   两块排序：优先挑「不与我方贴脸（8 邻域）」的格子，贴脸格只在位置不够时兜底，
  //   避免随机出一堆敌人把队伍围在中间、开局就被秒。
  //   必须排除不可通行地形与已被占用的格子——否则会让单位只存在于 G.enemies
  //   而不在棋盘上 → 谁都打不到 → 该层永久卡死（历史 bug）。
  const adjacentToAlly = (x, y) => G.allies.some(a =>
    a.hp > 0 && Math.abs(a.x - x) <= 1 && Math.abs(a.y - y) <= 1);
  const farSpots = [], nearSpots = [];
  for (let y = 0; y < CONFIG.SIZE; y++)
    for (let x = 0; x < CONFIG.SIZE; x++) {
      if (!isPassable(x, y) || G.grid[y][x]) continue;
      (adjacentToAlly(x, y) ? nearSpots : farSpots).push({ x, y });
    }
  shuffle(farSpots);
  shuffle(nearSpots);
  const positions = farSpots.concat(nearSpots);

  let total = count + (isBossFloor ? 1 : 0);
  let idx = 0;
  let spawned = 0;
  if (isBossFloor && positions[idx]) {
    const p = positions[idx++];
    const boss = makeUnit('boss', p.x, p.y, 'enemy');
    G.enemies.push(boss);
    G.grid[p.y][p.x] = boss;
    spawned++;
  }
  // 注意：occupied 的格子要跳过但不占用名额，否则第1层可能刷出 0 个敌人
  while (spawned < total && idx < positions.length) {
    const p = positions[idx++];
    if (G.grid[p.y][p.x]) continue;
    const t = pick(pool);
    const e = makeUnit(t, p.x, p.y, 'enemy');
    G.enemies.push(e);
    G.grid[p.y][p.x] = e;
    spawned++;
  }

  const eLv = 1 + Math.floor(Math.max(0, floor - 1) / 2);
  const tsum = terrainSummary();
  log(`—— 第 ${floor} 层 —— 敌人等级 Lv${eLv}`, 'system');
  log(`🗺️ 地形：🌲森林 ${tsum.forest} · 🌊河流 ${tsum.river} · ⛰️高山 ${tsum.mountain} · 平地 ${tsum.plain}`, 'terrain', true);
  if (floor === 1) {
    log('🎯 战棋操作：点己方单位 → 点蓝格移动 → 点红格敌人攻击（一次只打一个）', 'system', true);
    log('✳ 行动栏：攻击 / 待命（再点一次自己也行）；只有法师多一个技能', 'system', true);
    log(`   队形：${G.allies.map(a => a.icon + a.name + '·' + atkLabel(a)
      + (skillOf(a) ? '·' + skillLabelOf(a) : '·无技能')).join('  ')}`, 'system', true);
    log(`   🤴 英雄是主角（倒了本局结束）；🦅 鸟人飞行无视地形；射手贴脸打不到`, 'system', true);
  }
  if (isBossFloor) {
    log(`☠️ BOSS 出现了！（Lv${eLv}）`, 'system');
    // 遇到 BOSS：等开场弹字飘完，再让魔王与主角在日志里对喷
    const sayFloor = floor;
    const boss = G.enemies.find(e => e && e.isBoss);
    setTimeout(() => {
      if (!G || G.floor !== sayFloor || G.gameOver) return;
      if (typeof tauntSay === 'function') {
        if (boss && boss.hp > 0) tauntSay(boss, pick(BOSS_TAUNTS.start));
        if (G.hero && G.hero.hp > 0) tauntSay(G.hero, pick(HERO_TAUNTS.start));
      } else {
        if (boss) log(pick(BOSS_TAUNTS.start), 'taunt-boss');
        if (G.hero) log(pick(HERO_TAUNTS.start), 'taunt-hero');
      }
    }, 1150);
  }

  // 进入新一层：弹字提示（不挡操作，2.4 秒慢慢飘走）
  if (typeof showTurnBanner === 'function') {
    showTurnBanner('第 ' + floor + ' 层', isBossFloor ? 'BOSS 出现 · 开始行动' : '战斗开始', isBossFloor ? 'enemy' : 'neutral');
  }
}

// ============================================================
// 全员行动完毕 → 自动结束回合
// ============================================================
function checkAllActed() {
  if (G.phase !== 'player' || G.gameOver) return;
  if (G.clearing) return;                               // 已判定通关，别再自动进敌人回合
  if (!G.enemies.length) return;                        // 已清场，交给通关结算
  if (G.allies.some(a => a.hp > 0 && !a.hasActed)) return;
  if (G.autoEndPending) return;

  G.autoEndPending = true;
  const token = G.turn;
  setTimeout(() => {
    G.autoEndPending = false;
    // 期间可能已进入敌人回合 / 已换层，做一次校验再结束
    if (G.phase === 'player' && !G.gameOver && G.turn === token &&
        G.enemies.length && !G.allies.some(a => a.hp > 0 && !a.hasActed)) {
      log('全员行动完毕，自动结束回合', 'system');
      endPlayerTurn();
    }
  }, 300);
}

function endPlayerTurn() {
  if (G.phase !== 'player' || G.gameOver) return;

  G.selected = null;
  G.mode = null;

  G.phase = 'enemy';
  render();
  if (typeof SFX !== 'undefined') SFX.turn();
  if (typeof showTurnBanner === 'function') showTurnBanner('行动结束', '敌人回合', 'enemy');
  log(`—— 敌人回合（${G.enemies.length} 个敌人行动）——`, 'system');
  setTimeout(enemyTurn, 400);
}

function afterEnemyTurn() {
  if (G.gameOver) return;

  // 回合成长（累积到 bonus，由 recalcHeroStats 结算）
  G.allies.forEach(a => {
    if (a.turnGrowth) a.bonusAtk += a.turnGrowth;
    if (a.turnHpGrowth) { a.bonusHp += a.turnHpGrowth; a.hp += a.turnHpGrowth; }
    a.hasMoved = false;
    a.hasActed = false;
  });

  // 卡牌词条：每回合回血
  G.allies.forEach(a => {
    const regen = (a.affix && a.affix.regen) || 0;
    if (regen > 0 && a.hp > 0 && a.hp < a.maxHp) {
      const h = Math.floor(a.maxHp * regen);
      if (h > 0) {
        a.hp = Math.min(a.maxHp, a.hp + h);
        battleFx(a.x, a.y, a.x, a.y, 'heal', 'player');
        floatText(a.x, a.y, '+' + h, 'float-heal');
        log(`🩹 ${a.name} 卡牌回血 +${h}（${a.hp}/${a.maxHp}）`, 'heal');
      }
    }
  });

  // 流血（词条附加，对敌人生效，每回合开始结算，持续 2 回合）
  [...G.enemies].forEach(e => {
    if (!e || e.hp <= 0 || !(e.bleedTurns > 0) || !(e.bleedDmg > 0)) return;
    e.hp -= e.bleedDmg;
    floatText(e.x, e.y, '-' + e.bleedDmg, 'float-dmg');
    log(`🩸 ${e.name} 流血 -${e.bleedDmg}（剩余 ${e.bleedTurns - 1} 回合）`, 'player');
    e.bleedTurns--;
    if (e.bleedTurns <= 0) e.bleedDmg = 0;
    if (e.hp <= 0) killUnit(G, e, G.hero);
  });

  // 治疗buff（奶妈已移除）：每回合开始，全队按最大生命比例回血
  const healPct = CONFIG.HEAL_REGEN + (G.healBonus || 0);
  let healSum = 0, healN = 0;
  G.allies.forEach(a => {
    if (a.hp <= 0 || a.hp >= a.maxHp) return;
    const want = Math.max(1, Math.floor(a.maxHp * healPct));
    const real = Math.min(want, a.maxHp - a.hp);
    if (real <= 0) return;
    a.hp += real;
    healSum += real;
    healN++;
    battleFx(a.x, a.y, a.x, a.y, 'heal', 'player');
    floatText(a.x, a.y, '+' + real, 'float-heal');
  });
  if (healN > 0) {
    if (typeof SFX !== 'undefined') SFX.heal();
    log(`💖 全队回血：${healN} 人共回复 ${healSum} 生命（每回合 ${(healPct * 100).toFixed(1)}%）`, 'heal');
  }

  // 金币：基础 + 局内加成 + 存档天赋「伐木工」
  const talentGold = (typeof metaTurnGold === 'function') ? metaTurnGold() : 0;
  const turnIncome = CONFIG.GOLD.TURN + (G.turnGold || 0) + talentGold;
  G.gold += turnIncome;
  G.turn++;

  G.phase = 'player';
  G.mode = null;
  log(`—— 第 ${G.turn} 回合 · 场上敌人 ${G.enemies.length} 个 ——`, 'system');
  if (typeof showTurnBanner === 'function') showTurnBanner('回合开始', `第 ${G.turn} 回合 · 开始行动`, 'player');
  recalcHeroStats();
  saveGame();
  render();
}

function startPlayerTurn() {
  if (G.gameOver) return;
  afterEnemyTurn();
}

function checkWin() {
  if (G.gameOver || G.clearing) return;
  const bossFloor = (G.floor % 5) === 0;
  const bossAlive = G.enemies.some(e => e && e.isBoss && e.hp > 0);

  // 普通层：必须清干净场上敌人
  // BOSS 层：**魔王一倒就算通关**，剩下的小怪不用再打
  const cleared = G.enemies.length === 0 || (bossFloor && !bossAlive);
  if (!cleared) return;

  G.clearing = true;
  if (bossFloor && G.enemies.length > 0) {
    log(`☠️ 魔王已倒下 · 剩余 ${G.enemies.length} 个敌人不用再打，直接通关`, 'system');
    if (typeof DM !== 'undefined') DM.result('☠️ 魔王倒下 · 本层通关！', true);
  }
  setTimeout(() => showFloorClearModal(), 400);
}
</script>

<script>
/* ===== ui/fx.js ===== */
// ============================================================
// 屏幕演出层：回合弹字
//   · 弹字：回合开始 / 行动结束 · 敌人回合 —— 不挡操作，慢慢飘走
//   · 垃圾话（BOSS / 主角）：只写日志，**不再冒头顶气泡**
//     （2026-10-24 第五次调整：气泡会挡住棋盘上的单位，全部收掉）
// ============================================================

// ------------------------------------------------------------
// 回合弹字
//   kind: player（金） / enemy（红） / neutral（青）
// ------------------------------------------------------------
function showTurnBanner(main, sub, kind) {
  if (!main) return;
  // 同一时刻只保留一条弹字：敌人回合很快时，新弹字直接顶掉旧的，避免文字叠在一起
  const olds = document.querySelectorAll('.turn-banner');
  for (let i = 0; i < olds.length; i++) {
    if (olds[i].remove) olds[i].remove();
  }
  const el = document.createElement('div');
  el.className = 'turn-banner' + (kind ? ' tb-' + kind : '');
  el.innerHTML = '<b>' + main + '</b>' + (sub ? '<i>' + sub + '</i>' : '');
  document.body.appendChild(el);
  placeBanner(el);
  // 换层弹字常常在 render() 之前就创建了（顶栏还没填内容，棋盘位置偏高），
  // 等下一帧布局定下来再量一次，避免弹字落在棋盘里
  setTimeout(function () { if (el.parentNode) placeBanner(el); }, 80);
  // 动画 2.4s（放慢，保证能看清），结束后移除
  setTimeout(function () { if (el.remove) el.remove(); }, 2450);
}

// 弹字落在棋盘下沿之外（卡牌区那一带），既不压格子也不挡顶栏按钮
function placeBanner(el) {
  const board = document.getElementById('board');
  if (!board || typeof board.getBoundingClientRect !== 'function') return;
  const br = board.getBoundingClientRect();
  if (!br.width) return;
  const vh = window.innerHeight || document.documentElement.clientHeight || 800;
  const h = el.offsetHeight || 52;
  // 元素用 translate(-50%,-50%)，所以 top 给的是「中心线」
  let center = br.bottom + 10 + h / 2;
  if (center + h / 2 > vh - 6) center = Math.max(h / 2 + 6, br.top - 10 - h / 2);
  el.style.top = center + 'px';
}

// ------------------------------------------------------------
// 垃圾话
//   以前会在单位头顶冒一个气泡（.taunt-bubble），盖住相邻格子、
//   混战时根本看不清，已整体取消。现在只说一句话：写进日志
//   （taunt-* 类型不进弹幕白名单，所以只在「日志」弹窗里能翻到）。
// ------------------------------------------------------------
function clearBubbles() {
  // 兼容旧调用：气泡已删除，这里只负责把可能残留的节点清掉
  const wrap = document.getElementById('board-wrap');
  if (!wrap || !wrap.querySelectorAll) return;
  const list = wrap.querySelectorAll('.taunt-bubble');
  for (let i = 0; i < list.length; i++) {
    if (list[i].remove) list[i].remove();
  }
}

function say(unit, text) {
  if (!unit || !text) return;
  // 只落日志：日志栏 / 日志弹窗里仍能看到谁在说什么
  log(text, unit.team === 'enemy' ? 'taunt-boss' : 'taunt-hero');
}

// 兼容命名：与 tauntSay 是同义词
function tauntSay(unit, text) { say(unit, text); }

</script>
<script>
/* ===== ui/topbar.js ===== */
// ============================================================
// 顶栏
//   全部用文字表达，不用图标 —— 图标看不懂，玩家得靠猜。
//   左侧：第几次挑战 → 第几层 → 第几回合 → 金币（含每回合收入）
//   右侧：结束回合 / 队伍 / 卡牌 / 日志 / 说明 / 存档
//   （音效开关与重新挑战收进「存档」弹窗，主界面只留高频操作）
//   「队伍」= 角色属性表：单位详情不再靠长按悬浮，想查就点开看
// ============================================================
function cardTotal() {
  const armed = (G && G.armed) || [];
  const buffs = (G && G.buffs) || [];
  return armed.reduce((s, a) => s + (a.stacks || 1), 0)
       + buffs.reduce((s, b) => s + (b.stacks || 1), 0);
}

function renderTopbar() {
  const el = document.getElementById('topbar');
  if (!el) return;
  const talentGold = (typeof metaTurnGold === 'function') ? metaTurnGold() : 0;
  const income = CONFIG.GOLD.TURN + (G.turnGold || 0) + talentGold;
  const nCard = cardTotal();

  el.innerHTML = `
    <span class="tb-info">
      <span class="tb-i">第 <b>${G.challenge || 1}</b> 次挑战</span>
      <span class="tb-i">第 <b>${G.floor}</b> 层</span>
      <span class="tb-i">第 <b>${G.turn}</b> 回合</span>
      <span class="tb-i">金币 <b>${G.gold}</b><i class="tb-inc">每回合 +${income}</i></span>
    </span>
    <span class="tb-btns">
      <button id="end-turn-btn" class="${G.phase === 'player' ? 'is-player' : 'is-enemy'}" ${G.phase !== 'player' || G.gameOver ? 'disabled' : ''}>${G.phase === 'player' ? '结束回合' : '敌人行动中'}</button>
      <button id="team-btn" class="tb-dark" title="队伍属性表">队伍</button>
      <button id="cards-btn" class="tb-dark" title="查看手上的全部卡牌">卡牌 ${nCard}</button>
      <button id="log-btn" class="tb-dark" title="查看完整的战斗日志">日志</button>
      <button id="help-btn" class="tb-dark" title="地形 / 操作说明">说明</button>
      <button id="meta-btn" class="tb-meta" title="通关次数 / 开局军费 / 天赋">存档</button>
    </span>
  `;

  document.getElementById('end-turn-btn').onclick = endPlayerTurn;

  const teamBtn = document.getElementById('team-btn');
  if (teamBtn) teamBtn.onclick = () => {
    if (typeof showTeamModal === 'function') showTeamModal();
  };

  const cardsBtn = document.getElementById('cards-btn');
  if (cardsBtn) cardsBtn.onclick = () => {
    if (typeof showCardList === 'function') showCardList();
  };

  const logBtn = document.getElementById('log-btn');
  if (logBtn) logBtn.onclick = () => {
    if (typeof showLogList === 'function') showLogList();
  };

  const helpBtn = document.getElementById('help-btn');
  if (helpBtn) helpBtn.onclick = () => {
    if (typeof showHelpModal === 'function') showHelpModal();
  };

  const metaBtn = document.getElementById('meta-btn');
  if (metaBtn) metaBtn.onclick = () => {
    if (typeof showMetaPanel === 'function') showMetaPanel();
  };
}

// ============================================================
// 行动栏：唯一常驻的「操作 + 最新动态」条（2026-10-24 移到棋盘上方，
// 原来在屏幕最底部，手机上大拇指够不到）
//   未选中单位 → 显示最新一条日志（不用点也能看见刚发生了什么）
//   选中单位   → 显示这回合能做的三件事
//   点左边的角色名可以取消选中；再点一次自己脚下格子 = 待命
// ============================================================
function renderActionBar() {
  const el = document.getElementById('action-bar');
  if (!el) return;

  const u = (G.selected && G.grid[G.selected.y]) ? G.grid[G.selected.y][G.selected.x] : null;

  if (!u || u.team !== 'player' || G.phase !== 'player' || G.gameOver) {
    el.innerHTML = '<span class="hint ab-latest" id="ab-msg"></span>';
    renderLatestLog();
    return;
  }

  const ready = !u.hasActed && u.hp > 0;
  const nAtk = ready ? atkTargets(u, u.x, u.y).length : 0;
  const s = skillOf(u);
  const sName = skillLabelOf(u);
  const nSkill = (ready && s) ? skillHitCount(u) : 0;

  // 提示文案一律短句：行动栏是单行固定宽，窄屏上长句只会被裁成半截（手机上直接隐藏，
  // 详细玩法在「说明」弹窗里有一份）
  let tip;
  if (!ready) tip = '本回合已行动';
  else if (G.mode === 'skill') tip = `<b>点紫色敌人</b>：${sName} 可打 ${nSkill} 人`;
  else if (G.mode === 'attack') tip = '<b>点红色敌人</b>攻击';
  else if (!nAtk && !nSkill) tip = '射程内没敌人 · 先走一步';
  else if (u.hasMoved) tip = '已移动 · 攻击 / 技能';
  else tip = '点蓝格移动 · 再出手';

  const forest = isForest(u.x, u.y) ? '<span class="hint-forest">森林中：命中 -20%</span>' : '';

  // 技能按钮只给有技能的人（现在只有法师）—— 白板单位不该有个永远灰着的按钮
  const skillBtn = !s ? '' :
    `<button class="act skill${G.mode === 'skill' ? ' on' : ''}" id="act-skill"` +
      `${ready && (nSkill > 0 || G.mode === 'skill') ? '' : ' disabled'}>` +
      `${G.mode === 'skill' ? '取消' : '技能'}</button>`;

  el.innerHTML =
    `<button class="who" id="act-deselect" title="取消选中">${u.icon} ${u.name} Lv${u.level || 1} ✕</button>` +
    `<span class="shape-tag">${atkLabel(u)}</span>` +
    `<span class="hint" id="ab-msg">${tip}</span>` +
    forest +
    `<span class="act-group">` +
      `<button class="act atk${G.mode === 'attack' ? ' on' : ''}" id="act-atk"` +
        `${ready && nAtk > 0 ? '' : ' disabled'}>攻击</button>` +
      skillBtn +
      `<button class="act" id="act-wait" ${ready ? '' : ' disabled'}>待命</button>` +
    `</span>`;

  const de = document.getElementById('act-deselect');
  if (de) de.onclick = () => {
    G.selected = null;
    G.mode = null;
    render();
  };

  const atk = document.getElementById('act-atk');
  if (atk) atk.onclick = () => {
    G.mode = (G.mode === 'attack') ? null : 'attack';
    render();
  };

  const sk = document.getElementById('act-skill');
  if (sk) sk.onclick = () => {
    if (G.mode === 'skill') { G.mode = null; render(); return; }
    if (!s) return;
    G.mode = 'skill';
    render();
    log(`${s.icon} 选择【${sName}】落点：${skillDescOf(u)}`, 'system', true);
  };

  const w = document.getElementById('act-wait');
  if (w) w.onclick = () => standBy(u);
}

</script>
<script>
/* ===== ui/buffBar.js ===== */
// ============================================================
// 卡牌组清单（顶栏「卡牌 N」按钮打开）
//
//   主界面上不再有卡牌条 —— 卡片墙既占地方又看不清效果，
//   一条窄条也只是第二次重复。现在只在顶栏显示张数，
//   点开是一份纯文字清单：卡名（带稀有度色点）+ 完整说明。
// ============================================================

// 从卡池反查完整说明与稀有度（G.buffs 里只存了短说明）
function cardPoolMeta(name) {
  if (typeof CARD_POOL === 'undefined') return null;
  return CARD_POOL.find(c => c.name === name) || null;
}

function cardRarity(name) {
  const c = cardPoolMeta(name);
  const r = (c && c.rarity) || 'common';
  return { key: r, name: (CONFIG.RARITY[r] || CONFIG.RARITY.common).name,
           color: (CONFIG.RARITY[r] || CONFIG.RARITY.common).color };
}

// 一行：左边卡名（带稀有度色点），右边完整说明
function cardRowHtml(o) {
  const r = cardRarity(o.name);
  // 待发卡的说明原文都以「待发：」开头，清单里已经有分组标题，去掉更干净
  const desc = (o.desc || '').replace(/^待发[:：]\s*/, '');
  const stk = (o.stacks || 1) > 1 ? `<span class="cl-stk">叠加 ${o.stacks} 层</span>` : '';
  const when = o.when ? `<span class="cl-when">${o.when}</span>` : '';
  return `<div class="cl-row">` +
      `<span class="cl-name" style="color:${r.color}"><i class="cl-dot" style="background:${r.color}"></i>${o.name}</span>` +
      `<span class="cl-desc">${desc}${stk}${when}</span>` +
    `</div>`;
}

function showCardList() {
  const armed = (G && G.armed) || [];
  const buffs = (G && G.buffs) || [];
  const nArmed = armed.reduce((s, a) => s + (a.stacks || 1), 0);
  const nPerm  = buffs.reduce((s, b) => s + (b.stacks || 1), 0);

  let body = '';

  if (nArmed) {
    body += '<div class="cl-sec"><div class="cl-sec-h">待发卡牌 · 用掉就消失</div>';
    armed.forEach(a => {
      const c = cardPoolMeta(a.name);
      const when = a.trigger === 'attack'
        ? (a.heroOnly ? '只认英雄出手' : '你下次攻击时触发')
        : '你下次受伤时触发';
      body += cardRowHtml({ name: a.name, desc: (c && c.desc) || a.desc, stacks: a.stacks, when });
    });
    body += '</div>';
  }

  if (nPerm) {
    body += '<div class="cl-sec"><div class="cl-sec-h">常驻卡牌 · 全程生效</div>';
    buffs.forEach(b => {
      const c = cardPoolMeta(b.name);
      body += cardRowHtml({ name: b.name, desc: (c && c.desc) || b.desc, stacks: b.stacks });
    });
    body += '</div>';
  }

  if (!body) {
    body = '<div class="cl-empty">还没有任何卡牌。<br>每通过一层可以三选一拿一张卡（2 张普通 + 1 张好卡），' +
           '通关那张弹窗里还能用金币重掷、多拿一张、给全队升 1 级。</div>';
  }

  // 稀有度图例：和卡名前面的色点同一套颜色
  const legend = ['common', 'rare', 'legend', 'myth'].map(k => {
    const rr = CONFIG.RARITY[k];
    return `<i class="cl-dot" style="background:${rr.color}"></i>` +
           `<span style="color:${rr.color}">${rr.name}</span>`;
  }).join(' · ');

  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.innerHTML = `
    <div class="modal card-modal">
      <h2>卡牌组</h2>
      <div class="cl-sub">共 ${nArmed + nPerm} 张 · 待发 ${nArmed} 张 · 常驻 ${nPerm} 张</div>
      <div class="cl-body">${body}</div>
      <div class="cl-legend">稀有度：${legend}</div>
      <button class="btn" id="card-list-close">关闭</button>
    </div>
  `;
  modal.querySelector('#card-list-close').onclick = () => modal.remove();
  modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
  document.body.appendChild(modal);
}

</script>
<script>
/* ===== ui/team.js ===== */
// ============================================================
// 队伍面板（顶栏「队伍」按钮）
//
//   为什么要有这个东西：手机上「长按 / 悬浮看详情」根本点不准，
//   详情框还会一直挡着棋盘。所以做成一张固定的表格：
//   谁的属性、能打哪几格、技能是什么档位，点开一次全看得见。
//   纯文字 + emoji，不用图片。
// ============================================================

// 一个单位当前的状态标签
function teamStateTag(u) {
  if (!u || u.hp <= 0) return '<i class="tt-dead">阵亡</i>';
  if (u.hasActed) return '<i class="tt-done">本回合已行动</i>';
  if (u.hasMoved) return '<i class="tt-ready">还能出手</i>';
  return '<i class="tt-ready">未行动</i>';
}

// 卡牌 / 奇遇留下的额外属性，只有非零才显示
//   （护甲 / 魔抗不在这里 —— 它们每个单位都有基础值，单独占一行）
function teamExtraBits(u) {
  const bits = [];
  const a = u.affix || {};
  if (a.bonus) bits.push('附加伤害 ' + Math.round(a.bonus * 100) + '%');
  if (a.lifesteal) bits.push('吸血 ' + Math.round(a.lifesteal * 100) + '%');
  if (a.bleed) bits.push('流血');
  if (u.atkBuff) bits.push('攻击加成 ' + Math.round(u.atkBuff * 100) + '%');
  if (u.fly) bits.push('飞行·无视地形');
  return bits;
}

function showTeamModal() {
  if (!G || !G.allies) return;

  const rows = G.allies.map(u => {
    const dead = u.hp <= 0;
    const lv = u.level || 1;
    const s = skillOf(u);
    const sName = skillLabelOf(u);
    const extra = teamExtraBits(u);
    const expMax = CONFIG.EXP.LEVEL_UP(lv);

    const head =
      `<tr class="tt-u${dead ? ' tt-off' : ''}">` +
        `<td class="tt-name">${u.isHero ? '<b class="tt-hero">主角</b>' : ''}${u.icon} ${u.name}<em>Lv${lv}</em></td>` +
        `<td>${u.hp}/${u.maxHp}</td>` +
        `<td>${u.atk}${u.spell ? `<span class="tt-spell">法${u.spell}</span>` : ''}</td>` +
        `<td>${Math.round(u.crit * 100)}%</td>` +
        `<td>${Math.round(u.dodge * 100)}%</td>` +
        `<td>${u.move}</td>` +
      `</tr>`;

    // 普攻 / 技能 / 护甲 / 魔抗 / 经验 / 加成 / 状态
    //   护甲（固定减物理）与魔抗（百分比减法术）必须写出来：
    //   坦克砍不动的时候，玩家得知道该换法师的地火
    const skillLine = s
      ? `<span class="tt-k">技能</span>${sName}：${skillDescOf(u)}`
      : '<span class="tt-k">技能</span>无（只有普攻）';

    const detail =
      `<tr class="tt-d${dead ? ' tt-off' : ''}"><td colspan="6">` +
        `<div><span class="tt-k">普攻</span>${atkLabel(u)}` +
          `　<span class="tt-k">护甲</span>${u.armor || 0}` +
          `　<span class="tt-k">魔抗</span>${Math.round((u.magicRes || 0) * 100)}%</div>` +
        `<div>${skillLine}${s ? `　<span class="tt-k">射程</span>${skillRangeLabel(u)}` : ''}</div>` +
        `<div><span class="tt-k">经验</span>${u.exp || 0}/${expMax}` +
          (extra.length ? `　<span class="tt-k">加成</span>${extra.join(' · ')}` : '') +
          `　${teamStateTag(u)}</div>` +
      `</td></tr>`;

    return head + detail;
  }).join('');

  const healPct = (typeof healPctOf === 'function') ? healPctOf() * 100 : CONFIG.HEAL_REGEN * 100;
  const alive = G.allies.filter(a => a.hp > 0).length;

  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.innerHTML = `
    <div class="modal team-modal">
      <h2>队伍</h2>
      <div class="tt-sub">第 ${G.floor} 层 · 第 ${G.turn} 回合 · 存活 ${alive}/${G.allies.length}</div>
      <div class="tt-wrap">
        <table class="tt">
          <thead>
            <tr><th>角色</th><th>生命</th><th>攻击</th><th>暴击</th><th>闪避</th><th>移动</th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="tt-tip">每回合开始时全队自动回复 ${healPct.toFixed(1)}% 最大生命 · 站在森林里命中 -20%</div>
      <button class="btn" id="team-close">关闭</button>
    </div>`;
  modal.querySelector('#team-close').onclick = () => modal.remove();
  modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
  document.body.appendChild(modal);
}

</script>
<script>
/* ===== ui/logPanel.js ===== */
// ============================================================
// 文字信息（主界面精简后从侧栏搬进弹窗）
//
//   主界面只剩「顶栏 + 棋盘 + 行动栏」，原来的右侧日志栏拆成三处：
//     · 行动栏空位 —— 最新一条日志，不点也能看见刚刚发生了什么
//     · 顶栏「日志」 —— 全量落档清单（想复盘才翻）
//     · 顶栏「说明」 —— 地形 / 我方单位 / 怎么操作 / 重看新手引导
//   全部是纯文字，不用图标猜谜。
// ============================================================

// ---- 行动栏空位：只显示最新一条 ----
function renderLatestLog() {
  const el = document.getElementById('ab-msg');
  if (!el) return;
  // 选中单位时这一行是操作提示，不能被日志顶掉
  if (G && G.selected && G.phase === 'player' && !G.gameOver) return;
  const arr = (G && G.logLines) || [];
  const last = arr[arr.length - 1];
  if (!last) { el.textContent = ''; return; }
  el.textContent = last.t;
  el.className = 'hint ab-latest' + (last.c ? ' log-' + last.c : '');
}

// ---- 日志弹窗：全量 ----
function showLogList() {
  const arr = (G && G.logLines) || [];

  const rows = arr.map(l =>
    `<div class="lg-row${l.c ? ' log-' + l.c : ''}">${l.t}</div>`
  ).join('');

  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.innerHTML = `
    <div class="modal log-modal">
      <h2>战斗日志</h2>
      <div class="lg-sub">共 ${arr.length} 条 · 最新的在最下面</div>
      <div class="lg-body" id="lg-body">${rows || '<div class="lg-empty">还没有记录。</div>'}</div>
      <button class="btn" id="log-close">关闭</button>
    </div>
  `;
  modal.querySelector('#log-close').onclick = () => modal.remove();
  modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
  document.body.appendChild(modal);

  const body = modal.querySelector('#lg-body');
  if (body) body.scrollTop = body.scrollHeight;
}

// ---- 说明弹窗：操作 / 地形 ----
//   单位属性不在这里了：顶栏「队伍」按钮是一张专门的属性表
function showHelpModal() {
  const terrain = (typeof terrainLegendHtml === 'function') ? terrainLegendHtml() : '';
  const healPct = (CONFIG.HEAL_REGEN + (G.healBonus || 0)) * 100;

  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.innerHTML = `
    <div class="modal help-modal">
      <h2>战场说明</h2>

      <div class="hp-sec">
        <div class="hp-h">怎么操作</div>
        <div class="hp-line">① 点己方单位 → 点<b>蓝格</b>移动（每回合一次，移动后还能出手）</div>
        <div class="hp-line">② 点<b>红格里的敌人</b> ＝ 攻击它（一次只打一个）</div>
        <div class="hp-line">③ <b>再点一次自己脚下的格子 ＝ 待命</b></div>
        <div class="hp-line">④ 全队动完自动换敌方 · 想提前结束就点「结束回合」</div>
      </div>

      <div class="hp-sec">
        <div class="hp-h">四名队员<span class="hp-sub">只有法师有技能</span></div>
        <div class="hp-line">🤴 <b>英雄</b> 主角 · 前后左右 1 格 · 初始最弱、成长最高 ·<b>他倒下这局就结束</b></div>
        <div class="hp-line">🦅 <b>鸟人</b> 前后左右 1 格 · 飞行无视地形 · 前期最强，但倒了不影响本局</div>
        <div class="hp-line">🏹 <b>射手</b> 十字第 2~N 格 + 斜角第 1~N-1 格 · 贴脸打不到 · 血最薄</div>
        <div class="hp-line">🧙 <b>法师</b> 普攻 1 格但只有 1 点 · 技能【地火】射程同上，法术伤害</div>
        <div class="hp-heal">每回合开始时，全队自动回复 <b>${healPct.toFixed(1)}%</b> 最大生命</div>
      </div>

      <div class="hp-sec">
        <div class="hp-h">护甲 / 魔抗<span class="hp-sub">打不动的时候先看这个</span></div>
        <div class="hp-line">🛡️ <b>护甲</b>：挨<b>普攻</b>按固定值减伤 —— 坦克护甲 8，鸟人一刀只砍掉 3 点</div>

// ============================================================

//   · 每 7 层触发一次（通关第 7、14、21、28…层之后，进下一层之前）
//   · 每个奇遇都是一道选择题，结果随选择而定
//   · **不是白送好处**：每个奇遇都带代价 / 风险，赌一把还是稳妥绕开由你决定
//   · 已触发过的奇遇不会重复出现，池子抽干后重新洗牌

// ---------------- 效果工具 ----------------
function encGold(n) { G.gold = Math.max(0, G.gold + n); }
function encHeroAtk(n) { if (G.hero) G.hero.bonusAtk += n; recalcHeroStats(); }
function encAllAtk(n) { G.allies.forEach(a => { a.bonusAtk += n; }); recalcHeroStats(); }
function encAllHp(n) { G.allies.forEach(a => { a.bonusHp += n; a.hp = Math.max(1, a.hp + n); }); recalcHeroStats(); }
function encAllCrit(n) { G.allies.forEach(a => { a.bonusCrit += n; }); recalcHeroStats(); }
function encAllDodge(n) { G.allies.forEach(a => { a.bonusDodge += n; }); recalcHeroStats(); }
function encAllyAtk(type, n) {
  G.allies.filter(a => a.type === type).forEach(a => { a.bonusAtk += n; });
  recalcHeroStats();
}
function encFullHeal() { G.allies.forEach(a => { a.hp = a.maxHp; }); }
function encExp(n) { G.allies.forEach(a => { if (a.hp > 0) gainExp(a, n, '奇遇'); }); }

// ---- 负面 / 代价类工具（奇遇的另一面）----
// 当前生命扣比例（不会致死，最低留 1 点）
function encHurtPct(p) {
  G.allies.forEach(a => { if (a.hp > 0) a.hp = Math.max(1, Math.round(a.hp * (1 - p))); });
}
// 最大生命永久下降比例（基础值，跨层保留）
function encMaxHpPct(p) {
  G.allies.forEach(a => {
    const cut = Math.round((a.maxHp || 0) * p);
    a.bonusHp -= cut;
    a.hp = Math.max(1, a.hp - cut);
  });
  recalcHeroStats();
}
