<script>
/* ===== core/save.js ===== */
// ============================================================
// 存档系统（v6：四人大队 + 护甲魔抗 + 商店删除）
// ============================================================
const SAVE_KEY = 'zhanqi_rogue_save_v6';

function saveGame() {
  if (!G) return;
  try {
    const data = {
      version: 6,
      floor: G.floor,
      turn: G.turn,
      challenge: G.challenge,
      gold: G.gold,
      levelBuys: G.levelBuys || 0,
      buffs: G.buffs,
      armed: (G.armed || []).map(a => ({ id: a.id, stacks: a.stacks || 1 })),
      goldBonus: G.goldBonus,
      turnGold: G.turnGold,
      luck: G.luck,
      healBonus: G.healBonus,
      encounterHistory: G.encounterHistory || [],
      encounterCount: G.encounterCount || 0,
      allyProgress: snapshotAllies(),
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  } catch (e) {
    console.warn('存档失败', e);
  }
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (data.version !== 6) return false;

    newGame();
    G.floor = data.floor || 1;
    G.turn = data.turn || 1;
    G.challenge = data.challenge || 1;
    G.gold = data.gold || 0;
    G.levelBuys = data.levelBuys || 0;   // 老存档没有这个字段，按 0 算（下一次升级仍是最低价）
    G.buffs = data.buffs || [];
    G.armed = (data.armed || []).map(a => {
      const c = CARD_POOL.find(x => x.id === a.id);
      if (!c) return null;
      return { id: c.id, name: c.name, desc: c.desc, trigger: c.trigger, stacks: a.stacks || 1 };
    }).filter(Boolean);
    G.goldBonus = data.goldBonus || 0;
    G.turnGold = data.turnGold || 0;
    G.luck = data.luck || 0;
    G.healBonus = data.healBonus || 0;
    G.encounterHistory = data.encounterHistory || [];
    G.encounterCount = data.encounterCount || 0;
    G.allyProgress = data.allyProgress || null;

    initFloor(G.floor);   // initFloor 内部会 applyAllyProgress 恢复整队成长

    // 旧存档迁移：接化发已改为「待发」卡，不再提供永久反弹
    if (G.hero && G.hero.reflect > 0) {
      G.hero.reflect = 0;
      log('旧存档的「接化发」已按新规则改为待发卡，本次未保留', 'system');
    }

    render();
    log('读取存档成功', 'system');
    return true;
  } catch (e) {
    console.warn('读档失败', e);
    return false;
  }
}

function clearSave() {
  try {
    localStorage.removeItem(SAVE_KEY);
  } catch (e) {}
}

</script>
<script>
/* ===== core/stats.js ===== */
// ============================================================
// 属性结算（全队唯一入口）
//
//   2026-10-24 起装备系统已删除，所以属性只有三个来源：
//     ① 单位模板 base
//     ② 等级成长 lv * growth（含每级暴击成长）
//     ③ 局内永久加成 bonusAtk / bonusHp / bonusCrit / bonusDodge
//        （来自卡牌、奇遇、击杀成长、回合成长）
//   外加战斗内的临时状态：atkBuff（破釜沉舟等卡牌）、复仇、卧薪尝胆。
//
//   任何地方都不许直接改 h.atk / h.maxHp —— 下一次 recalcHeroStats
//   会把它们覆盖回去。要长期加成就写 bonus*，要临时加成就写 atkBuff。
// ============================================================
function recalcHeroStats() {
  if (!G || !G.allies) return;

  const capR = (CONFIG.SHAPE && CONFIG.SHAPE.RANGE_CAP) || 7;

  G.allies.forEach(function (h) {
    const base = UNIT_TEMPLATES[h.type];
    if (!base) return;

    const lv = (h.level || 1) - 1;
    const g = base.growth || {};

    // 基础 + 等级成长 + 永久加成
    let maxHp = base.hp + lv * (g.hp || 0) + (h.bonusHp || 0);
    let atk = base.atk + lv * (g.atk || 0) + (h.bonusAtk || 0);

    // 敢杀我的马：每阵亡 1 友军攻击 +50%（上限 +300%）
    if (h.revenge && h.revengeCount > 0) {
      atk = Math.floor(atk * (1 + 0.5 * Math.min(6, h.revengeCount)));
    }

    h.maxHp = Math.max(1, Math.floor(maxHp));
    if (h.hp > h.maxHp) h.hp = h.maxHp;

    // 攻击加成（奥利给 / 破釜沉舟）在这里一次乘进去，
    // 保证队伍表上的 ATK 就是真实出手攻击力
    h.atk = Math.max(1, Math.floor(atk * (1 + (h.atkBuff || 0))));

    // 法术强度：跟普攻完全分开的一条线（法师普攻只有 1，地火靠这条）
    //   来源 = 模板 spellAtk + 等级成长 spell + 永久加成 bonusAtk / bonusSpell
    const spellBase = base.spellAtk
      ? (base.spellAtk + lv * (g.spell || 0) + (h.bonusAtk || 0) + (h.bonusSpell || 0))
      : 0;
    h.spell = spellBase > 0
      ? Math.max(1, Math.floor(spellBase * (1 + (h.atkBuff || 0))))
      : 0;

    // 暴击：基础 + 每级成长 + 永久加成（负向奇遇可能扣，夹在 0~1）
    h.crit = Math.max(0, Math.min(1,
      (base.crit || 0.05) + lv * (g.crit || 0) + (h.bonusCrit || 0)));
    h.dodge = Math.max(0, Math.min(0.95, (base.dodge || 0.05) + (h.bonusDodge || 0)));

    // 护甲 / 魔抗：模板基础值 + 卡牌与奇遇加成
    //   护甲按固定值减物理伤害，魔抗按百分比减法术伤害（见 battle/combat.js）
    h.armor = (base.armor || 0) + (h.bonusArmor || 0);
    h.magicRes = Math.max(0, Math.min(0.9, (base.magicRes || 0) + (h.bonusMagicRes || 0)));

    // 等级成长：视野 / 移动
    h.range = Math.min(6, base.range + Math.floor(lv * (g.range || 0)));
    h.move = Math.min(6, base.move + Math.floor(lv * (g.move || 0)));

    // 普攻形状 / 距离：全部只算前后左右（射手另算，形状由 archerRingN 按等级外扩）
    h.atkMode = base.atkMode || 'cross1';
    h.atkRange = Math.max(1, Math.min(capR,
      (base.atkRange || 1) + Math.floor(lv * (base.atkRangeGrow || 0))));
  });
}

</script>

<script>
/* ===== cards/effects.js ===== */
// ============================================================
// 卡牌效果实现
// ============================================================

// 永久卡牌叠加：
//   · 同名卡只占“一条”显示位，累加 stacks（避免卡牌栏堆出一长串重复条目）
//   · 效果本身在各自的 effect 里累加（攻击 / 生命 / 成长等都是 +=），所以
//     抽到第 N 张时，实际收益也是第 N 份——显示 ×N 与真实强度一致
function addBuff(name, desc) {
  if (!G.buffs) G.buffs = [];
  const exist = G.buffs.find(b => b.name === name);
  if (exist) {
    exist.stacks = (exist.stacks || 1) + 1;
    return;
  }
  G.buffs.push({ name, desc, stacks: 1 });
}

function coinFlip(u) {
  if (Math.random() < 0.5) {
    const heal = Math.floor(u.maxHp * 0.3);
    u.hp = Math.min(u.maxHp, u.hp + heal);
    floatText(u.x, u.y, '+' + heal, 'float-heal');
    log('硬币正面！回血！', 'system');
  } else {
    const dmg = Math.floor(u.maxHp * 0.3);
    u.hp = Math.max(1, u.hp - dmg);
    floatText(u.x, u.y, '-' + dmg, 'float-dmg');
    log('硬币反面！扣血！', 'system');
  }
}

function fateGamble(g) {
  if (Math.random() < 0.9) {
    // 90%：赌输了 → 直接判负（由奖励弹窗检测 gameOver 后弹出失败界面，只能重开）
    log('我命由我不由天... 天意难违。游戏失败！', 'system');
    g.gameOver = true;
    g.fateFail = true;
  } else {
    // 10%：天选之人 → 跳到第 99 层
    log('天选之人！跳到第 99 层！', 'system');
    g.fateFail = false;
    g.jumpFloor = 99;
  }
}

// ============================================================
// 待发卡牌
// 过一关抽卡后，依赖战场瞬间的卡改为「待发」进入卡牌栏：
//   下次自己攻击（trigger:'attack'）/ 受到攻击（trigger:'hurt'）时触发，
//   触发后自动移出卡牌栏。
// ============================================================
function armCard(card) {
  if (!G.armed) G.armed = [];
  const exist = G.armed.find(a => a.id === card.id);
  if (exist) {
    exist.stacks = (exist.stacks || 1) + 1;
  } else {
    G.armed.push({
      id: card.id, name: card.name, desc: card.desc,
      trigger: card.trigger, stacks: 1, heroOnly: !!card.heroOnly,
    });
  }
  const when = card.trigger === 'attack'
    ? (card.heroOnly ? '英雄下次攻击时触发' : '下次攻击时触发')
    : '下次受到攻击时触发';
  log(`⏳ 卡牌待发：${card.name}（${when}，触发后移出卡牌栏）`, 'system');
  if (typeof renderTopbar === 'function') renderTopbar();
}

// 触发待发卡牌。ctx 可携带：{ attacker, target, dmg, cancel, reflect }
//   · 卡定义带 heroOnly:true 时，只有「英雄出手」才会触发；
//     否则该卡继续留在卡牌栏，等英雄下一次攻击（触发后才会移出）。
function fireArmed(trigger, ctx) {
  if (!G.armed || !G.armed.length) return;
  const due = G.armed.filter(a => a.trigger === trigger);
  if (!due.length) return;

  const byHero = !!(G.hero && ctx && ctx.attacker === G.hero);

  // 分成「本次触发」与「继续待发（英雄专属但出手的不是英雄）」两组
  const ready = [], held = [];
  due.forEach(a => {
    const card = CARD_POOL.find(c => c.id === a.id);
    if (card && card.heroOnly && !byHero) held.push(a);
    else ready.push(a);
  });
  if (!ready.length) return;

  // 先整体移出「将要触发」的卡牌，避免效果内部再次触发造成递归；
  // 继续待发的（held）保留在卡牌栏
  G.armed = G.armed.filter(a => ready.indexOf(a) < 0);

  ready.forEach(a => {
    const card = CARD_POOL.find(c => c.id === a.id);
    if (!card || typeof card.onTrigger !== 'function') return;
    const times = a.stacks || 1;
    log(`⏳ 【${a.name}】触发！${times > 1 ? `（叠加 ${times} 层）` : ''}`, 'system');
    for (let i = 0; i < times; i++) {
      try { card.onTrigger(G, ctx); } catch (e) { console.warn('卡牌触发出错', a.name, e); }
    }
  });

  if (typeof renderTopbar === 'function') renderTopbar();
}

</script>
<script>
/* ===== cards/ui.js ===== */
// ============================================================
// 三选一渲染（可复用于通关奖励等）
// ============================================================
function renderCardChoices(container, onPick) {
  const options = drawCards(3);
  container.innerHTML = '';
  options.forEach(card => {
    const rr = CONFIG.RARITY[card.rarity];
    const armedTag = (card.type === 'armed' ? ' <span class="card-armed">⏳ 待发</span>' : '')
      + (card.heroOnly ? ' <span class="card-hero-only">🤴 英雄触发</span>' : '');
    const el = document.createElement('div');
    el.className = 'card-option' + (card.type === 'armed' ? ' is-armed' : '');
    el.innerHTML = `
      <div class="card-name" style="color:${rr.color}">${card.name} <span style="color:${rr.color};font-size:11px;">[${rr.name}]</span>${armedTag}</div>
      <div class="card-desc">${card.desc}</div>
    `;
    el.onclick = () => onPick(card);
    container.appendChild(el);
  });
}

// ============================================================
// 抽卡：固定 2 张普通 + 1 张「好卡槽」（稀有为主，偶尔传说，神话近乎不出现）
// ============================================================
function pickRarity(rarity) {
  const pool = CARD_POOL.filter(c => c.rarity === rarity);
  return pool.length ? pick(pool) : null;
}

function drawCards(n) {
  const luck = G.luck || 0;
  const out = [];
  const push = (c) => { if (c && !out.find(o => o.id === c.id)) out.push(c); };

  if (n >= 3) {
    const up = CONFIG.DRAW.UPGRADE;
    // 「运气」卡：主要提升传说概率，神话只小幅上浮（仍近乎不出现）
    const mythC = up.myth + luck * 0.1;
    const legendC = up.legend + luck;
    const r = Math.random();
    let third = 'rare';
    if (r < mythC) third = 'myth';
    else if (r < mythC + legendC) third = 'legend';

    for (let i = 0; i < CONFIG.DRAW.COMMON; i++) push(pickRarity('common'));
    push(pickRarity(third));
  } else {
    const s = CONFIG.DRAW.SINGLE;
    const mythC = s.myth + luck * 0.1;
    const legendC = s.legend + luck;
    const r = Math.random();
    let rar = 'common';
    if (r < mythC) rar = 'myth';
    else if (r < mythC + legendC) rar = 'legend';
    else if (r < mythC + legendC + s.rare) rar = 'rare';
    push(pickRarity(rar));
  }

  // 去重后不足 n 张时用普通卡补齐
  let guard = 0;
  while (out.length < n && guard++ < 200) push(pickRarity('common'));
  return out.slice(0, n);
}

function applyCard(card) {
  log(`获得卡牌：${card.name}`, 'system');
  if (card.type === 'armed') { armCard(card); return; }
  if (typeof card.effect === 'function') card.effect(G);
  recalcHeroStats();
}

</script>

<script>
/* ===== battle/terrain.js ===== */
// ============================================================
// 地形系统：平地 / 森林 / 河流 / 高山（每层随机生成）
//   · 平地：无影响
//   · 森林：可通行，但进入消耗 2 点移动力；站在森林中命中率 -20%
//   · 河流 / 高山：不可通行，也不会在其上生成任何单位
//   · 生成时保证「所有可通行格彼此连通」——绝不会把所有单位困死
// ============================================================
const TERRAIN = {
  plain:    { key: 'plain',    name: '平地', icon: '·',  cost: 1,  passable: true,  desc: '无特殊影响' },
  forest:   { key: 'forest',   name: '森林', icon: '🌲', cost: 2,  passable: true,  desc: '进入消耗 2 点移动力，站在其中命中率 -20%' },
  river:    { key: 'river',    name: '河流', icon: '🌊', cost: 99, passable: false, desc: '无法通行，也不会生成单位' },
  mountain: { key: 'mountain', name: '高山', icon: '⛰️', cost: 99, passable: false, desc: '无法通行，也不会生成单位' },
};

const FOREST_MISS = 0.20;       // 站在森林中：命中率 -20%

// ------------------------------------------------------------
// 查询
// ------------------------------------------------------------
function terrainAt(x, y) {
  if (!G || !G.terrain || !G.terrain[y]) return 'plain';
  return G.terrain[y][x] || 'plain';
}

function terrainDef(x, y) {
  return TERRAIN[terrainAt(x, y)] || TERRAIN.plain;
}

function isPassable(x, y) {
  return terrainDef(x, y).passable;
}

function isForest(x, y) {
  return terrainAt(x, y) === 'forest';
}

// ------------------------------------------------------------
// 生成：最下两行永远保持平地（开阔的后方，避免开局就被地形困住）
//       敌我双方出生位置已改为「全盘随机」，不再依赖固定的上下分区
// ------------------------------------------------------------
function isSpawnProtected(x, y) {
  return y >= CONFIG.SIZE - 2;
}

function fillBlob(t, sx, sy, type, size) {
  const queue = [{ x: sx, y: sy }];
  let n = 0;
  while (queue.length && n < size) {
    const c = queue.shift();
    if (!inBounds(c.x, c.y)) continue;
    if (t[c.y][c.x] !== 'plain') continue;
    if (isSpawnProtected(c.x, c.y)) continue;
    t[c.y][c.x] = type;
    n++;
    // 随机向四周蔓延，形成不规则的斑块
    const dirs = shuffle([[0, -1], [0, 1], [-1, 0], [1, 0]]);
    for (const [dx, dy] of dirs) {
      if (Math.random() < 0.62) queue.push({ x: c.x + dx, y: c.y + dy });
    }
  }
  return n;
}

// 连通性 + 落脚点校验：不满足则整张图重新生成
function terrainOk(t) {
  const N = CONFIG.SIZE;
  const start = { x: 5, y: 6 };          // 连通性校验的起点（固定取一个下方格）
  if (!TERRAIN[t[start.y][start.x]].passable) return false;

  const seen = new Set([`${start.x},${start.y}`]);
  const queue = [start];
  while (queue.length) {
    const c = queue.shift();
    for (const [dx, dy] of [[0, -1], [0, 1], [-1, 0], [1, 0]]) {
      const nx = c.x + dx, ny = c.y + dy;
      if (!inBounds(nx, ny)) continue;
      const k = `${nx},${ny}`;
      if (seen.has(k)) continue;
      if (!TERRAIN[t[ny][nx]].passable) continue;
      seen.add(k);
      queue.push({ x: nx, y: ny });
    }
  }

  // 所有可通行格必须彼此连通（任何单位之间至少有一条路）
  let passableCount = 0;
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      if (TERRAIN[t[y][x]].passable) {
        passableCount++;
        if (!seen.has(`${x},${y}`)) return false;
      }
    }
  }
  if (passableCount < N * N * 0.6) return false;   // 别把地图堵得太死

  // 敌我双方都全盘随机出生 → 只看「全盘可通行格够不够站人」即可
  // （最多 7 我方 + 11 敌方 = 18 个单位，60% 的 64 格 = 38 格，足够）
  return passableCount >= 24;
}

function genTerrain(floor) {
  const N = CONFIG.SIZE;
  const plainMap = () => Array.from({ length: N }, () => Array(N).fill('plain'));

  for (let attempt = 0; attempt < 90; attempt++) {
    const t = plainMap();

    // 1) 障碍（河流 / 高山）：随层数略有增加，上限约 22%
    const blockGoal = Math.round(N * N * Math.min(0.22, 0.11 + floor * 0.003));
    let blocked = 0, guard = 0;
    while (blocked < blockGoal && guard++ < 400) {
      const sx = Math.floor(Math.random() * N);
      const sy = Math.floor(Math.random() * N);
      if (isSpawnProtected(sx, sy) || t[sy][sx] !== 'plain') continue;
      const type = Math.random() < 0.5 ? 'river' : 'mountain';
      blocked += fillBlob(t, sx, sy, type, 1 + Math.floor(Math.random() * 3));
    }

    // 2) 森林：可通行，撒得更散一些
    const forestGoal = Math.round(N * N * 0.13);
    let forested = 0; guard = 0;
    while (forested < forestGoal && guard++ < 400) {
      const sx = Math.floor(Math.random() * N);
      const sy = Math.floor(Math.random() * N);
      if (isSpawnProtected(sx, sy) || t[sy][sx] !== 'plain') continue;
      forested += fillBlob(t, sx, sy, 'forest', 1 + Math.floor(Math.random() * 3));
    }

    if (terrainOk(t)) return t;
  }

  // 兜底：极端情况下退回全平地，保证游戏永远能开局
  return plainMap();
}

// ------------------------------------------------------------
// 移动力消耗（Dijkstra：森林 2 步、平地 1 步、障碍不可进入、其他单位挡路）
// 返回 { 'x,y': cost }，起点本身为 0
// ------------------------------------------------------------
function computeMoveMap(u) {
  const cost = {};
  if (!u || !G.grid || !G.grid[u.y]) return cost;
  const startKey = `${u.x},${u.y}`;
  cost[startKey] = 0;
  const open = [{ x: u.x, y: u.y }];
  const done = new Set();

  while (open.length) {
    let bi = 0;
    for (let i = 1; i < open.length; i++) {
      if (cost[`${open[i].x},${open[i].y}`] < cost[`${open[bi].x},${open[bi].y}`]) bi = i;
    }
    const cur = open.splice(bi, 1)[0];
    const ck = `${cur.x},${cur.y}`;
    if (done.has(ck)) continue;
    done.add(ck);

    for (const [dx, dy] of [[0, -1], [0, 1], [-1, 0], [1, 0]]) {
      const nx = cur.x + dx, ny = cur.y + dy;
      if (!inBounds(nx, ny)) continue;
      const nk = `${nx},${ny}`;
      if (done.has(nk)) continue;
      // 飞行（鸟人）：无视地形——河流 / 高山可通行，森林不额外消耗
      if (!u.fly && !isPassable(nx, ny)) continue;
      if (G.grid[ny][nx]) continue;         // 被其他单位占用
      const step = u.fly ? 1 : terrainDef(nx, ny).cost;
      const nc = (cost[ck] || 0) + step;
      if (cost[nk] === undefined || nc < cost[nk]) {
        cost[nk] = nc;
        open.push({ x: nx, y: ny });
      }
    }
  }
  return cost;
}

// 从 u 走到 (tx,ty) 需要多少移动力（不可达返回 Infinity）
function moveCostTo(u, tx, ty) {
  const map = computeMoveMap(u);
  const c = map[`${tx},${ty}`];
  return c === undefined ? Infinity : c;
}

// ------------------------------------------------------------
// 本层地形统计 + 图例
// ------------------------------------------------------------
function terrainSummary() {
  const N = CONFIG.SIZE;
  const cnt = { plain: 0, forest: 0, river: 0, mountain: 0 };
  for (let y = 0; y < N; y++)
    for (let x = 0; x < N; x++)
      cnt[terrainAt(x, y)]++;
  return cnt;
}

// 地形图例（日志栏上栏）——固定 3 行，尽量不占空间
function terrainLegendHtml() {
  const f = TERRAIN.forest, r = TERRAIN.river, m = TERRAIN.mountain;
  return `<div class="tu-line"><b>${f.icon} ${f.name}</b>：移动耗 2 · 站其中命中 -20%</div>` +
         `<div class="tu-line"><b>${r.icon}${r.name} / ${m.icon}${m.name}</b>：不可通行，高山还会挡住直线攻击</div>` +
         `<div class="tu-line"><b>· 平地</b>：无影响（棋盘最下两行永远是平地）</div>`;
}

</script>
<script>
/* ===== battle/shape.js ===== */
// ============================================================
// 攻击距离 / 技能范围（纯判定，不做结算）
//
//   2026-10-24 第四次重做：
//     · 技能只剩法师一家（地火），鸟人 / 射手 / 英雄都是纯普攻单位
//     · 地火的「施法距离」= 射手 1 级的形状（十字第 2 格 + 斜角第 1 格），
//       固定不变远 —— 贴身第 1 格永远烧不到，站错位置就得先走一步
//     · 地火的「爆炸范围」按法师等级变（单体 → 十字 → 一圈）
//
//   每个单位每回合 = 移动一次 + 做一件事：
//     ① 攻击  在射程内点一个目标，只打这一个人
//     ② 技能  只有法师有：地火
//     ③ 待命  再点一次自己脚下的格子即可（board.js handleClick）
//
//   普攻形态 atkMode：
//     cross1      前后左右 1 格（鸟人 / 英雄 / 法师）
//     archerRing  十字第 2~N 格 + 斜角第 1~N-1 格（射手，N 随等级 2→3→4，里层不清空）
// ============================================================

// 技能表：按单位 type 取（现在只有法师有键）
//   kind   fire 地火（按等级扩爆炸范围）
//   cast   施法距离的形状：archerRing + castN = 十字第 N 格 + 斜角第 N-1 格
const SKILLS = {
