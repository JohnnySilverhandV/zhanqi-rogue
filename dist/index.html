          encAllDodge(-0.04);
          return '钱箱里的金币是实的。可当你抠下那颗黑曜石时，一阵恶心涌上所有人的嗓子眼，手脚都变得沉重迟钝。\n'
               + '身后，石像的嘴角似乎动了一下。\n【金币 +100 · 全队 攻击 -4 · 闪避 -4%】';
        },
      },
      { label: '敬而远之', run: () => '你按住想去摸钱箱的手，绕开石像继续赶路。' },
    ],
  },
];

// ---------------- 抽取 ----------------
function pickEncounter() {
  if (!G.encounterHistory) G.encounterHistory = [];
  let pool = ENCOUNTERS.filter(e => G.encounterHistory.indexOf(e.id) < 0);
  if (!pool.length) { G.encounterHistory = []; pool = ENCOUNTERS.slice(); }
  const ev = pick(pool);
  G.encounterHistory.push(ev.id);
  G.encounterCount = (G.encounterCount || 0) + 1;
  return ev;
}

// 该层通关后是否触发奇遇（每 7 层一次）
function encounterDue(clearedFloor) {
  return clearedFloor > 0 && clearedFloor % 7 === 0;
}

// ---------------- 弹窗 ----------------
function showEncounterModal(onDone, forcedEvent) {
  const ev = forcedEvent || pickEncounter();
  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  let resolved = false;

  function paintChoose() {
    modal.innerHTML = `
      <div class="modal enc-modal">
        <h2>❓ 奇遇</h2>
        <div class="enc-head">💰 金币 ${G.gold}</div>
        <div class="enc-icon">${ev.icon}</div>
        <div class="enc-title">${ev.title}</div>
        <div class="enc-text">${ev.text}</div>
        <div class="enc-options">
          ${ev.options.map((o, i) => {
            const poor = o.cost && G.gold < o.cost;
            return `<button class="btn enc-opt" id="enc-opt-${i}" ${poor ? 'disabled' : ''}>`
                 + `${o.label}${poor ? ' · 金币不足' : ''}</button>`;
          }).join('')}
        </div>
        <div class="enc-tip">选择会立即生效 · 每个选择都有代价，量力而行</div>
      </div>
    `;
    ev.options.forEach((o, i) => {
      const b = modal.querySelector('#enc-opt-' + i);
      if (!b) return;
      // 金币不够的选项直接置灰（HTML 里已带 disabled，这里再显式设置一次，避免依赖字符串）
      b.disabled = !!(o.cost && G.gold < o.cost);
      b.onclick = () => choose(o);
    });
  }

  function choose(opt) {
    if (resolved) return;
    resolved = true;
    if (opt.cost) G.gold -= opt.cost;

    const result = opt.run() || '……';
    log(`❓ 奇遇「${ev.title}」· 你选择了：${opt.label}`, 'encounter');
    String(result).split('\n').forEach(line => log('　└ ' + line, 'encounter'));

    recalcHeroStats();
    paintResult(result);
    saveGame();
  }

  function paintResult(result) {
    modal.innerHTML = `
      <div class="modal enc-modal">
        <h2>❓ ${ev.icon} ${ev.title}</h2>
        <div class="enc-result">${result}</div>
        <div class="enc-head">💰 金币 ${G.gold} · 队伍整装待发</div>
        <button class="btn" id="enc-continue">继续前进 ▶</button>
      </div>
    `;
    const btn = modal.querySelector('#enc-continue');
    if (btn) btn.onclick = () => {
      modal.remove();
      if (typeof onDone === 'function') onDone();
    };
  }

  paintChoose();
  document.body.appendChild(modal);
  log('❓ 路上遇到了奇遇……', 'encounter');
}

</script>
<script>
/* ===== ui/modal.js ===== */
// ============================================================
// 通用弹窗
// ============================================================

// 金币花费价（商店删除后，金币只在「通关三选一」里花）
//   重掷 / 多拿一张：同一次三选一里越用越贵（线性）
//   全队升级：按「本局已经买过几次」指数翻倍（180 → 360 → 720 → 1440 …）
function spendPrice(kind, n) {
  const S = CONFIG.SPEND;
  const off = (typeof metaDiscount === 'function') ? metaDiscount() : 0;
  let raw;
  if (kind === 'reroll')     raw = S.REROLL_BASE + (n || 0) * S.REROLL_STEP;
  else if (kind === 'extra') raw = S.EXTRA_BASE + (n || 0) * S.EXTRA_STEP;
  else                       raw = S.LEVEL_BASE * Math.pow(S.LEVEL_MULT || 2, n || 0);
  return Math.max(1, Math.floor(raw * (1 - off)));
}

// ------------------------------------------------------------
// 通关结算：三选一 + 金币筹码
//
//   商店已删除（2026-10-24 第四次大改），金币的用处全部搬到这张弹窗里：
//     · 重掷三张   换一批（选卡之前才有意义）
//     · 再拿一张   已经选了一张之后，再花金币带走一张
//     · 全队升 1 级 每层限一次
//   都在原地结算，点一下就出结果，没有二次弹窗。
// ------------------------------------------------------------
function showFloorClearModal() {
  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.innerHTML = `
    <div class="modal clear-modal">
      <h2>第 ${G.floor} 层通过！🎉</h2>
      <p class="clr-sub" id="clr-sub"></p>
      <div id="clear-cards"></div>
      <div class="clr-buys" id="clr-buys"></div>
      <button class="btn" id="next-floor" style="display:none;">进入下一层 ▶</button>
    </div>
  `;
  const cont  = modal.querySelector('#clear-cards');
  const buys  = modal.querySelector('#clr-buys');
  const sub   = modal.querySelector('#clr-sub');
  const nextBtn = modal.querySelector('#next-floor');

  let picks = 0;       // 本层已拿到的卡
  let rerolls = 0;     // 本层重掷次数（决定下一次的价钱）
  let extras = 0;      // 本层额外买的卡
  let leveled = 0;     // 本层是否已经花金币升过级
  let settling = false; // 正在选卡的那一小下，防止连点两张

  // ---- 卡牌三张 ----
  function paintCards() {
    settling = false;
    renderCardChoices(cont, onPick);
  }

  function onPick(card) {
    if (settling) return;
    settling = true;
    applyCard(card);
    log(`获得奖励卡牌：${card.name}`, 'system');

    // 「我命由我不由天」踩到 90% 分支：直接判定游戏失败，只能重开
    if (G.gameOver) {
      modal.remove();
      showFailModal('fate');
      return;
    }

    picks++;
    cont.querySelectorAll('.card-option').forEach(e => {
      e.style.opacity = '0.35';
      e.style.pointerEvents = 'none';
    });
    nextBtn.style.display = 'block';
    paint();
  }

  // ---- 金币筹码 ----
  function spend(price, what) {
    if (G.gold < price) return false;
    G.gold -= price;
    log(`💰 ${what}：-${price} 金（剩 ${G.gold}）`, 'system', true);
    saveGame();
    return true;
  }

  function buyReroll() {
    const price = spendPrice('reroll', rerolls);
    if (!spend(price, '重掷三张')) return;
    rerolls++;
    paintCards();
    paint();
    if (typeof DM !== 'undefined') DM.push(`💰 重掷：换了一批卡（-${price} 金）`, 'system');
  }

  function buyExtra() {
    const price = spendPrice('extra', extras);
    if (!spend(price, '再拿一张卡')) return;
    extras++;
    paintCards();
    paint();
    if (typeof DM !== 'undefined') DM.push(`💰 已经多拿 ${extras} 张卡`, 'system');
  }

  function buyLevel() {
    const price = spendPrice('level', G.levelBuys || 0);
    if (leveled) return;
    if (!spend(price, '全队升 1 级')) return;
    leveled = 1;
    G.levelBuys = (G.levelBuys || 0) + 1;   // 下一次升级的价钱 ×2
    G.allies.forEach(a => {
      a.level = (a.level || 1) + 1;
    });
    recalcHeroStats();
    G.allies.forEach(a => { a.hp = a.maxHp; });
    render();
    paint();
    if (typeof DM !== 'undefined') DM.result(`⭐ 全队升到 Lv${G.allies[0] ? G.allies[0].level : 1}！（-${price} 金）`, true);
  }

  function paint() {
    sub.innerHTML = `金币 <b>${G.gold}</b> · 本层免费拿 1 张卡` +
      (picks > 1 ? ` · 已经多拿 ${picks - 1} 张` : '');

    const btns = [];
    if (picks === 0) {
      const rp = spendPrice('reroll', rerolls);
      btns.push(`<button class="clr-buy" id="clr-reroll" ${G.gold < rp ? 'disabled' : ''}>` +
        `重掷三张<i>${rp} 金</i></button>`);
    } else {
      const ep = spendPrice('extra', extras);
      btns.push(`<button class="clr-buy" id="clr-extra" ${G.gold < ep ? 'disabled' : ''}>` +
        `再拿一张<i>${ep} 金</i></button>`);
    }
    const lp = spendPrice('level', G.levelBuys || 0);
    btns.push(`<button class="clr-buy" id="clr-level" ` +
      `${G.gold < lp || leveled ? 'disabled' : ''}>全队升 1 级<i>${leveled ? '本层已用' : lp + ' 金'}</i></button>`);
    buys.innerHTML = btns.join('');

    const rb = buys.querySelector('#clr-reroll');
    if (rb) rb.onclick = buyReroll;
    const eb = buys.querySelector('#clr-extra');
    if (eb) eb.onclick = buyExtra;
    const lb = buys.querySelector('#clr-level');
    if (lb) lb.onclick = buyLevel;
  }

  // ---- 进入下一层 ----
  nextBtn.onclick = () => {
    modal.remove();
    const jump = G.jumpFloor;
    G.jumpFloor = null;

    // 没有跳层指令，且已到最后一层 → 通关
    if (!jump && G.floor >= 99) { showGameClearModal(); return; }

    // 注意：必须在 initFloor 之前读当前层号
    const clearedFloor = G.floor;

    G.gold += CONFIG.GOLD.FLOOR_CLEAR;
    log(`通关奖励 +${CONFIG.GOLD.FLOOR_CLEAR} 金币（现有 ${G.gold}）`, 'system');
    // 先快照当前队伍成长，再进入下一层（等级/成长随之继承）
    G.allyProgress = snapshotAllies();

    const target = jump || (clearedFloor + 1);
    const enterNext = () => {
      initFloor(target);
      saveGame();
      render();
    };

    // 每 7 层 → 先触发奇遇，再进入下一层
    if (!jump && encounterDue(clearedFloor) && clearedFloor < 99) {
      log(`🎲 第 ${clearedFloor} 层通关，触发奇遇`, 'system');
      showEncounterModal(enterNext);
    } else {
      enterNext();
    }
  };

  paintCards();
  paint();
  document.body.appendChild(modal);
}

// ============================================================
// 通关 99 层：结算存档奖励 → 直接进入下一次挑战（无限刷）
// ============================================================
function showGameClearModal() {
  const m = (typeof loadMeta === 'function') ? loadMeta() : null;
  const clears = (m && m.clears) || 0;
  const nextClears = clears + 1;
  const talents = (typeof TALENTS !== 'undefined') ? TALENTS : [];

  // 预览本次会成长的天赋（grantClearRewards 之后才真正写入）
  const ups = talents.filter(t =>
    nextClears >= t.unlockAt && ((m && m.talents[t.id]) || 0) < t.max);
  const upLines = ups.map(t => {
    const lv = ((m && m.talents[t.id]) || 0) + 1;
    return `<div class="gc-row">${t.icon} <b>${t.name} Lv${lv}</b> — ${t.desc(lv)}</div>`;
  }).join('');

  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.innerHTML = `
    <div class="modal clear-modal">
      <h2>通关 99 层</h2>
      <p class="gc-sub">第 ${G.challenge || 1} 次挑战 · 累计通关将达 ${nextClears} 次</p>

      <div class="gc-sec">存档奖励（自动入库，任何地方都买不到）</div>
      <div class="gc-list">
        <div class="gc-row">💰 开局金币 <b>+${META_CLEAR_REWARD.gold}</b> — 下次挑战一进场就到钱包里</div>
      </div>

      ${upLines ? `<div class="gc-sec">天赋成长（永久生效）</div><div class="gc-list">${upLines}</div>` : ''}

      <div class="gc-tip">下一次挑战：卡牌 / 等级 / 金币全部回到 0，仓库里的开局军费会自动到账。</div>
      <button class="btn" id="next-run">开始第 ${(G.challenge || 1) + 1} 次挑战 ▶</button>
    </div>
  `;

  modal.querySelector('#next-run').onclick = () => {
    modal.remove();
    const gains = (typeof grantClearRewards === 'function') ? grantClearRewards() : [];
    restartRun((G.challenge || 1) + 1);

    // restartRun 会清屏，所以播报放在它之后
    if (typeof DM !== 'undefined') {
      DM.result('🏆 通关存档已入库：开局金币 +' + META_CLEAR_REWARD.gold, true);
      gains.forEach(function (g) {
        DM.push(g.talent.icon + ' ' + g.talent.name + ' Lv' + g.lv + ' — ' + g.talent.desc(g.lv), 'levelup');
      });
    }
  };
  document.body.appendChild(modal);
}

function showFailModal(reason) {
  const isFate = reason === 'fate';
  clearSave();   // 本局作废，读档不会回到已失败的进度

  const m = (typeof loadMeta === 'function') ? loadMeta() : null;
  const vaultLine = m
    ? `存档保留：累计通关 ${m.clears} 次 · 开局金币 ${m.vault.gold}`
    : '';

  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.innerHTML = `
    <div class="modal">
      <h2>${isFate ? '💀 天意难违' : '💀 英雄倒下了'}</h2>
      <p style="color:#ccc;margin-bottom:6px;">
        ${isFate ? '我命由我不由天……你被打回了原点' : '你爬到了第 ' + G.floor + ' 层'}
      </p>
      <p style="color:#888;font-size:12px;margin-bottom:6px;">本局卡牌 / 等级 / 金币清零</p>
      <p class="fail-vault">${vaultLine}</p>
      <button class="btn" id="restart">重新开始（第 ${(G.challenge || 1) + 1} 次挑战）</button>
    </div>
  `;
  // 重新开始：全新一局，仓库的开局军费自动到账（与通关新周目同一套逻辑）
  modal.querySelector('#restart').onclick = () => {
    modal.remove();
    restartRun((G.challenge || 1) + 1);
  };
  document.body.appendChild(modal);
}
</script>
<script>
/* ===== ui/tutorial.js ===== */
// ============================================================
// 新手引导（只在「第一次进第 1 层」时自动出现一次）
//
//   · 遮罩用 box-shadow 挖洞 + pointer-events:none —— 完全不挡点击，
//     所以玩家必须真的「点单位 → 走一步 → 出手」，教学才算过
//   · 4 步：选人 → 走位 → 出手（攻击 / 技能 / 待命）→ 结束回合
//   · 随时可从「说明」弹窗的「↻ 重看新手引导」重播
// ============================================================
const TUTORIAL_KEY = 'zhanqi_rouge_tutorial_v2';
const TUT_STEP_N = 4;

let tutState = null;          // { step, unit, hx, hy }
let tutBoardHandler = null;
let tutResizeHandler = null;
let tutTimer = null;

function tutorialSeen() {
  try { return !!localStorage.getItem(TUTORIAL_KEY); } catch (e) { return true; }
}

function tutMarkSeen() {
  try { localStorage.setItem(TUTORIAL_KEY, '1'); } catch (e) {}
}

// 自动触发的条件：第 1 层 / 没看过 / 当前没有在跑 / 游戏没结束
function tutShouldAutoRun() {
  return !!G && !tutState && !G.gameOver && G.floor === 1 && !tutorialSeen();
}

// ------------------------------------------------------------
// 启动 / 结束
// ------------------------------------------------------------
function startTutorial(force) {
  if (tutState) return;
  if (!force && tutorialSeen()) return;
  if (!G || G.gameOver) return;
  const board = document.getElementById('board');
  if (!board) return;

  tutState = { step: 0, unit: null, hx: -1, hy: -1 };
  tutBuildLayer();

  tutBoardHandler = function (ev) { tutBoardClick(ev); };
  board.addEventListener('click', tutBoardHandler, true);
  tutResizeHandler = function () { tutRelayout(); };
  window.addEventListener('resize', tutResizeHandler);

  // 轮询推进：走位 / 出手这两种「玩家真的做了」的状态，用状态比对来判，比猜事件可靠
  tutTimer = setInterval(tutTick, 260);

  // 从「干净状态」开始教：先取消选中，让玩家自己点
  G.selected = null;
  G.mode = null;
  render();
  tutGoto(1);
}

function tutFinish() {
  tutMarkSeen();
  tutCancel();
  log('💡 引导结束：点单位 → 蓝格移动 → 红格攻击（或技能 / 待命）→ 结束回合', 'system');
}

function tutCancel() {
  const board = document.getElementById('board');
  if (board) {
    board.classList.remove('tut-light');
    if (tutBoardHandler) board.removeEventListener('click', tutBoardHandler, true);
  }
  if (tutResizeHandler) window.removeEventListener('resize', tutResizeHandler);
  if (tutTimer) { clearInterval(tutTimer); tutTimer = null; }
  tutBoardHandler = null;
  tutResizeHandler = null;
  const layer = document.getElementById('tut-layer');
  if (layer) layer.remove();
  tutState = null;
  if (typeof clearShapePreview === 'function') clearShapePreview();
}

// 状态轮询：判断玩家是否真的走了 / 真的出手了
function tutTick() {
  if (!tutState) return;
  const u = tutState.unit;

  if (tutState.step === 2) {
    if (!G.selected && !(u && (u.x !== tutState.hx || u.y !== tutState.hy))) { tutGoto(1); return; }
    if (u && (u.x !== tutState.hx || u.y !== tutState.hy)) tutGoto(3);
    return;
  }
  if (tutState.step === 3) {
    if (!u || u.hp <= 0 || u.hasActed) tutGoto(4);
  }
}

// ------------------------------------------------------------
// DOM
// ------------------------------------------------------------
function tutBuildLayer() {
  const layer = document.createElement('div');
  layer.id = 'tut-layer';
  layer.innerHTML =
    '<div id="tut-spot"></div>' +
    '<div id="tut-tip">' +
      '<div class="tut-step" id="tut-step-no"></div>' +
      '<div class="tut-title" id="tut-title"></div>' +
      '<div class="tut-desc" id="tut-desc"></div>' +
      '<div class="tut-hint" id="tut-hint"></div>' +
      '<div class="tut-actions">' +
        '<button class="tut-skip" id="tut-skip">跳过</button>' +
        '<button class="tut-next" id="tut-next">下一步</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(layer);

  document.getElementById('tut-skip').onclick = function () { tutFinish(); };
  document.getElementById('tut-next').onclick = function () { tutNext(); };
}

// ------------------------------------------------------------
// 步骤
// ------------------------------------------------------------
function tutGoto(n) {
  if (!tutState) return;
  const board = document.getElementById('board');
  if (!board) { tutCancel(); return; }
  tutState.step = n;
  clearShapePreview();
  board.classList.remove('tut-light');

  const nextBtn = document.getElementById('tut-next');
  if (!nextBtn) return;

  if (n === 1) {
    const h = G.hero || G.allies[0];
    tutState.unit = null;
    tutShow(1, '先选中一个单位',
      '这局是<b>真正的战棋</b>：攻击不再自动，谁、往哪走、打谁，都由你点出来。<br>先点一下场上任意一个自己人。',
      '👆 点一下任意己方单位');
    tutHoleTo(tutCellEl(h), 4);
    tutPlaceTip(board.getBoundingClientRect());
    tutSetNext(false);
    return;
  }

  if (n === 2) {
    const u = tutState.unit;
    tutState.hx = u ? u.x : -1;
    tutState.hy = u ? u.y : -1;
    tutShow(2, '亮起来的格子就是能走的范围',
      '点任意一个<b>蓝格</b>走过去。平地耗 1 步、森林耗 2 步，河流和高山走不了。<br>移动不会结束行动 —— 走完还能出手。',
      '👆 点一个蓝格');
    board.classList.add('tut-light');
    tutPlaceTip(tutHoleTo(board, 6));
    tutSetNext(false);
    return;
  }

  if (n === 3) {
    const u = tutState.unit;
    const s = u ? skillOf(u) : null;
    const sName = u ? skillLabelOf(u) : '';
    tutShow(3, '现在出手：打谁？',
      '脚下的<b>淡红格</b>就是你这一下的射程，里面站着敌人的是<b>深红格</b>，点一下就开打（一次只打一个）。<br>' +
      (s ? `够不着就用技能【${sName}】：点「技能」，再点<b>紫色敌人</b>。` : '够不着就先走一步 —— 这回合还能出手。') +
      '<br>都不想动就<b>再点一下自己</b> —— 那就是待命。',
      '👆 点红格敌人 / 点技能 / 再点自己待命');
    if (u) previewAtkFrom(u, u.x, u.y);
    tutPlaceTip(tutHoleTo(board, 6));
    tutSetNext(false);
    return;
  }

  if (n === 4) {
    tutShow(4, '对了，敌人也会动',
      '四个人都出手完，会<b>自动换敌方回合</b>；想提前结束就点顶栏的「结束回合」。<br>剩下的全靠站位、射程和技能，去试试吧。',
      '');
    tutPlaceTip(tutHoleTo(document.getElementById('end-turn-btn'), 8));
    tutSetNext(true, '开始游戏');
  }
}

// 没有「下一步」的步骤（必须真的操作才能过），把「跳过」按钮拉满宽度
function tutSetNext(show, label) {
  const n = document.getElementById('tut-next');
  const k = document.getElementById('tut-skip');
  if (!n) return;
  n.style.display = show ? '' : 'none';
  if (label) n.textContent = label;
  if (k) {
    k.style.flex = show ? '0 0 auto' : '1';
    k.textContent = show ? '跳过' : '跳过引导';
  }
}

function tutNext() {
  if (!tutState) return;
  if (tutState.step >= TUT_STEP_N) { tutFinish(); return; }
  tutGoto(tutState.step + 1);
}

// ------------------------------------------------------------
// 点击推进：必须真的点到单位
// ------------------------------------------------------------
function tutBoardClick(ev) {
  if (!tutState) return;
  const board = document.getElementById('board');
  if (!board) return;

  // 从事件目标往上找 .cell（点到的可能是角标 / 血条等子节点）
  let cell = ev.target;
  while (cell && cell !== board &&
         !(cell.className && String(cell.className).indexOf('cell') >= 0)) {
    cell = cell.parentNode;
  }
  if (!cell || cell === board) return;

  const idx = Array.prototype.indexOf.call(board.children, cell);
  if (idx < 0) return;
  const x = idx % CONFIG.SIZE;
  const y = Math.floor(idx / CONFIG.SIZE);

  if (tutState.step === 1) {
    const u = G.grid[y][x];
    if (u && u.team === 'player') {
      tutState.unit = u;
      // 等 handleClick + renderBoard 跑完再切下一步
      setTimeout(function () {
        if (tutState && tutState.step === 1) tutGoto(2);
      }, 90);
    }
  }
}

// ------------------------------------------------------------
// 布局：挖洞 + 气泡定位
// ------------------------------------------------------------
function tutCellEl(u) {
  const board = document.getElementById('board');
  if (!board || !u) return null;
  return board.children[u.y * CONFIG.SIZE + u.x] || null;
}

function tutHoleTo(el, pad) {
  const spot = document.getElementById('tut-spot');
  if (!spot) return null;
  if (!el) {
    spot.style.display = 'none';
    return null;
  }
  const p = pad || 4;
  const r = el.getBoundingClientRect();
  const rect = { left: r.left - p, top: r.top - p, right: r.right + p, bottom: r.bottom + p };
  spot.style.display = 'block';
  spot.style.left = rect.left + 'px';
  spot.style.top = rect.top + 'px';
  spot.style.width = (rect.right - rect.left) + 'px';
  spot.style.height = (rect.bottom - rect.top) + 'px';
  return rect;
}

function tutShow(stepNo, title, desc, hint) {
  const no = document.getElementById('tut-step-no');
  const t = document.getElementById('tut-title');
  const d = document.getElementById('tut-desc');
  const h = document.getElementById('tut-hint');
  if (!no || !t || !d) return;
  no.textContent = '第 ' + stepNo + ' / ' + TUT_STEP_N + ' 步';
  t.textContent = title;
  d.innerHTML = desc;
  if (h) {
    h.textContent = hint || '';
    h.style.display = hint ? 'block' : 'none';
  }
}

function tutPlaceTip(rect) {
  const tip = document.getElementById('tut-tip');
  if (!tip) return;
  const vw = window.innerWidth || 800;
  const vh = window.innerHeight || 600;
  const tw = tip.offsetWidth || 300;
  const th = tip.offsetHeight || 150;

  let left = rect ? (rect.left + rect.right) / 2 - tw / 2 : (vw - tw) / 2;
  left = Math.max(8, Math.min(left, vw - tw - 8));

  let top;
  if (rect) {
    if (rect.bottom + 12 + th <= vh - 8) top = rect.bottom + 12;
    else if (rect.top - 12 - th >= 8) top = rect.top - 12 - th;
    else top = Math.max(8, vh - th - 8);
  } else {
    top = Math.max(8, (vh - th) / 2);
  }

  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}

function tutRelayout() {
  if (!tutState) return;
  const n = tutState.step;
  let target = null, pad = 6;
  if (n === 1) {
    tutHoleTo(tutCellEl(G.hero || G.allies[0]), 4);
    tutPlaceTip(document.getElementById('board').getBoundingClientRect());
    return;
  }
  else if (n === 2 || n === 3) target = document.getElementById('board');
  else if (n === 4) target = document.getElementById('end-turn-btn');
  tutPlaceTip(tutHoleTo(target, pad));
}

</script>
